name: Publish Docker Image

on:
  # Trigger on push
  push:
  # Trigger on all pull requests
  pull_request:
  # Trigger when a release is published
  release:
    types: ['published']

jobs:
  publish-container-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.15.0
    with:
      image-name: network-services-operator
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  # Deployed as a Component (config/components/consumer-ui-plugin) folded
  # into the cell's own kustomize bundle/Flux Kustomization — no separate
  # bundle for this image. Mirrors compute's consumer-ui-plugin publishing.
  publish-consumer-ui-plugin-image:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.20.0
    with:
      image-name: network-services-operator-consumer-ui-plugin
      context: ui/consumer
      dockerfile-path: ui/consumer/Dockerfile
    secrets: inherit

  publish-kustomize-bundles:
    # The bundle pins image references to this build, so only publish it once
    # the container image(s) it stamps have been built and pushed.
    needs: [publish-container-image, publish-consumer-ui-plugin-image]
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.20.0
    with:
      bundle-name: ghcr.io/datum-cloud/network-services-operator-kustomize
      bundle-path: config
      images: |
        - { path: config/manager, name: ghcr.io/datum-cloud/network-services-operator, tag: "${{ needs.publish-container-image.outputs.tag }}" }
        - { path: config/extension-server, name: ghcr.io/datum-cloud/network-services-operator, tag: "${{ needs.publish-container-image.outputs.tag }}" }
        - { path: config/cell, name: ghcr.io/datum-cloud/network-services-operator, tag: "${{ needs.publish-container-image.outputs.tag }}" }
        - { path: config/components/consumer-ui-plugin, name: ghcr.io/datum-cloud/network-services-operator-consumer-ui-plugin, tag: "${{ needs.publish-consumer-ui-plugin-image.outputs.tag }}" }
    secrets: inherit

name: Release Plugin

on:
  release:
    types: [published]

jobs:
  release-plugin:
    name: Build and attach the plugin archives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --config .goreleaser-plugin.yaml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-plugin-index:
    # One job per plugin: the catalog action downloads into a fixed path in its
    # workspace, so a second call in the same job fails on the first's file.
    name: Open the ${{ matrix.plugin }} catalog PR
    needs: [release-plugin]
    runs-on: ubuntu-latest
    # Every release of a plugin updates the same open catalog PR, so two
    # releases close together must not write its branch at once.
    concurrency:
      group: plugin-index-datum-cloud-datumctl-plugins-${{ matrix.plugin }}-main
      cancel-in-progress: false
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        plugin: [alb, network]
    steps:
      - name: Mint a catalog token from the release bot app
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          repositories: datumctl-plugins

      - name: Update the ${{ matrix.plugin }} plugin manifest
        uses: datum-cloud/actions/update-plugin-index@v1.24.0
        with:
          index-repo: datum-cloud/datumctl-plugins
          plugin-name: ${{ matrix.plugin }}
          version: ${{ github.event.release.tag_name }}
          token: ${{ steps.app-token.outputs.token }}

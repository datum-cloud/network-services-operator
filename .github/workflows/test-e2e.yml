name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    env:
      TMPDIR: /tmp
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '~1.26'

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          # kustomize v5.5.0 probes helm with `helm version -c`; the -c shorthand
          # was removed in helm 3.13, so pin to the last release that accepts it.
          version: v3.12.3

      # The same installer the federated workflow uses. An explicit `make` list
      # here meant the two workflows disagreed about which binaries exist, and
      # a tool added to the test-infra tools task reached only one of them.
      - name: Install pinned tools
        run: task test-infra:tools

      - name: Bring up the prod-fidelity env
        run: task test-infra:up

      - name: Run e2e suite
        run: task test-infra:test-e2e

      - name: Dump the downstream data plane on failure
        if: failure()
        run: |
          set +e
          UKC=${TMPDIR}/.kind-nso-upstream.yaml
          bin/kind-v0.32.0 get kubeconfig --name nso-upstream > "${UKC}"
          echo "::group::Upstream NSO manager"
          KUBECONFIG="${UKC}" kubectl -n network-services-operator-system get pods -o wide
          KUBECONFIG="${UKC}" kubectl -n network-services-operator-system describe deploy network-services-operator-controller-manager
          KUBECONFIG="${UKC}" kubectl -n network-services-operator-system describe pod -l app.kubernetes.io/name=network-services-operator
          KUBECONFIG="${UKC}" kubectl -n network-services-operator-system logs -l app.kubernetes.io/name=network-services-operator --tail=200 --all-containers
          echo "::endgroup::"
          echo "::group::Upstream cert-manager + webhook cert"
          KUBECONFIG="${UKC}" kubectl -n cert-manager get pods -o wide
          KUBECONFIG="${UKC}" kubectl -n network-services-operator-system get certificate,secret
          echo "::endgroup::"
          echo "::group::Milo (the project control-plane front door)"
          KUBECONFIG="${UKC}" kubectl -n milo-system get pods,certificate,svc -o wide
          KUBECONFIG="${UKC}" kubectl -n milo-system logs deploy/milo-apiserver --tail=200
          echo "::endgroup::"
          echo "::group::IPAM (aggregated into Milo, not into kind)"
          kubectl --kubeconfig "${TMPDIR}/.milo-admin.yaml" get apiservice v1alpha1.ipam.miloapis.com -o yaml
          KUBECONFIG="${UKC}" kubectl -n ipam-system get pods,certificate,configmap -o wide
          KUBECONFIG="${UKC}" kubectl -n ipam-system logs -l app=ipam-apiserver --tail=200 --all-containers
          KUBECONFIG="${UKC}" kubectl -n ipam-system get cluster.postgresql.cnpg.io -o wide
          KUBECONFIG="${UKC}" kubectl -n ipam-system describe cluster.postgresql.cnpg.io ipam-db
          KUBECONFIG="${UKC}" kubectl -n ipam-system logs -l cnpg.io/cluster=ipam-db --tail=100 --all-containers
          echo "::endgroup::"
          echo "::group::CloudNativePG operator"
          KUBECONFIG="${UKC}" kubectl -n cnpg-system get pods -o wide
          KUBECONFIG="${UKC}" kubectl -n cnpg-system logs deploy/cnpg-cloudnative-pg --tail=200
          echo "::endgroup::"
          echo "::group::IPAM fixtures (read through each project's control-plane path)"
          hack/ipam-project-kubectl.sh project-alpha get ipclasses,ippools -o wide
          hack/ipam-project-kubectl.sh project-beta get ipclasses,ippools -o wide
          echo "::endgroup::"
          KC=${TMPDIR}/.kind-nso-downstream.yaml
          bin/kind-v0.32.0 get kubeconfig --name nso-downstream > "${KC}"
          export KUBECONFIG="${KC}"
          echo "::group::GatewayClasses"
          kubectl get gatewayclass -o wide
          echo "::endgroup::"
          echo "::group::Gateways (all namespaces)"
          kubectl get gateway -A -o wide
          echo "::endgroup::"
          echo "::group::datum-downstream-gateway pods"
          kubectl -n datum-downstream-gateway get pods -o wide
          kubectl -n datum-downstream-gateway logs deploy/envoy-gateway --tail=200
          echo "::endgroup::"
          echo "::group::Extension server"
          kubectl -n network-services-operator-system get pods -o wide
          kubectl -n network-services-operator-system logs -l app.kubernetes.io/component=envoy-gateway-extension-server --tail=200
          echo "::endgroup::"

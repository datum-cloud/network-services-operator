version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
    gocyclo:
      min-complexity: 60
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # The validation packages are built almost entirely from field.ErrorList
      # accumulators that hold a handful of errors; preallocating them adds noise
      # without meaningful benefit.
      - linters:
          - prealloc
        path: internal/validation
      - linters:
          - staticcheck
        text: 'SA1019: \(sigs\.k8s\.io/controller-runtime\.Result\)\.Requeue is deprecated'
      - linters:
          - staticcheck
        path: _test\.go
        text: 'SA1019: \(github\.com/envoyproxy/gateway/api/v1alpha1\.'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

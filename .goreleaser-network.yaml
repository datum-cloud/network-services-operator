# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: datumctl-network

before:
  hooks:
    - go mod tidy

builds:
  - id: datumctl-network
    binary: datumctl-network
    main: ./cmd/datumctl-network
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # datumctl publishes no windows/arm64 asset name; drop the combination
      # rather than shipping an archive the plugin catalog can't resolve.
      - goos: windows
        goarch: arm64
    ldflags:
      - "-X main.version=v{{.Version}}"

archives:
  - id: datumctl-network
    ids:
      - datumctl-network
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

release:
  # Releases are tagged and published by hand with their own notes; keep the
  # plugin build from replacing them when it attaches its archives.
  mode: append
  # Dev tags (v0.29.0-dev.1) are previews, not the release users should land
  # on. "auto" keys off the tag's prerelease suffix, so a GA tag still
  # publishes as the latest release.
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-dev.{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

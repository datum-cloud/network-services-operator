version: '3'

# Production-fidelity test environment. Two kind clusters: nso-upstream (the
# control plane) and nso-downstream (the edge). Consumed by both the e2e and perf
# suites.
#
# Bring up:   task test-infra:up
# Tear down:  task test-infra:down
# Smoke:      task test-infra:smoke

# kustomize fetches some CRDs over https. A developer's global git config can
# rewrite https to ssh, which fails in a non-interactive fetch. Neutralize the
# global git config for kustomize's child git so the https fetches succeed; the
# repo-local config is untouched.
env:
  GIT_CONFIG_GLOBAL: /dev/null

vars:
  TMP_DIR:
    sh: echo "${TMPDIR:-/tmp}"
  REPO:
    sh: pwd
  # Pinned-to-prod tooling. We use an explicit kind v0.32.0 binary because it
  # ships the node image production runs, which the checked-in bin/kind predates.
  KIND: '{{.REPO}}/bin/kind-v0.32.0'
  KUSTOMIZE: '{{.REPO}}/bin/kustomize'
  CMCTL: '{{.REPO}}/bin/cmctl'
  KARMADACTL: '{{.REPO}}/bin/karmadactl'
  CHAINSAW: '{{.REPO}}/bin/chainsaw'

  UPSTREAM_CLUSTER: nso-upstream
  DOWNSTREAM_CLUSTER: nso-downstream
  UPSTREAM_CTX: kind-nso-upstream
  DOWNSTREAM_CTX: kind-nso-downstream

  # The exact node image the production edge runs.
  K8S_NODE_IMAGE: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
  # Gateway control-plane version, matching production. The extension-server SDK
  # version is paired with it deliberately, also matching production.
  ENVOY_GATEWAY_VERSION: v1.7.4
  EG_SDK_VERSION: v1.8.1
  # Multi-arch WAF image — the same filter as the production edge, but it also
  # loads natively on arm64 dev hosts. The data plane references this image.
  CORAZA_WAF_IMAGE: ghcr.io/datum-labs/coraza-envoy-go-filter/coraza-waf:v1.3.0-multiarch.1
  # CONNECT-proxy stand-in for the connector-tunnel scenario, built from
  # test/e2e-edge/_fixtures/connector-tunnel and loaded into the downstream cluster.
  CONNECT_PROXY_IMAGE: connect-proxy:e2e
  # The WAF is enabled by default since the multi-arch image loads on every
  # architecture. Set CORAZA_DISABLED=true only to deliberately skip the WAF.
  CORAZA_DISABLED: '{{.CORAZA_DISABLED | default "false"}}'
  # Karmada-bundled kube-apiserver, pinned to production.
  KARMADA_APISERVER_VERSION: v1.33.2
  # NSO image pinned by git SHA so the loaded image is used deterministically.
  IMG:
    sh: echo "ghcr.io/datum-cloud/network-services-operator:$(git rev-parse --short HEAD)"

  # IPAM runs on the upstream cluster as the project control plane NSO claims
  # addresses from. Its manifests come from the bundle milo-os/ipam publishes on
  # every push to main, and its image from ghcr.io — both at the commit go.mod
  # pins, so the apiserver and the Go client NSO compiles against stay in
  # lockstep. Nothing is built locally: the image is pulled from ghcr by
  # digest, multi-arch since upstream 13bd2c8 fixed the arm64 build.
  #
  # Digest, not tag: the release workflow republishes on every push, so the tag
  # can move. The tag is kept alongside for legibility. Update all three
  # together, and keep IPAM_COMMIT equal to the go.mod replace directive —
  # ipam-bundle fails if the artifact does not carry that commit.
  IPAM_BUNDLE_REPO: ghcr.io/milo-os/ipam-kustomize
  IPAM_BUNDLE_TAG: v0.0.0-2f31bea
  IPAM_BUNDLE_DIGEST: sha256:f006b5604a924b0ce33adf98644cb106234b75a80fcc937214f3f7e327f8c2eb
  IPAM_COMMIT: 2f31bea79f624c5a94437dc20d82f8f8bdac666e
  IPAM_STAGE: '{{.TMP_DIR}}/.ipam-bundle'

  # The dns-operator CRDs come from its published bundle at the version go.mod
  # pins, so the CRDs installed and the types NSO compiles against match.
  DNS_BUNDLE_REPO: ghcr.io/datum-cloud/dns-operator-kustomize
  DNS_BUNDLE_TAG: v0.5.1
  DNS_BUNDLE_DIGEST: sha256:cd7dd3a0d2fbbbaa029f2b5e083723a675e88c89e56f999257ff4bd87221cd4a
  DNS_STAGE: '{{.TMP_DIR}}/.dns-bundle'
  # Milo, the control plane that fronts IPAM. The operator addresses a project
  # by control-plane path and Milo is what resolves the project from that path,
  # so nothing about project-scoped IPAM is exercised without it.
  #
  # Its manifests come from the bundle milo-os/milo publishes on every release,
  # and its image from ghcr.io — both at the same version, so the flags the
  # manifests set and the binary that reads them stay in lockstep. Nothing is
  # built locally and the node pulls the image anonymously, like IPAM's.
  #
  # Digest, not tag: the tag identifies the release, but a tag can be
  # republished. The tag is kept alongside for legibility. Update both together,
  # and with the image digest in config/dependencies/milo/root-kustomization.yaml
  # — milo-bundle fails if the artifact does not carry MILO_BUNDLE_TAG.
  MILO_BUNDLE_REPO: ghcr.io/milo-os/milo-kustomize
  MILO_BUNDLE_TAG: v0.32.5
  MILO_BUNDLE_DIGEST: sha256:975896513b3afda4400eb09f8a5602000c52fd35f14284258803266f5d2ee1a9
  MILO_STAGE: '{{.TMP_DIR}}/.milo-bundle'
  # The NodePort Milo's Service publishes, mapped to the same host port by
  # config/tools/kind/upstream-cluster.yaml. The chainsaw suites run on the host
  # and reach Milo through it.
  MILO_NODE_PORT: 32450
  # Kubeconfigs written for host-side callers. The admin one bootstraps Milo;
  # the per-project ones are what the suites and the fixture seeder use, and
  # their server URL carries the project's control-plane path.
  MILO_ADMIN_KUBECONFIG: '{{.TMP_DIR}}/.milo-admin.yaml'
  MILO_ROOT_KUBECONFIG: '{{.TMP_DIR}}/.milo-root.yaml'

  CRANE: '{{.REPO}}/bin/crane'
  CRANE_VERSION: v0.21.7
  IPAM_PROJECTS: project-alpha project-beta

tasks:

  tools:
    desc: "Install the pinned tool binaries this env needs into bin/ (kind v0.32.0, karmadactl, kustomize, cmctl, chainsaw, crane). Idempotent — skips any already present. Lets CI and a clean checkout bring up the env without hand-placed binaries."
    vars:
      KIND_TOOL_VERSION: v0.32.0
      KARMADACTL_VERSION: v1.15.2
      KUSTOMIZE_VERSION: v5.5.0
      CMCTL_VERSION: v2.1.1
      CHAINSAW_VERSION: v0.2.15
    cmds:
      - mkdir -p {{.REPO}}/bin
      - |
        if [ ! -x {{.REPO}}/bin/kind-{{.KIND_TOOL_VERSION}} ]; then
          echo "installing kind {{.KIND_TOOL_VERSION}}"
          GOBIN={{.REPO}}/bin go install sigs.k8s.io/kind@{{.KIND_TOOL_VERSION}}
          mv {{.REPO}}/bin/kind {{.REPO}}/bin/kind-{{.KIND_TOOL_VERSION}}
        fi
      - '[ -x {{.REPO}}/bin/kustomize ] || GOBIN={{.REPO}}/bin go install sigs.k8s.io/kustomize/kustomize/v5@{{.KUSTOMIZE_VERSION}}'
      - '[ -x {{.REPO}}/bin/cmctl ] || GOBIN={{.REPO}}/bin go install github.com/cert-manager/cmctl/v2@{{.CMCTL_VERSION}}'
      - '[ -x {{.REPO}}/bin/chainsaw ] || GOBIN={{.REPO}}/bin go install github.com/kyverno/chainsaw@{{.CHAINSAW_VERSION}}'
      # crane reads the published IPAM manifest bundle out of ghcr.io. The flux
      # CLI can do this too, but its go.mod replace directives stop `go install`
      # building it, and crane is a much smaller dependency than all of flux for
      # one registry read.
      - '[ -x {{.REPO}}/bin/crane ] || GOBIN={{.REPO}}/bin go install github.com/google/go-containerregistry/cmd/crane@{{.CRANE_VERSION}}'
      # karmadactl carries replace directives in its go.mod, so `go install` can't
      # build it; pull the published release binary for this OS/arch instead.
      - |
        if [ ! -x {{.REPO}}/bin/karmadactl ]; then
          url="https://github.com/karmada-io/karmada/releases/download/{{.KARMADACTL_VERSION}}/karmadactl-{{OS}}-{{ARCH}}.tgz"
          echo "downloading karmadactl {{.KARMADACTL_VERSION}} ({{OS}}/{{ARCH}})"
          curl -fsSL "$url" | tar -xz -C {{.REPO}}/bin karmadactl
        fi
      - echo "tools ready in {{.REPO}}/bin"

  up:
    desc: "Bring the canonical two-cluster prod-fidelity test env ONLINE (clusters + Milo + IPAM + EG v1.7.4 + ext-server + Coraza data plane + NSO manager). IPAM is aggregated into Milo and addressed by project control-plane path; read test/e2e/README-milo.md before treating this env as evidence about per-project AUTHORIZATION, which it does not test."
    cmds:
      - echo "🚀 test-infra:up — building nso-upstream + nso-downstream"
      - task: clusters
      # The Gateway-API and gateway CRDs must land on the downstream cluster
      # before cert-manager (it probes the Gateway-API CRDs at startup) and before
      # the downstream gateway (it needs its own CRDs present).
      - task: eg-crds
      - task: downstream-crds
      - task: downstream-namespaces
      - task: cert-manager-upstream
      - task: cert-manager-downstream
      # Fetched early: they depend on nothing in the cluster, and pulling them
      # here surfaces a registry problem before the long build below.
      - task: ipam-bundle
      - task: milo-bundle
      - task: nso-image
      - task: dns-crds
      - task: prepare-upstream
      # Everything that needs a certificate has to follow prepare-upstream.
      # Upstream cert-manager crashloops with "the Gateway API CRDs do not seem
      # to be present" until prepare-upstream installs them, so before this
      # point nothing can be issued at all.
      #
      # That is why Milo lands here rather than alongside the other
      # infrastructure: its serving certificate and the front-proxy client
      # certificate its aggregator authenticates to IPAM with both come from
      # cert-manager. The stand-in Milo this replaced self-signed with openssl
      # precisely to sit earlier in this list; a real Milo does not need to.
      - task: milo-deploy
      - task: milo-wait
      - task: milo-kubeconfigs
      # The manager mounts this secret. It is created a moment after the pod
      # rather than before it now, because its contents — Milo's address and CA
      # — do not exist until Milo does. The pod waits in ContainerCreating and
      # starts as soon as this lands; wait-ready is what gates on the result.
      - task: ipam-kubeconfig
      - task: cnpg-operator
      - task: ipam-deploy
      - task: ipam-wait
      # Projects, Milo-side RBAC, and IPAM's registration as an aggregated API
      # inside Milo. Needs IPAM's serving CA, so it follows ipam-wait.
      - task: milo-bootstrap
      # Nothing may assume the front door works: prove it with a real request
      # through a project path before any suite depends on one.
      - task: milo-ipam-gate
      - task: ipam-fixtures
      - task: ipam-namespaces
      - task: eg-downstream
      - task: extension-server
      - task: billing-usage-collector
      - task: external-dns
      - task: karmada-up
      - task: karmada-hub-secret
      - task: location-fixtures
      - task: link-clusters
      - task: wait-ready
      - echo "🎉 test-infra:up complete. Run 'task test-infra:smoke' to confirm M2."

  down:
    desc: "Tear down the test-infra clusters (and any Karmada host)."
    cmds:
      - echo "💥 test-infra:down"
      # Deleting both kind clusters removes all federation state, so this unjoin
      # is only a best-effort courtesy.
      - '{{.KARMADACTL}} deinit --context {{.UPSTREAM_CTX}} --force --purge-namespace 2>/dev/null || true'
      - rm -rf {{.TMP_DIR}}/karmada-{{.UPSTREAM_CLUSTER}}
      - '{{.KIND}} delete cluster --name {{.UPSTREAM_CLUSTER}} || true'
      - '{{.KIND}} delete cluster --name {{.DOWNSTREAM_CLUSTER}} || true'
      - rm -f {{.TMP_DIR}}/.kind-{{.DOWNSTREAM_CLUSTER}}-internal.yaml {{.TMP_DIR}}/.kind-{{.UPSTREAM_CLUSTER}}.yaml {{.TMP_DIR}}/.kind-{{.DOWNSTREAM_CLUSTER}}.yaml
      # The Milo kubeconfigs carry a bearer token. They go with the cluster that
      # issued them rather than being left behind for the next env to inherit.
      - rm -f {{.MILO_ADMIN_KUBECONFIG}} {{.MILO_ROOT_KUBECONFIG}} {{.TMP_DIR}}/.milo-project-*.yaml
      - rm -rf {{.IPAM_STAGE}} {{.DNS_STAGE}} {{.MILO_STAGE}}
      - echo "✨ done."

  clusters:
    desc: "Create the upstream + downstream kind clusters pinned to the prod edge node image."
    cmds:
      - echo "🏗️ creating clusters (node {{.K8S_NODE_IMAGE}})"
      - '{{.KIND}} delete cluster --name {{.UPSTREAM_CLUSTER}} 2>/dev/null || true'
      - '{{.KIND}} delete cluster --name {{.DOWNSTREAM_CLUSTER}} 2>/dev/null || true'
      - '{{.KIND}} create cluster --image {{.K8S_NODE_IMAGE}} --config=config/tools/kind/upstream-cluster.yaml'
      - '{{.KIND}} create cluster --image {{.K8S_NODE_IMAGE}} --config=config/tools/kind/downstream-cluster.yaml'
      # Running the full federation control plane alongside the rest of the stack
      # in one kind node exhausts the default file-watch limits on the macOS
      # Docker VM, which crashloops a component with "too many open files" and
      # blocks the member join. Raise the limits on both nodes.
      - docker exec {{.UPSTREAM_CLUSTER}}-control-plane sysctl -w fs.inotify.max_user_instances=8192 fs.inotify.max_user_watches=1048576
      - docker exec {{.DOWNSTREAM_CLUSTER}}-control-plane sysctl -w fs.inotify.max_user_instances=8192 fs.inotify.max_user_watches=1048576

  cert-manager-upstream:
    desc: "Install cert-manager (+ CSI driver) on the upstream cluster."
    cmds:
      - '{{.KUSTOMIZE}} build --enable-helm config/tools/cert-manager | kubectl --context {{.UPSTREAM_CTX}} apply --server-side=true --force-conflicts -f -'
      - '{{.CMCTL}} check api --context {{.UPSTREAM_CTX}} --wait=5m'

  cert-manager-downstream:
    desc: "Install cert-manager (+ CSI driver) on the downstream cluster."
    cmds:
      - '{{.KUSTOMIZE}} build --enable-helm config/tools/cert-manager | kubectl --context {{.DOWNSTREAM_CTX}} apply --server-side=true --force-conflicts -f -'
      - '{{.CMCTL}} check api --context {{.DOWNSTREAM_CTX}} --wait=5m'

  nso-image:
    desc: "Build the NSO operator image (git-SHA tag) and load it into both clusters."
    cmds:
      - echo "🔨 building {{.IMG}}"
      - docker build -t {{.IMG}} .
      - cd config/manager && {{.KUSTOMIZE}} edit set image ghcr.io/datum-cloud/network-services-operator={{.IMG}}
      # The cell Deployment carries its own image name so the component's
      # transformer cannot rewrite the control-plane Deployment.
      - cd config/components/cell-controllers && {{.KUSTOMIZE}} edit set image network-services-operator-cell={{.IMG}}
      - '{{.KIND}} load docker-image {{.IMG}} --name {{.UPSTREAM_CLUSTER}}'
      - '{{.KIND}} load docker-image {{.IMG}} --name {{.DOWNSTREAM_CLUSTER}}'

  dns-crds:
    desc: "Install the dns-operator CRDs (DNSZone / DNSRecordSet / DNSZoneClass) on the upstream cluster from the operator's published bundle, pinned by digest at the version go.mod pins. Required before prepare-upstream when gateway.enableDNSIntegration is true, since the operator indexes and watches these types at startup."
    cmds:
      - |
        set -e
        stage="{{.DNS_STAGE}}"
        if [ -f "$stage/.digest" ] && [ "$(cat "$stage/.digest")" = "{{.DNS_BUNDLE_DIGEST}}" ]; then
          echo "📜 dns-operator bundle already staged ({{.DNS_BUNDLE_TAG}})" >&2
        else
          echo "📜 fetching {{.DNS_BUNDLE_REPO}}:{{.DNS_BUNDLE_TAG}}" >&2
          rev=$({{.REPO}}/hack/fetch-oci-bundle.sh \
            {{.CRANE}} {{.CRANE_VERSION}} \
            {{.DNS_BUNDLE_REPO}} {{.DNS_BUNDLE_DIGEST}} {{.DNS_BUNDLE_TAG}} "$stage/bundle")
          echo "✅ fetched $rev" >&2
          echo "{{.DNS_BUNDLE_DIGEST}}" > "$stage/.digest"
        fi
      - echo "📜 installing dns-operator CRDs (upstream)"
      - kubectl --context {{.UPSTREAM_CTX}} apply -f {{.DNS_STAGE}}/bundle/crd/bases/dns.networking.miloapis.com_dnszoneclasses.yaml
      - kubectl --context {{.UPSTREAM_CTX}} apply -f {{.DNS_STAGE}}/bundle/crd/bases/dns.networking.miloapis.com_dnszones.yaml
      - kubectl --context {{.UPSTREAM_CTX}} apply -f {{.DNS_STAGE}}/bundle/crd/bases/dns.networking.miloapis.com_dnsrecordsets.yaml

  prepare-upstream:
    desc: "Deploy the NSO manager + webhook (config/e2e) on the upstream cluster, with the prod-base memory profile."
    cmds:
      - echo "🔧 deploying NSO manager (upstream)"
      - '{{.KUSTOMIZE}} build config/e2e | kubectl --context {{.UPSTREAM_CTX}} apply --server-side=true --force-conflicts -f -'
      # The HTTPProxy controller builds every proxy's gateway with the
      # operator-configured class, so that class must outlive any single
      # scenario. A test that provisions it owns it, and chainsaw deletes it on
      # cleanup while gateways are still terminating, wedging their namespaces.
      - kubectl --context {{.UPSTREAM_CTX}} apply -f config/upstream_resources/gatewayclass.yaml

  eg-crds:
    desc: "Install the full Gateway-API + Envoy Gateway CRD set (incl ReferenceGrant + EnvoyProxy) on the downstream cluster. The downstream EG chart sets includeCRDs:false, so CRDs are applied separately (matches prod, where CRDs are managed out-of-band)."
    vars:
      EG_CRD_DIR: config/tools/envoy-gateway-downstream/charts/gateway-helm-{{.ENVOY_GATEWAY_VERSION}}/gateway-helm/crds
    cmds:
      # The gateway-helm chart is gitignored (config/**/charts); vendor it first
      # so the CRD files below exist on a fresh checkout (e.g. CI). Output is
      # discarded — this runs for the side effect of pulling the chart.
      - '{{.KUSTOMIZE}} build --enable-helm config/tools/envoy-gateway-downstream >/dev/null'
      - kubectl --context {{.DOWNSTREAM_CTX}} apply --server-side=true --force-conflicts -f {{.EG_CRD_DIR}}/gatewayapi-crds.yaml
      - kubectl --context {{.DOWNSTREAM_CTX}} apply --server-side=true --force-conflicts -f {{.EG_CRD_DIR}}/generated/

  downstream-namespaces:
    desc: "Create the downstream gateway + hostname-accounting namespaces, plus the EG-watched e2e-direct namespace for hand-delivered fixtures (D1/D2). Runs BEFORE eg-downstream so e2e-direct carries its watch label before EG establishes its informer."
    cmds:
      - kubectl --context {{.DOWNSTREAM_CTX}} apply -f config/dev/downstream_resources/namespaces.yaml
      # e2e-direct carries the gateway watch label from creation so gateways
      # applied directly here reconcile deterministically. The gateway only
      # reliably watches a namespace labeled at creation time, so the label must
      # be in the manifest, not added afterward.
      - kubectl --context {{.DOWNSTREAM_CTX}} apply -f config/e2e-downstream/direct-namespace.yaml

  billing-usage-collector:
    desc: "Install the billing usage collector (Vector agent) that tails the downstream Envoy access logs and emits usage CloudEvents."
    cmds:
      - echo "🔧 installing billing-usage-collector (Vector agent, tailing datum-downstream-gateway)"
      - |
        for attempt in 1 2 3 4 5; do
          if {{.KUSTOMIZE}} build --enable-helm config/tools/billing-usage-collector | kubectl --context {{.DOWNSTREAM_CTX}} apply --server-side=true --force-conflicts -f -; then
            exit 0
          fi
          echo "billing-usage-collector install failed (attempt ${attempt}/5); retrying in ${attempt}0s..."
          sleep $((attempt * 10))
        done
        echo "billing-usage-collector install failed after 5 attempts"
        exit 1

  eg-downstream:
    desc: "Install the dedicated downstream Envoy Gateway (v1.7.4) with the ext-server extensionManager wiring on the downstream cluster."
    cmds:
      - echo "🔧 installing downstream EG {{.ENVOY_GATEWAY_VERSION}} (+ extensionManager, failOpen:false, maxMessageSize:256Mi)"
      # Build from the untracked config/e2e-downstream/eg-downstream copy, which
      # bakes in the e2e pins, so a hard reset on the shared branch cannot revert
      # them — it kept clobbering the tracked copy.
      - '{{.KUSTOMIZE}} build --enable-helm config/e2e-downstream/eg-downstream | kubectl --context {{.DOWNSTREAM_CTX}} apply --server-side=true --force-conflicts -f -'

  load-coraza-waf:
    desc: "Fallback: pull the Coraza WAF image and kind-load it into the downstream cluster (offline-CI escape hatch)."
    cmds:
      - docker pull {{.CORAZA_WAF_IMAGE}}
      - '{{.KIND}} load docker-image {{.CORAZA_WAF_IMAGE}} --name {{.DOWNSTREAM_CLUSTER}}'

  load-fixtures:
    desc: "Build + load the e2e fixture images into the downstream cluster (CONNECT-proxy stand-in for the connector-tunnel scenario)."
    cmds:
      - echo "🔧 building + loading fixture image {{.CONNECT_PROXY_IMAGE}}"
      - docker build -t {{.CONNECT_PROXY_IMAGE}} test/e2e-edge/_fixtures/connector-tunnel
      - '{{.KIND}} load docker-image {{.CONNECT_PROXY_IMAGE}} --name {{.DOWNSTREAM_CLUSTER}}'

  d1-mint-expired-secret:
    desc: "D1 helper: mint an ALREADY-EXPIRED kubernetes.io/tls Secret and apply it to the downstream cluster, bypassing the upstream #212 cert-health gate so the ext-server prune backstop can be tested in isolation. Vars: NAMESPACE, SECRET, HOSTNAME."
    vars:
      # Default to the pre-provisioned, gateway-watched namespace so a gateway
      # applied alongside this secret reconciles deterministically.
      NAMESPACE: '{{.NAMESPACE | default "e2e-direct"}}'
      SECRET: '{{.SECRET | default "d1-expired-tls"}}'
      HOSTNAME: '{{.HOSTNAME | default "d1-bad.e2e.env.datum.net"}}'
    cmds:
      - |
        config/e2e-downstream/d1-cert-bypass/mint-expired-secret.sh \
          "{{.NAMESPACE}}" "{{.SECRET}}" "{{.HOSTNAME}}" \
          | kubectl --context {{.DOWNSTREAM_CTX}} apply -f -
      - echo "✅ applied expired TLS Secret {{.NAMESPACE}}/{{.SECRET}} (host {{.HOSTNAME}}) to {{.DOWNSTREAM_CLUSTER}}"

  extension-server:
    desc: "Deploy the ext-server (2 replicas + PDB + mTLS) + e2e cert chain + Coraza/branded-page config + test EnvoyProxy (Coraza+admin:19000) on the downstream cluster."
    cmds:
      - echo "🔧 deploying ext-server + e2e issuer chain + test EnvoyProxy (config/e2e-downstream)"
      # Pin the ext-server image to the git-SHA build (same image as the manager).
      - cd config/e2e-downstream && {{.KUSTOMIZE}} edit set image ghcr.io/datum-cloud/network-services-operator={{.IMG}} 2>/dev/null || true
      - '{{.KUSTOMIZE}} build config/e2e-downstream | kubectl --context {{.DOWNSTREAM_CTX}} apply --server-side=true --force-conflicts -f -'
      # WAF disable toggle. The overlay ships the WAF enabled for production
      # fidelity; when CORAZA_DISABLED is set we flip the live config so listeners
      # program without it.
      - |
        if [ "{{.CORAZA_DISABLED}}" = "true" ]; then
          echo "⚠️  Coraza WAF disabled (host arch {{OS}}/$(uname -m); WAF .so is amd64-only)"
          kubectl --context {{.DOWNSTREAM_CTX}} -n network-services-operator-system get cm extension-server-config -o yaml \
            | sed 's/disabled: false/disabled: true/' | kubectl --context {{.DOWNSTREAM_CTX}} apply -f -
        fi
      # The extension server's server cert and the gateway's client cert are both
      # issued from the e2e certificate authority. Wait for that authority's cert,
      # then publish it where each side reads it so they can verify each other.
      - task: extserver-ca-bundle

  extserver-ca-bundle:
    desc: "Publish the e2e CA's ca.crt into the ext-server CA-bundle ConfigMap and the EG certificateRef Secret (both in network-services-operator-system)."
    cmds:
      - echo "⏳ waiting for the e2e CA certificate to be issued"
      - |
        kubectl --context {{.DOWNSTREAM_CTX}} -n cert-manager wait certificate e2e-extension-server-ca \
          --for=condition=Ready --timeout=120s
      - kubectl --context {{.DOWNSTREAM_CTX}} create namespace network-services-operator-system --dry-run=client -o yaml | kubectl --context {{.DOWNSTREAM_CTX}} apply -f -
      - |
        CA_CRT=$(kubectl --context {{.DOWNSTREAM_CTX}} -n cert-manager get secret e2e-extension-server-ca -o jsonpath='{.data.ca\.crt}' | base64 -d)
        # The certificate-authority bundle the extension server mounts.
        kubectl --context {{.DOWNSTREAM_CTX}} -n network-services-operator-system create configmap extension-server-ca-bundle \
          --from-literal=ca.crt="$CA_CRT" --dry-run=client -o yaml | kubectl --context {{.DOWNSTREAM_CTX}} apply -f -
        # The same authority cert the downstream gateway references. The gateway
        # reads it from the tls.crt key, not ca.crt.
        kubectl --context {{.DOWNSTREAM_CTX}} -n network-services-operator-system create secret generic e2e-extension-server-ca \
          --from-literal=tls.crt="$CA_CRT" --dry-run=client -o yaml | kubectl --context {{.DOWNSTREAM_CTX}} apply -f -
      # Restart the extension server so it picks up the freshly-published bundle.
      - kubectl --context {{.DOWNSTREAM_CTX}} -n network-services-operator-system rollout restart deploy network-services-operator-envoy-gateway-extension-server || true

  downstream-crds:
    desc: "Install the NSO CRDs the replicator mirrors into the downstream cluster (the Gateway-API/EG CRDs come from eg-crds)."
    cmds:
      - kubectl --context {{.DOWNSTREAM_CTX}} apply -f config/crd/bases/networking.datumapis.com_connectors.yaml
      - kubectl --context {{.DOWNSTREAM_CTX}} apply -f config/crd/bases/networking.datumapis.com_httpproxies.yaml
      - kubectl --context {{.DOWNSTREAM_CTX}} apply -f config/crd/bases/networking.datumapis.com_trafficprotectionpolicies.yaml
      - kubectl --context {{.DOWNSTREAM_CTX}} apply -f config/crd/bases/networking.datumapis.com_servinglocations.yaml
      - kubectl --context {{.DOWNSTREAM_CTX}} apply -f config/crd/bases/networking.datumapis.com_networkcontexts.yaml
      - kubectl --context {{.DOWNSTREAM_CTX}} apply -f config/crd/bases/networking.datumapis.com_subnets.yaml

  external-dns:
    desc: "Install external-dns CRDs (DNSEndpoint) on the downstream cluster."
    cmds:
      - '{{.KUSTOMIZE}} build --enable-helm config/tools/external-dns | kubectl --context {{.DOWNSTREAM_CTX}} apply --server-side=true --force-conflicts -f -'

  link-clusters:
    desc: "Wire the NSO manager's downstream client to the downstream cluster via the downstream-cluster-kubeconfig secret on the upstream cluster."
    cmds:
      - echo "🔗 linking upstream -> downstream"
      - '{{.KIND}} get kubeconfig --name {{.DOWNSTREAM_CLUSTER}} --internal > {{.TMP_DIR}}/.kind-{{.DOWNSTREAM_CLUSTER}}-internal.yaml'
      - kubectl --context {{.UPSTREAM_CTX}} create namespace network-services-operator-system --dry-run=client -o yaml | kubectl --context {{.UPSTREAM_CTX}} apply -f -
      - |
        kubectl --context {{.UPSTREAM_CTX}} create secret -n network-services-operator-system \
          generic downstream-cluster-kubeconfig --save-config --dry-run=client -o yaml \
          --from-file=kubeconfig={{.TMP_DIR}}/.kind-{{.DOWNSTREAM_CLUSTER}}-internal.yaml | kubectl --context {{.UPSTREAM_CTX}} apply -f -

  wait-ready:
    desc: "Wait for the core components (NSO manager, downstream EG, ext-server) to be Available."
    cmds:
      - echo "⏳ waiting for NSO manager (upstream)"
      - kubectl --context {{.UPSTREAM_CTX}} -n network-services-operator-system wait deploy network-services-operator-controller-manager --for=condition=Available --timeout=360s
      - echo "⏳ waiting for NSO location controllers (upstream)"
      - kubectl --context {{.UPSTREAM_CTX}} -n network-services-operator-system wait deploy network-services-operator-cell-controller-manager --for=condition=Available --timeout=360s
      - echo "⏳ waiting for downstream EG"
      # The gateway control-plane Deployment is named `envoy-gateway` by its chart,
      # not after the release name.
      - kubectl --context {{.DOWNSTREAM_CTX}} -n datum-downstream-gateway wait deploy envoy-gateway --for=condition=Available --timeout=240s
      - echo "⏳ waiting for ext-server"
      - kubectl --context {{.DOWNSTREAM_CTX}} -n network-services-operator-system wait deploy network-services-operator-envoy-gateway-extension-server --for=condition=Available --timeout=240s
      # Deployment Available != webhook serving: cert-manager injects the webhook
      # cert after the pod is up, so early Domain/Gateway creates race it and time
      # out ("context deadline exceeded"). Block until a server-side dry-run is
      # actually admitted.
      - echo "⏳ waiting for the NSO admission webhook to admit"
      - |
        DOMAIN_JSON='{"apiVersion":"networking.datumapis.com/v1alpha","kind":"Domain","metadata":{"name":"warmup-probe"},"spec":{"domainName":"warmup.e2e.env.datum.net"}}'
        for i in $(seq 1 60); do
          if echo "$DOMAIN_JSON" | kubectl --context {{.UPSTREAM_CTX}} -n default create --dry-run=server -f - >/dev/null 2>&1; then
            echo "✅ webhook admitting"; break
          fi
          if [ "$i" -eq 60 ]; then echo "❌ webhook never became ready"; exit 1; fi
          sleep 2
        done
      - echo "⏳ waiting for the NSO gateway webhook to admit"
      - |
        GW_JSON='{"apiVersion":"gateway.networking.k8s.io/v1","kind":"Gateway","metadata":{"name":"warmup-probe"},"spec":{"gatewayClassName":"datum-external-global-proxy","listeners":[{"name":"probe","protocol":"HTTP","port":80,"hostname":"warmup.e2e.env.datum.net"}]}}'
        for i in $(seq 1 60); do
          if echo "$GW_JSON" | kubectl --context {{.UPSTREAM_CTX}} -n default create --dry-run=server -f - >/dev/null 2>&1; then
            echo "✅ gateway webhook admitting"; break
          fi
          if [ "$i" -eq 60 ]; then echo "❌ gateway webhook never became ready"; exit 1; fi
          sleep 2
        done
      - echo "⏳ waiting for the manager rollout to finish"
      - kubectl --context {{.UPSTREAM_CTX}} -n network-services-operator-system rollout status deploy network-services-operator-controller-manager --timeout=240s
      # Ensure the downstream GatewayClass is Accepted so the first test gateway
      # programs promptly instead of racing a 30s assert on a cold edge.
      - echo "⏳ waiting for the downstream GatewayClass to be Accepted"
      - kubectl --context {{.DOWNSTREAM_CTX}} wait gatewayclass datum-downstream-gateway-e2e --for=condition=Accepted --timeout=120s
      - echo "✅ core components ready."

  # ---- IPAM ---------------------------------------------------------------
  #
  # IPAM is the upstream PROJECT control plane: NSO's manager, running on the
  # same kind cluster, plays the cell that claims addresses from it. The two
  # roles are separated by kubeconfig and impersonation, not by cluster
  # boundary, so colocating them costs no fidelity — the cells that provision
  # network interfaces run single-cluster in production and reach IPAM exactly
  # this way.

  cnpg-operator:
    desc: "Install the CloudNativePG operator (chart 0.29.0 / CNPG 1.30.0) on the upstream cluster and wait until it can actually admit a Cluster. IPAM's bundle ships CNPG as a Flux HelmRelease; this env has no Flux, so it takes the same chart through kustomize --enable-helm, the way cert-manager is installed here."
    cmds:
      - echo "🐘 installing CloudNativePG (upstream)"
      - '{{.KUSTOMIZE}} build --enable-helm config/dependencies/postgres-operator | kubectl --context {{.UPSTREAM_CTX}} apply --server-side=true --force-conflicts -f -'
      - echo "⏳ waiting for the CNPG CRDs to be established"
      - kubectl --context {{.UPSTREAM_CTX}} wait --for=condition=Established crd/clusters.postgresql.cnpg.io --timeout=120s
      - echo "⏳ waiting for the CNPG operator"
      - kubectl --context {{.UPSTREAM_CTX}} -n cnpg-system rollout status deploy/cnpg-cloudnative-pg --timeout=300s
      # Deployment Available is not the same as "the webhook answers": the
      # operator injects its own CA into the webhook configuration after it
      # starts, and a Cluster applied into that window is rejected with a TLS
      # or connection error that reads exactly like a flaky apply. Block until a
      # server-side dry run is genuinely admitted, the same way wait-ready does
      # for the NSO webhook.
      - echo "⏳ waiting for the CNPG webhook to admit"
      - |
        PROBE='{"apiVersion":"postgresql.cnpg.io/v1","kind":"Cluster","metadata":{"name":"admit-probe","namespace":"default"},"spec":{"instances":1,"storage":{"size":"128Mi"}}}'
        for i in $(seq 1 60); do
          if echo "$PROBE" | kubectl --context {{.UPSTREAM_CTX}} create --dry-run=server -f - >/dev/null 2>&1; then
            echo "✅ CNPG admitting"; break
          fi
          if [ "$i" -eq 60 ]; then echo "❌ CNPG webhook never became ready"; exit 1; fi
          sleep 2
        done

  ipam-bundle:
    desc: "Fetch the published IPAM manifest bundle from ghcr.io and assemble the composed deployment in a staging directory. Pinned by digest, and verified to carry the commit go.mod pins, so a rebuild of that commit cannot silently change what is deployed. Anonymous pull — CI needs no registry credentials."
    cmds:
      - |
        set -e
        stage="{{.IPAM_STAGE}}"
        if [ -f "$stage/.digest" ] && [ "$(cat "$stage/.digest")" = "{{.IPAM_BUNDLE_DIGEST}}" ]; then
          echo "📦 IPAM bundle already staged ({{.IPAM_BUNDLE_TAG}})" >&2
        else
          echo "📦 fetching {{.IPAM_BUNDLE_REPO}}:{{.IPAM_BUNDLE_TAG}}" >&2
          rev=$({{.REPO}}/hack/fetch-oci-bundle.sh \
            {{.CRANE}} {{.CRANE_VERSION}} \
            {{.IPAM_BUNDLE_REPO}} {{.IPAM_BUNDLE_DIGEST}} {{.IPAM_COMMIT}} "$stage/bundle")
          echo "✅ fetched $rev" >&2
        fi
        # Refreshed every run: these come from the working tree, so an edit to
        # the overlay or a patch must reach the staged build without re-pulling.
        rm -rf "$stage/overlay" "$stage/patches"
        cp -R "{{.REPO}}/config/dependencies/ipam/overlay" "$stage/overlay"
        cp -R "{{.REPO}}/config/dependencies/ipam/patches" "$stage/patches"
        cp "{{.REPO}}/config/dependencies/ipam/root-kustomization.yaml" "$stage/kustomization.yaml"
        echo "{{.IPAM_BUNDLE_DIGEST}}" > "$stage/.digest"

  ipam-render:
    desc: "Render the composed IPAM deployment to stdout. What ipam-deploy applies, without applying it — the composed root is assembled at task time, so this is the only way to review it."
    deps:
      - ipam-bundle
    cmds:
      - '{{.KUSTOMIZE}} build {{.IPAM_STAGE}}'

  ipam-deploy:
    deps:
      - ipam-bundle
      - cnpg-operator
    desc: "Apply the IPAM apiserver, its Postgres, and the tenant RBAC to the upstream cluster (config/dependencies/ipam). Applies only — ipam-wait is what gates on readiness. Must follow prepare-upstream: upstream cert-manager crashloops until the Gateway-API CRDs it probes at startup exist, and until it runs, ipam-tls is never issued."
    cmds:
      - echo "🔧 deploying IPAM (upstream)"
      - task: ipam-certmanager-ready
      # The aggregated apiserver verifies its front proxy with
      # --requestheader-client-ca-file, and only then believes the X-Remote-*
      # headers that carry the caller and the project. That CA used to be the
      # kind apiserver's, read out of its extension-apiserver-authentication
      # ConfigMap, because kind was the aggregator. Milo is the aggregator now,
      # so the CA IPAM must trust is the one that signed Milo's front-proxy
      # client certificate.
      #
      # Get this wrong and the failure is quiet rather than loud: the headers
      # arrive unauthenticated, so every request reads an empty tenant and sees
      # an empty project instead of being refused.
      - kubectl --context {{.UPSTREAM_CTX}} create namespace ipam-system --dry-run=client -o yaml | kubectl --context {{.UPSTREAM_CTX}} apply -f -
      - |
        set -e
        kubectl --context {{.UPSTREAM_CTX}} -n milo-system get secret milo-ca-tls \
          -o jsonpath='{.data.ca\.crt}' | base64 -d > {{.TMP_DIR}}/.ipam-requestheader-ca.crt
        if [ ! -s {{.TMP_DIR}}/.ipam-requestheader-ca.crt ]; then
          echo "❌ Milo's CA is empty; milo-deploy/milo-wait must run before ipam-deploy" >&2
          exit 1
        fi
        kubectl --context {{.UPSTREAM_CTX}} -n ipam-system create configmap control-plane-ca \
          --from-file=ca.crt={{.TMP_DIR}}/.ipam-requestheader-ca.crt \
          --dry-run=client -o yaml | kubectl --context {{.UPSTREAM_CTX}} apply -f -
      - '{{.KUSTOMIZE}} build {{.IPAM_STAGE}} | kubectl --context {{.UPSTREAM_CTX}} apply --server-side=true --force-conflicts -f -'
      # The bundle registers IPAM as an aggregated API in the KIND apiserver.
      # That is the old front door and it has to go: leaving it would let a
      # caller reach IPAM without passing through Milo, and a suite that
      # accidentally did so would pass while proving nothing about project
      # routing. Milo carries the only registration now (milo-bootstrap).
      - |
        kubectl --context {{.UPSTREAM_CTX}} delete apiservice v1alpha1.ipam.miloapis.com \
          --ignore-not-found=true

  ipam-certmanager-ready:
    desc: "Make sure upstream cert-manager is actually running before anything asks it for a certificate. It exits at startup when the Gateway-API CRDs are absent, so on a fresh env it is in CrashLoopBackOff by the time prepare-upstream installs them — and the backoff can be minutes long. Restart it rather than wait the backoff out."
    cmds:
      - |
        if kubectl --context {{.UPSTREAM_CTX}} -n cert-manager wait deploy cert-manager \
             --for=condition=Available --timeout=15s >/dev/null 2>&1; then
          echo "✅ upstream cert-manager already Available"
          exit 0
        fi
        echo "♻️  upstream cert-manager is not Available; restarting it"
        kubectl --context {{.UPSTREAM_CTX}} -n cert-manager rollout restart deploy cert-manager
        kubectl --context {{.UPSTREAM_CTX}} -n cert-manager rollout status deploy cert-manager --timeout=240s

  ipam-wait:
    desc: "Gate on IPAM being genuinely servable: Postgres, the apiserver rollout, then the APIService itself. The certificate gate is on the internal CA, not on a serving cert: the CSI driver issues serving certs per pod at mount time, so a CA problem surfaces as a pod that never leaves Init. The APIService gate is not redundant — a suite that starts while aggregation is still settling fails with ServiceUnavailable, which reads like a test bug and is not one."
    cmds:
      # The serving cert is issued per pod by the cert-manager CSI driver, from
      # the CA this gate waits on. Without the CA the mount never completes and
      # the pod sits in Init with nothing in its logs to explain why.
      - echo "⏳ waiting for the IPAM internal CA"
      - kubectl --context {{.UPSTREAM_CTX}} -n ipam-system wait certificate/ipam-ca --for=condition=Ready --timeout=180s
      - echo "⏳ waiting for Postgres (CNPG cluster ipam-db)"
      # The apiserver's migrate init container runs `ipam migrate up` against
      # this database, so it crashloops until Postgres accepts connections.
      # CNPG reports Ready only once the instance is serving, which is what the
      # init container needs — a scheduled pod is not enough. This replaced a
      # `wait pod -l app.kubernetes.io/name=postgresql` gate when the plain
      # Deployment gave way to the operator.
      - kubectl --context {{.UPSTREAM_CTX}} -n ipam-system wait cluster.postgresql.cnpg.io/ipam-db --for=condition=Ready --timeout=420s
      # Ready is the operator's opinion; the init container's is the one that
      # matters. Ask the database directly, as the role and database IPAM
      # actually connects as, so a cluster that reports Ready while still
      # finishing bootstrap fails here rather than as a crashlooping migration.
      - |
        for i in $(seq 1 45); do
          POD=$(kubectl --context {{.UPSTREAM_CTX}} -n ipam-system get pod \
            -l cnpg.io/cluster=ipam-db -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$POD" ] && kubectl --context {{.UPSTREAM_CTX}} -n ipam-system exec "$POD" -c postgres -- \
               pg_isready -U ipam -d ipam >/dev/null 2>&1; then
            echo "✅ postgres accepting connections as ipam/ipam"; break
          fi
          if [ "$i" -eq 45 ]; then echo "❌ postgres never accepted a connection"; exit 1; fi
          sleep 2
        done
      - echo "⏳ waiting for the IPAM apiserver (readiness probe has a 60s initial delay)"
      # rollout status, not `wait pod -l`: a label selector also matches pods
      # left over from a previous revision that are still terminating, and the
      # wait then fails on a pod that is on its way out.
      - kubectl --context {{.UPSTREAM_CTX}} -n ipam-system rollout status deploy/ipam-apiserver --timeout=300s
      # There is no APIService to wait on here any more: IPAM is aggregated into
      # Milo, not into kind. Readiness of the aggregation is milo-ipam-gate's
      # job, and it asks a stronger question than a condition — it reads real
      # objects through a real project path.
      - echo "✅ IPAM apiserver rolled out"

  milo-bundle:
    desc: "Fetch the published Milo manifest bundle from ghcr.io and assemble the composed deployment in a staging directory. Pinned by digest, and verified to carry the pinned release tag, so a republished tag cannot silently change what is deployed. Anonymous pull — CI needs no registry credentials."
    cmds:
      - |
        set -e
        stage="{{.MILO_STAGE}}"
        if [ -f "$stage/.digest" ] && [ "$(cat "$stage/.digest")" = "{{.MILO_BUNDLE_DIGEST}}" ]; then
          echo "🚪 Milo bundle already staged ({{.MILO_BUNDLE_TAG}})" >&2
        else
          echo "🚪 fetching {{.MILO_BUNDLE_REPO}}:{{.MILO_BUNDLE_TAG}}" >&2
          rev=$({{.REPO}}/hack/fetch-oci-bundle.sh \
            {{.CRANE}} {{.CRANE_VERSION}} \
            {{.MILO_BUNDLE_REPO}} {{.MILO_BUNDLE_DIGEST}} {{.MILO_BUNDLE_TAG}} "$stage/bundle")
          echo "✅ fetched $rev" >&2
        fi
        # Refreshed every run: these come from the working tree, so an edit to
        # the overlay or a patch must reach the staged build without re-pulling.
        rm -rf "$stage/overlay" "$stage/patches"
        cp -R "{{.REPO}}/config/dependencies/milo/overlay" "$stage/overlay"
        cp -R "{{.REPO}}/config/dependencies/milo/patches" "$stage/patches"
        cp "{{.REPO}}/config/dependencies/milo/root-kustomization.yaml" "$stage/kustomization.yaml"
        echo "{{.MILO_BUNDLE_DIGEST}}" > "$stage/.digest"

  milo-render:
    desc: "Render the composed Milo deployment to stdout. What milo-deploy applies, without applying it — the composed root is assembled at task time, so this is the only way to review it."
    deps:
      - milo-bundle
    cmds:
      - '{{.KUSTOMIZE}} build {{.MILO_STAGE}}'

  milo-deploy:
    deps:
      - milo-bundle
    desc: "Deploy Milo (apiserver + etcd) to the upstream cluster. Milo is the front door: the operator and the suites address a project by control-plane path, and Milo is what turns that path into a tenant. Pinned by MILO_BUNDLE_TAG."
    cmds:
      - echo "🚪 deploying Milo {{.MILO_BUNDLE_TAG}} (upstream)"
      # cert-manager issues Milo's serving cert and its front-proxy client cert,
      # so it has to be running first. prepare-upstream is what unblocks it; see
      # the note on ipam-certmanager-ready.
      - task: ipam-certmanager-ready
      - '{{.KUSTOMIZE}} build {{.MILO_STAGE}} | kubectl --context {{.UPSTREAM_CTX}} apply --server-side=true --force-conflicts -f -'

  milo-wait:
    desc: "Gate on Milo actually serving. etcd first — Milo exits at startup if it cannot reach its storage within the deadline, so a slow etcd shows up as a crashloop with the cause several hundred log lines back."
    cmds:
      - echo "⏳ waiting for Milo's etcd"
      - kubectl --context {{.UPSTREAM_CTX}} -n milo-system rollout status statefulset/etcd --timeout=180s
      - echo "⏳ waiting for Milo's certificates"
      - kubectl --context {{.UPSTREAM_CTX}} -n milo-system wait certificate/milo-apiserver-tls --for=condition=Ready --timeout=180s
      - kubectl --context {{.UPSTREAM_CTX}} -n milo-system wait certificate/milo-front-proxy-client --for=condition=Ready --timeout=180s
      - echo "⏳ waiting for the Milo apiserver"
      - kubectl --context {{.UPSTREAM_CTX}} -n milo-system rollout status deploy/milo-apiserver --timeout=300s
      - echo "✅ Milo serving"

  milo-kubeconfigs:
    desc: "Write the host-side Milo kubeconfigs to TMPDIR: one admin, one at Milo's root (no project), and one per project whose server URL carries that project's control-plane path. The per-project ones are how the suites and the fixture seeder reach IPAM — there is no impersonation anywhere in them."
    cmds:
      - echo "🔑 writing Milo kubeconfigs to {{.TMP_DIR}}"
      - |
        set -e
        CA=$(kubectl --context {{.UPSTREAM_CTX}} -n milo-system get secret milo-ca-tls -o jsonpath='{.data.ca\.crt}')
        if [ -z "$CA" ]; then echo "❌ Milo CA secret is empty" >&2; exit 1; fi
        # 127.0.0.1 via the mapped NodePort: on macOS the kind node's own
        # network is not host-routable. The cert is issued for the in-cluster
        # service name, so the SNI/verification name is set explicitly rather
        # than disabling verification.
        write() {
          out=$1; token=$2; path=$3
          cat > "$out" <<EOF
        apiVersion: v1
        kind: Config
        current-context: milo
        clusters:
        - name: milo
          cluster:
            server: https://127.0.0.1:{{.MILO_NODE_PORT}}${path}
            certificate-authority-data: ${CA}
            tls-server-name: milo-apiserver.milo-system.svc
        users:
        - name: milo
          user:
            token: ${token}
        contexts:
        - name: milo
          context:
            cluster: milo
            user: milo
        EOF
        }
        write {{.MILO_ADMIN_KUBECONFIG}} e2e-milo-admin-token ""
        # The root kubeconfig names no project. It is not a leftover: the
        # isolation suite uses it as its negative control, and it must reach
        # IPAM through the very same front door while reading nothing.
        write {{.MILO_ROOT_KUBECONFIG}} e2e-tenant-tester-token ""
        for proj in {{.IPAM_PROJECTS}}; do
          write "{{.TMP_DIR}}/.milo-${proj}.yaml" e2e-tenant-tester-token \
            "/apis/resourcemanager.miloapis.com/v1alpha1/projects/${proj}/control-plane"
        done
      - kubectl --kubeconfig {{.MILO_ADMIN_KUBECONFIG}} get --raw /healthz > /dev/null
      - echo "✅ Milo reachable from the host on 127.0.0.1:{{.MILO_NODE_PORT}}"

  milo-bootstrap:
    desc: "Create the Projects, the Milo-side RBAC, and IPAM's registration as an aggregated API INSIDE Milo. Everything here is addressed with the Milo kubeconfig, not the kind one."
    deps:
      - milo-kubeconfigs
    cmds:
      - echo "🌱 bootstrapping Milo (projects, RBAC, IPAM aggregation)"
      - kubectl --kubeconfig {{.MILO_ADMIN_KUBECONFIG}} apply -f config/dependencies/milo/bootstrap-in-milo.yaml
      # The namespace addresses land in, inside each project's own control
      # plane. The operator READS this and refuses to allocate if it is absent
      # — deliberately, because creating it would be writing into a customer's
      # project on their behalf (internal/controller/ipam_project_client.go).
      #
      # In production the namespace comes with the project: milo-controller-
      # manager's ProjectController writes it on every reconcile. This Milo is
      # the apiserver alone, with no controller-manager to run that
      # (config/dependencies/milo/root-kustomization.yaml), so the step below stands
      # in for that one write, label included. Without it every claim is
      # rejected with ProjectNamespaceNotFound and the interface suites never
      # see an Allocated condition.
      #
      # Created through each project's control-plane path, so it lands in that
      # project's storage rather than at Milo's root.
      - |
        set -e
        for proj in {{.IPAM_PROJECTS}}; do
          path=/apis/resourcemanager.miloapis.com/v1alpha1/projects/${proj}/control-plane
          if kubectl --kubeconfig {{.MILO_ADMIN_KUBECONFIG}} \
               get --raw "${path}/api/v1/namespaces/default" >/dev/null 2>&1; then
            echo "  ✅ ${proj} already has a default namespace"
            continue
          fi
          echo '{"apiVersion":"v1","kind":"Namespace","metadata":{"name":"default","labels":{"miloapis.com/project-default":"true"}}}' \
            | kubectl --kubeconfig {{.MILO_ADMIN_KUBECONFIG}} \
                create --raw "${path}/api/v1/namespaces" -f - >/dev/null
          echo "  ✅ created default namespace in ${proj}"
        done
      # IPAM's serving CA, so Milo's aggregator verifies a real chain rather
      # than skipping verification. In the kind cluster cert-manager's cainjector
      # wrote this for us; Milo is a different control plane and cainjector
      # cannot see into it, so it is copied across explicitly.
      - |
        set -e
        # The secret the ipam-ca Certificate issues into, resolved from the
        # Certificate rather than hardcoded: the bundle names it ipam-ca-secret,
        # not ipam-ca, and a wrong guess here fails as a NotFound several steps
        # from anything to do with aggregation.
        IPAM_CA_SECRET=$(kubectl --context {{.UPSTREAM_CTX}} -n ipam-system get certificate ipam-ca -o jsonpath='{.spec.secretName}')
        IPAM_CA=$(kubectl --context {{.UPSTREAM_CTX}} -n ipam-system get secret "$IPAM_CA_SECRET" -o jsonpath='{.data.ca\.crt}')
        if [ -z "$IPAM_CA" ]; then echo "❌ secret ${IPAM_CA_SECRET} has no ca.crt" >&2; exit 1; fi
        cat <<EOF | kubectl --kubeconfig {{.MILO_ADMIN_KUBECONFIG}} apply -f -
        apiVersion: apiregistration.k8s.io/v1
        kind: APIService
        metadata:
          name: v1alpha1.ipam.miloapis.com
        spec:
          group: ipam.miloapis.com
          version: v1alpha1
          groupPriorityMinimum: 1000
          versionPriority: 15
          caBundle: ${IPAM_CA}
          service:
            name: ipam-apiserver
            namespace: ipam-system
            port: 443
        EOF
      # Milo's aggregator refuses to proxy an APIService that is not marked
      # Available, and Milo's apiserver never marks a REMOTE one: it sets
      # DisableRemoteAvailableConditionController (cmd/milo/apiserver/config.go).
      # In production the condition is written by milo-controller-manager's
      # RemoteAPIServiceAvailabilityReconciler, which sets Available=True
      # unconditionally — it performs no probe of any kind. Writing it here
      # produces the same object from the same evidence; the reconciler is not
      # deployed because it would drag in the whole controller-manager and an
      # infrastructure-cluster CRD set to perform one unconditional write.
      #
      # This is not the readiness gate. milo-ipam-gate is, and it makes a real
      # request through a project path — strictly more evidence than the
      # production mechanism collects. See test/e2e/README-milo.md.
      - |
        kubectl --kubeconfig {{.MILO_ADMIN_KUBECONFIG}} patch apiservice v1alpha1.ipam.miloapis.com \
          --subresource=status --type=merge -p '{"status":{"conditions":[{"type":"Available","status":"True","reason":"Remote","message":"Availability asserted by the environment, mirroring Milo'"'"'s RemoteAPIServiceAvailabilityReconciler; readiness is gated by milo-ipam-gate","lastTransitionTime":"2026-01-01T00:00:00Z"}]}}'

  milo-ipam-gate:
    desc: "Prove the front door works before anything depends on it: read IPAM through each project's control-plane path, and confirm that the SAME identity at Milo's root reads nothing. This is what makes the hand-written Available condition safe — a dead or unreachable IPAM fails here rather than surfacing as an unexplained 503 inside a suite. It exercises BOTH authorization layers, so it also catches a missing grant on either side."
    deps:
      - milo-kubeconfigs
      # The gate reads as e2e-tenant-tester, and that identity is authorized
      # twice: by Milo before its aggregator proxies, and by IPAM afterwards
      # through a delegated SubjectAccessReview against the kind apiserver.
      # ipam-tenant-rbac is the second half. Without it the gate fails with a
      # Forbidden from IPAM that reads exactly like a Milo denial.
      - ipam-tenant-rbac
    cmds:
      - echo "🔍 proving IPAM is reachable through Milo's project paths"
      - |
        set -e
        for proj in {{.IPAM_PROJECTS}}; do
          # Keep the server's own words. A 403 here means a missing grant on one
          # of the two authorization layers and a 503 means the aggregation is
          # not working — swallowing the body makes those indistinguishable.
          if ! out=$(kubectl --kubeconfig {{.TMP_DIR}}/.milo-${proj}.yaml \
                 get --raw /apis/ipam.miloapis.com/v1alpha1/ippools 2>&1); then
            echo "❌ cannot read IPAM through ${proj}'s control-plane path:" >&2
            echo "   ${out}" >&2
            echo "   milo:  kubectl --context {{.UPSTREAM_CTX}} -n milo-system logs deploy/milo-apiserver" >&2
            echo "   ipam:  kubectl --context {{.UPSTREAM_CTX}} -n ipam-system logs deploy/ipam-apiserver" >&2
            exit 1
          fi
          echo "  ✅ ${proj}"
        done
      # The root path must reach IPAM and read nothing. If it 404s, the
      # aggregation is not registered and the per-project reads above were
      # answered by something else; if it returns rows, the project extras are
      # not scoping anything and every isolation assertion downstream is void.
      - |
        set -e
        pools=$(kubectl --kubeconfig {{.MILO_ROOT_KUBECONFIG}} \
          get --raw /apis/ipam.miloapis.com/v1alpha1/ippools) \
          || { echo "❌ Milo's root path cannot reach IPAM at all" >&2; exit 1; }
        count=$(printf '%s' "$pools" | tr ',' '\n' | grep -c '"kind":"IPPool"' || true)
        if [ "$count" != "0" ]; then
          echo "❌ Milo's root path read ${count} IPPools; it holds no project and must read none" >&2
          exit 1
        fi
        echo "  ✅ root path reaches IPAM and reads nothing"

  ipam-kubeconfig:
    desc: "Wire the NSO manager to IPAM through Milo: publish the ipam-cluster-kubeconfig secret naming Milo's in-cluster address. The manager rewrites this server's PATH to a project's control plane and sends nothing else, so what it points at has to be something that serves those paths."
    cmds:
      - echo "🔗 wiring NSO manager -> Milo -> IPAM (secret ipam-cluster-kubeconfig)"
      - kubectl --context {{.UPSTREAM_CTX}} create namespace network-services-operator-system --dry-run=client -o yaml | kubectl --context {{.UPSTREAM_CTX}} apply -f -
      # The manager authenticates to Milo as nso-manager, a static token from
      # Milo's tokens.csv rather than a kind ServiceAccount token: the token is
      # presented to MILO, and Milo cannot validate a ServiceAccount token the
      # kind apiserver issued — different issuer, different keys.
      #
      # Nothing in this credential names a project. Which project a request
      # lands in is decided by the path the manager sends it to, and by nothing
      # the manager holds. That is the whole point of the change this
      # environment exists to test.
      #
      # The manager runs inside the upstream cluster, so the kubeconfig names
      # Milo's in-cluster service address rather than the host-mapped NodePort.
      - |
        set -e
        CA=$(kubectl --context {{.UPSTREAM_CTX}} -n milo-system get secret milo-ca-tls -o jsonpath='{.data.ca\.crt}')
        if [ -z "$CA" ]; then echo "❌ Milo CA secret is empty; is milo-wait done?" >&2; exit 1; fi
        KUBECONFIG_YAML=$(cat <<EOF
        apiVersion: v1
        kind: Config
        current-context: ipam
        clusters:
        - name: ipam
          cluster:
            server: https://milo-apiserver.milo-system.svc:6443
            certificate-authority-data: ${CA}
        users:
        - name: ipam
          user:
            token: nso-manager-token
        contexts:
        - name: ipam
          context:
            cluster: ipam
            user: ipam
        EOF
        )
        printf '%s\n' "$KUBECONFIG_YAML" | \
        kubectl --context {{.UPSTREAM_CTX}} -n network-services-operator-system create secret generic \
          ipam-cluster-kubeconfig --save-config --dry-run=client -o yaml \
          --from-file=kubeconfig=/dev/stdin \
          | kubectl --context {{.UPSTREAM_CTX}} apply -f -

  ipam-fixtures:
    desc: "Seed the IPClass/IPPool fixtures for both projects, clearing any leftovers first. Classes are named identically in the two projects and their pools are disjoint (test/e2e/fixtures/ipam/RANGES.md), so a controller routing to the wrong project allocates from visibly wrong space instead of quietly succeeding. Do not run this while a suite is in flight: it removes the fixtures and the tenant RBAC that a running suite is mid-way through using."
    deps:
      # The seeder reaches each project through its control-plane path, so the
      # per-project kubeconfigs have to exist before it runs.
      - milo-kubeconfigs
    cmds:
      - task: ipam-tenant-rbac
      - task: ipam-fixtures-clear
      - |
        set -e
        for proj in {{.IPAM_PROJECTS}}; do
          echo "🌱 seeding $proj"
          {{.REPO}}/hack/ipam-project-kubectl.sh "$proj" apply -f test/e2e/fixtures/ipam/$proj/classes.yaml
          {{.REPO}}/hack/ipam-project-kubectl.sh "$proj" apply -f test/e2e/fixtures/ipam/$proj/pools.yaml
        done

  ipam-tenant-rbac:
    desc: "Grant the suites' identity its IPAM access on the KIND cluster, which is where IPAM's delegated SubjectAccessReview is answered. Its matching grant inside Milo ships with config/dependencies/milo/bootstrap-in-milo.yaml — both are needed, because Milo authorizes before proxying and IPAM authorizes again after. It binds the operator's own tenant role rather than restating it. Separate from the deployment on purpose — a test identity is not deployment config — which means ipam-deploy prunes it from the deployment's binding, so anything running as the tester must run this first."
    cmds:
      - kubectl --context {{.UPSTREAM_CTX}} apply -f test/e2e/fixtures/ipam/rbac.yaml

  ipam-fixtures-clear:
    deps:
      - ipam-tenant-rbac
      - milo-kubeconfigs
    desc: "Release the addresses a previous run left held in the fixture projects. IPClaims and IPAllocations only, which is what measurement showed leaks: a run starting with 15 stale IPPools and 5 IPClasses passes 25/25, because seeding re-applies them as a no-op and cascade pools are reused by scope digest — but a single leftover IPClaim fails two suites, which enumerate the project's claims and assert against the stranger they find. Do not run this while a suite is in flight: it removes the addresses a running suite is mid-way through using."
    cmds:
      - '{{.REPO}}/hack/ipam-clear-fixtures.sh {{.IPAM_PROJECTS}}' 

  ipam-namespaces:
    desc: "Create the namespaces the interface scenarios resolve a project from, carrying the ENCODED meta.datumapis.com/upstream-cluster-name label the mapped-namespace strategy really writes, plus one namespace deliberately missing it for the fail-closed case. Applied to BOTH clusters: NetworkInterfaceClaims live on the upstream cell and resolveProject reads the claim's own namespace through the cell client, so upstream is the one that has to have them."
    cmds:
      - kubectl --context {{.UPSTREAM_CTX}} apply -f test/e2e/fixtures/ipam/namespaces.yaml
      - kubectl --context {{.DOWNSTREAM_CTX}} apply -f test/e2e/fixtures/ipam/namespaces.yaml

  # ---- Karmada ------------------------------------------------------------

  karmada-up:
    desc: "Stand up a real Karmada host on the upstream cluster (apiserver v1.33.2), join the downstream member, and apply the prod federation artifacts."
    vars:
      KARMADA_KUBECONFIG: '{{.TMP_DIR}}/karmada-{{.UPSTREAM_CLUSTER}}/karmada-apiserver.config'
      # The upstream node's docker-network IP, reachable from the downstream node
      # on the same network, used to sign the Karmada apiserver cert.
      HOST_IP:
        sh: docker inspect {{.UPSTREAM_CLUSTER}}-control-plane -f '{{"{{"}}.NetworkSettings.Networks.kind.IPAddress{{"}}"}}'
      # The downstream member's docker-network IP — reachable from the upstream
      # control-plane pods on the same network, but not from the macOS host.
      MEMBER_IP:
        sh: docker inspect {{.DOWNSTREAM_CLUSTER}}-control-plane -f '{{"{{"}}.NetworkSettings.Networks.kind.IPAddress{{"}}"}}'
    cmds:
      # Advertise 127.0.0.1: karmadactl runs on the macOS host, and init's own
      # post-deploy steps dial the advertise address. The docker-network IP is not
      # routable from the macOS host, so advertising it would make init time out;
      # the upstream cluster maps a host port through to the apiserver, so
      # 127.0.0.1 reaches it. We still sign the cert for the docker IP for any
      # in-cluster path. The member is joined in push mode, so it never needs to
      # reach the apiserver address — advertising 127.0.0.1 is safe for the join.
      # docker inspect prints nothing and exits 0 when the container is absent or
      # off the kind network, which would sign a certificate for "127.0.0.1,"
      # and later set the member endpoint to "https://:6443". Both fail far from
      # the cause, so check before using them.
      - |
        if [ -z "{{.HOST_IP}}" ] || [ -z "{{.MEMBER_IP}}" ]; then
          echo "❌ could not read the kind-network IP of a cluster node (host='{{.HOST_IP}}' member='{{.MEMBER_IP}}')." >&2
          echo "   Are both clusters up? Run 'task test-infra:clusters' first." >&2
          exit 1
        fi
      - echo "🌐 karmada init (apiserver {{.KARMADA_APISERVER_VERSION}}, advertise 127.0.0.1:32443, cert-ip incl {{.HOST_IP}}) on {{.UPSTREAM_CLUSTER}}"
      - mkdir -p {{.TMP_DIR}}/karmada-{{.UPSTREAM_CLUSTER}}
      # init takes a fixed NodePort, so a second run fails on the port the first
      # one took rather than reporting that Karmada is already up. Ask first, so
      # running this after `up` is a no-op instead of an error.
      - |
        if kubectl --context {{.UPSTREAM_CTX}} -n karmada-system \
             get service karmada-apiserver >/dev/null 2>&1; then
          echo "✅ karmada is already initialised on {{.UPSTREAM_CLUSTER}}, skipping init"
        else
          {{.KARMADACTL}} init --context {{.UPSTREAM_CTX}} \
            --kube-image-tag {{.KARMADA_APISERVER_VERSION}} \
            --karmada-apiserver-advertise-address 127.0.0.1 \
            --cert-external-ip "127.0.0.1,{{.HOST_IP}}" \
            --etcd-storage-mode hostPath \
            --karmada-data {{.TMP_DIR}}/karmada-{{.UPSTREAM_CLUSTER}} \
            --karmada-pki {{.TMP_DIR}}/karmada-{{.UPSTREAM_CLUSTER}}/pki
        fi
      - echo "🔗 joining {{.DOWNSTREAM_CLUSTER}} as a Karmada member"
      # karmadactl join runs on the host and connects to the member to install its
      # agent, so it needs a host-reachable member kubeconfig, not the internal
      # docker-hostname form the host cannot resolve.
      - '{{.KIND}} get kubeconfig --name {{.DOWNSTREAM_CLUSTER}} > {{.TMP_DIR}}/.kind-{{.DOWNSTREAM_CLUSTER}}-host.yaml'
      # Joining a member that is already joined is an error too, for the same
      # reason: the second run is reporting success, not a conflict.
      - |
        if kubectl --kubeconfig {{.KARMADA_KUBECONFIG}} --context karmada-apiserver \
             get cluster {{.DOWNSTREAM_CLUSTER}} >/dev/null 2>&1; then
          echo "✅ {{.DOWNSTREAM_CLUSTER}} is already a member, skipping join"
        else
          {{.KARMADACTL}} join {{.DOWNSTREAM_CLUSTER}} \
            --karmada-context karmada-apiserver \
            --kubeconfig {{.KARMADA_KUBECONFIG}} \
            --cluster-kubeconfig {{.TMP_DIR}}/.kind-{{.DOWNSTREAM_CLUSTER}}-host.yaml \
            --cluster-context {{.DOWNSTREAM_CTX}}
        fi
      # The join stores the host address as the member's endpoint, which the
      # control-plane pods running inside the upstream cluster cannot reach.
      # Repoint it to the member's docker IP, which they can reach on the shared
      # network, and the member then goes Ready.
      - |
        kubectl --kubeconfig {{.KARMADA_KUBECONFIG}} --context karmada-apiserver \
          patch cluster {{.DOWNSTREAM_CLUSTER}} --type=merge \
          -p '{"spec":{"apiEndpoint":"https://{{.MEMBER_IP}}:6443"}}'
      # Label the member so the production propagation policy places resources onto
      # it.
      - |
        kubectl --kubeconfig {{.KARMADA_KUBECONFIG}} --context karmada-apiserver \
          label cluster {{.DOWNSTREAM_CLUSTER}} infra.datum.net/gateways=enabled --overwrite
      - echo "⏳ waiting for the member cluster to become Ready"
      - |
        kubectl --kubeconfig {{.KARMADA_KUBECONFIG}} --context karmada-apiserver \
          wait cluster {{.DOWNSTREAM_CLUSTER}} --for=condition=Ready --timeout=120s
      - echo "📜 applying federation artifacts (config/federation)"
      - |
        kubectl --kubeconfig {{.KARMADA_KUBECONFIG}} --context karmada-apiserver apply -f config/federation/
      # config/crd/downstream is the union the hub and the cells need, and it is
      # what infra applies to the real hub. Applying the same path here keeps the
      # harness from drifting to a subset: Karmada resolves every kind a policy
      # selects both to propagate it and to release it on delete, so a hub
      # missing one parks that policy in Terminating and the location can never
      # be removed.
      - |
        {{.KUSTOMIZE}} build --load-restrictor LoadRestrictionsNone config/crd/downstream | \
          kubectl --kubeconfig {{.KARMADA_KUBECONFIG}} --context karmada-apiserver apply -f -
      - |
        kubectl --kubeconfig {{.KARMADA_KUBECONFIG}} --context karmada-apiserver \
          apply -f test/e2e/fixtures/ipam/namespaces.yaml
      - echo "✅ karmada-up complete. Karmada apiserver kubeconfig at {{.KARMADA_KUBECONFIG}}"

  location-fixtures:
    desc: "Seed the anchor Location the location-federation scenarios rely on. It keeps the source Location list non-empty, which the publisher requires before it will prune."
    cmds:
      - kubectl --context {{.UPSTREAM_CTX}} apply -f test/e2e/fixtures/location/anchor.yaml

  karmada-hub-secret:
    desc: "Publish the Karmada apiserver kubeconfig to the upstream cluster as karmada-hub-kubeconfig, rewritten to the in-cluster Service address the NSO manager pod can reach."
    vars:
      KARMADA_KUBECONFIG: '{{.TMP_DIR}}/karmada-{{.UPSTREAM_CLUSTER}}/karmada-apiserver.config'
      IN_CLUSTER_KUBECONFIG: '{{.TMP_DIR}}/karmada-{{.UPSTREAM_CLUSTER}}/karmada-apiserver-incluster.config'
    cmds:
      # karmadactl init writes a host address no pod can dial. Swap in the
      # Service address; its certificate does not cover that name, so skip
      # verification.
      - cp {{.KARMADA_KUBECONFIG}} {{.IN_CLUSTER_KUBECONFIG}}
      - |
        kubectl --kubeconfig {{.IN_CLUSTER_KUBECONFIG}} config set-cluster karmada-apiserver \
          --server=https://karmada-apiserver.karmada-system.svc.cluster.local:5443
      - |
        kubectl --kubeconfig {{.IN_CLUSTER_KUBECONFIG}} config unset clusters.karmada-apiserver.certificate-authority-data
      - |
        kubectl --kubeconfig {{.IN_CLUSTER_KUBECONFIG}} config set-cluster karmada-apiserver \
          --insecure-skip-tls-verify=true
      - kubectl --context {{.UPSTREAM_CTX}} create namespace network-services-operator-system --dry-run=client -o yaml | kubectl --context {{.UPSTREAM_CTX}} apply -f -
      - |
        kubectl --context {{.UPSTREAM_CTX}} create secret -n network-services-operator-system \
          generic karmada-hub-kubeconfig --save-config --dry-run=client -o yaml \
          --from-file=kubeconfig={{.IN_CLUSTER_KUBECONFIG}} | kubectl --context {{.UPSTREAM_CTX}} apply -f -

  smoke:
    desc: "M2 functional confirmation: drive an upstream Gateway+HTTPRoute through the ext-server path and curl a real 200."
    cmds:
      - '{{.CHAINSAW}} test ./test/e2e-edge/extension-server-smoke --cluster {{.UPSTREAM_CLUSTER}}={{.TMP_DIR}}/.kind-{{.UPSTREAM_CLUSTER}}.yaml --cluster {{.DOWNSTREAM_CLUSTER}}={{.TMP_DIR}}/.kind-{{.DOWNSTREAM_CLUSTER}}.yaml'

  e2e:
    desc: "Run chainsaw e2e scenarios against the live two-cluster env. Pass a scenario name or path after -- (e.g. `task test-infra:e2e -- waf-enforcement`); with no arg, runs every ext-server-path scenario that targets nso-upstream/nso-downstream. Use SCENARIOS=... to override the default set. NOT safe to run while anything else is touching the env. The interface suites use fixed object names in the shared ipam-e2e-* namespaces (the project routing lives on those namespace labels), and this task clears and re-seeds the cluster-scoped fixtures at its head — which also republishes the tenant RBAC. So a second invocation, or a bare ipam-fixtures / ipam-fixtures-clear / ipam-tenant-rbac run, will pull the fixtures and the tenant's access out from under a suite already in flight. Run one at a time."
    vars:
      # Scenarios authored against this env's cluster names and downstream path.
      # Older fixtures targeting the previous cluster names are excluded here.
      DEFAULT_SCENARIOS: extension-server-smoke waf-enforcement branded-error-page connector-offline-503 atomic-reject-isolation oidc-missing-secret-isolation
      # CLI_ARGS (after --) wins; else SCENARIOS env; else the default set.
      SELECTED: '{{.CLI_ARGS | default .SCENARIOS | default .DEFAULT_SCENARIOS}}'
    deps:
      - kubeconfigs
    cmds:
      # Reset the cluster-scoped fixtures before the first suite. A run that
      # died mid-suite leaves pools and classes that chainsaw's namespace
      # teardown cannot reach, and the next run would fail on "already exists"
      # rather than on what it was testing.
      - task: ipam-fixtures
      - |
        set -e
        for s in {{.SELECTED}}; do
          # Accept either a bare scenario name or a full/relative path.
          case "$s" in
            test/e2e-edge/*|./test/e2e-edge/*) dir="$s" ;;
            */*)                     dir="$s" ;;
            *)                       dir="./test/e2e-edge/$s" ;;
          esac
          echo "🧪 chainsaw: $dir"
          # --parallel 1 for the same reason test-e2e sets it: suites share
          # cluster-scoped IPPools and IPClasses, so running two at once has
          # them carving the same address space.
          {{.CHAINSAW}} test "$dir" \
            --parallel 1 \
            --cluster {{.UPSTREAM_CLUSTER}}={{.TMP_DIR}}/.kind-{{.UPSTREAM_CLUSTER}}.yaml \
            --cluster {{.DOWNSTREAM_CLUSTER}}={{.TMP_DIR}}/.kind-{{.DOWNSTREAM_CLUSTER}}.yaml
        done

  test-e2e:
    desc: "Run the full control-plane e2e suite (test/e2e) against the live two-cluster env. The suite's chainsaw aliases nso-standard/nso-infra are mapped to this env's upstream/downstream kubeconfigs at invocation. Pass a scenario path after -- to run a single test. NOT safe to run while anything else is touching the env. The interface suites use fixed object names in the shared ipam-e2e-* namespaces (the project routing lives on those namespace labels), and this task clears and re-seeds the cluster-scoped fixtures at its head — which also republishes the tenant RBAC. So a second invocation, or a bare ipam-fixtures / ipam-fixtures-clear / ipam-tenant-rbac run, will pull the fixtures and the tenant's access out from under a suite already in flight. Run one at a time."
    vars:
      # CLI_ARGS (after --) wins so a single test can be selected; else the whole
      # suite directory.
      TARGET: '{{.CLI_ARGS | default "./test/e2e"}}'
      # Persist a machine-readable run report so a hang or kill still leaves a
      # forensic trail on disk (chainsaw writes nothing by default).
      REPORT_PATH: '{{.REPORT_PATH | default .TMP_DIR}}'
      REPORT_NAME: '{{.REPORT_NAME | default "chainsaw-report"}}'
    deps:
      - kubeconfigs
    cmds:
      # See the note in `e2e`: cluster-scoped fixtures outlive a failed run, so
      # the suite starts by putting them back to a known state.
      - task: ipam-fixtures
      - echo "🧪 chainsaw suite {{.TARGET}} (nso-standard={{.UPSTREAM_CLUSTER}}, nso-infra={{.DOWNSTREAM_CLUSTER}}); report {{.REPORT_PATH}}/{{.REPORT_NAME}}.json"
      - |
        {{.CHAINSAW}} test {{.TARGET}} \
          --parallel 1 \
          --cluster nso-standard={{.TMP_DIR}}/.kind-{{.UPSTREAM_CLUSTER}}.yaml \
          --cluster nso-infra={{.TMP_DIR}}/.kind-{{.DOWNSTREAM_CLUSTER}}.yaml \
          --cluster nso-hub={{.TMP_DIR}}/karmada-{{.UPSTREAM_CLUSTER}}/karmada-apiserver.config \
          --report-format JSON \
          --report-path {{.REPORT_PATH}} \
          --report-name {{.REPORT_NAME}}

  kubeconfigs:
    desc: "Export per-cluster kubeconfigs to TMPDIR for chainsaw, and refresh the Milo ones the suites reach IPAM through."
    deps:
      # The interface suites address IPAM by project path, so their kubeconfigs
      # are as much a precondition as the cluster ones.
      - milo-kubeconfigs
    cmds:
      - '{{.KIND}} get kubeconfig --name {{.UPSTREAM_CLUSTER}} > {{.TMP_DIR}}/.kind-{{.UPSTREAM_CLUSTER}}.yaml'
      - '{{.KIND}} get kubeconfig --name {{.DOWNSTREAM_CLUSTER}} > {{.TMP_DIR}}/.kind-{{.DOWNSTREAM_CLUSTER}}.yaml'

  parity:check:
    desc: "Run the config-dump parity gate against the live downstream Envoy + ext-server. Pass CLI flags after -- (PARITY owns the CLI). Exit 0 PASS / 1 parity FAIL / 2 tool error."
    cmds:
      - go build -o bin/parity-check ./cmd/parity-check
      - ./bin/parity-check {{.CLI_ARGS}}

  parity:check-live:
    desc: "Convenience: resolve the live data-plane Envoy pod from this env's labels and run parity:check in kubectl-exec mode (ext-server via selector across replicas). Extra flags pass through after --."
    vars:
      # In this env the data-plane proxy and the extension server live in these
      # namespaces.
      DP_NS: datum-downstream-gateway
      DP_SELECTOR: gateway.envoyproxy.io/owning-gatewayclass=datum-downstream-gateway-e2e
      EXT_NS: network-services-operator-system
      EXT_SELECTOR: app.kubernetes.io/component=envoy-gateway-extension-server
      # The admin side wants a single exact proxy pod name, resolved here. The
      # extension-server side takes a selector and picks the authoritative replica
      # itself.
      DP_POD:
        sh: kubectl --context {{.DOWNSTREAM_CTX}} -n datum-downstream-gateway get pods -l gateway.envoyproxy.io/owning-gatewayclass=datum-downstream-gateway-e2e -o jsonpath='{.items[0].metadata.name}'
    cmds:
      - go build -o bin/parity-check ./cmd/parity-check
      - |
        if [ -z "{{.DP_POD}}" ]; then
          echo "no data-plane Envoy pod found (label {{.DP_SELECTOR}} in {{.DP_NS}}); a Gateway must exist in a watched namespace for the merged data plane to be provisioned" >&2
          exit 2
        fi
      - |
        ./bin/parity-check \
          --coraza-filter=coraza-waf \
          --admin-exec-pod={{.DP_POD}} --admin-exec-namespace={{.DP_NS}} --admin-exec-container=envoy --admin-exec-context={{.DOWNSTREAM_CTX}} \
          --ext-exec-selector={{.EXT_SELECTOR}} --ext-exec-namespace={{.EXT_NS}} --ext-exec-context={{.DOWNSTREAM_CTX}} \
          {{.CLI_ARGS}}

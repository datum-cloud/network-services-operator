apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: network-services-operator-system

# The platform owns the namespace and installs crd/downstream plus the
# locations service's CRDs before this controller bundle. Keeping those
# prerequisites out of this render gives each resource one reconciler.
resources:
  - ../rbac
  - service_account.yaml

components:
  - ../rbac_deployment
  - ../components/cell-controllers

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: alb-mcp
    app.kubernetes.io/name: alb-mcp
  name: alb-mcp
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-server
      app.kubernetes.io/instance: alb-mcp
      app.kubernetes.io/name: alb-mcp
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/instance: alb-mcp
        app.kubernetes.io/name: alb-mcp
    spec:
      # Deliberately unbound — see service_account.yaml. The server reads as the
      # caller, so this account holds no permission of its own.
      #
      # This template carries no control plane configuration: which control
      # plane the server reads is deployment topology, so the deployer patches
      # in a kubeconfig volume and KUBECONFIG. Without one the binary refuses to
      # start rather than falling back to the local cluster's API server; see
      # CheckControlPlaneEndpoint in internal/mcpserver.
      serviceAccountName: alb-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alb-mcp
          # The manager's image. It carries both binaries — they are released
          # together and share the condition vocabulary internal/agent's catalog
          # classifies, and the same product decoding the alb plugin uses — so
          # `command` picks this one.
          image: ghcr.io/datum-cloud/network-services-operator:latest
          imagePullPolicy: Always
          command:
            - /alb-mcp
          args:
            - --addr=:8080
            - --tls-cert-file=/etc/alb-mcp/tls/tls.crt
            - --tls-key-file=/etc/alb-mcp/tls/tls.key
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: alb-mcp-certs
              mountPath: /etc/alb-mcp/tls
              readOnly: true
      # No writable volume: the binary is static, the documents it serves are
      # compiled in, and nothing here writes to disk.
      volumes:
        # The serving certificate. The assistant sends a caller's token only
        # over HTTPS and already trusts this issuer.
        #
        # The names are the Service as deployed, prefix and namespace included:
        # kustomize does not rewrite volume attributes, so a deployer using a
        # different namePrefix or namespace has to patch them to match.
        - name: alb-mcp-certs
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: datum-control-plane
              csi.cert-manager.io/issuer-kind: ClusterIssuer
              csi.cert-manager.io/common-name: network-services-operator-alb-mcp
              csi.cert-manager.io/dns-names: network-services-operator-alb-mcp,network-services-operator-alb-mcp.datum-system.svc,network-services-operator-alb-mcp.datum-system.svc.cluster.local
              csi.cert-manager.io/key-usages: digital signature,key encipherment,server auth
              csi.cert-manager.io/fs-group: '65532'
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

# This service's registrations with the Patch assistant: the agents customers
# talk to, and the docs, tools and guides each offers them.
#
# Applied to the Milo control plane alongside ../service-catalog. The catalog
# copies the content into each entitled project; entitlement decides who gets it.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - service-agent.yaml
  - service-agent-configuration.yaml
  - network-service-agent.yaml
  - network-service-agent-configuration.yaml

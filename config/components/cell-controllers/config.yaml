apiVersion: apiserver.config.datumapis.com/v1alpha1
kind: CellControllerManager
# Internal DNS is an alpha network integration and remains off until the
# shared resolver attachments are configured for this cell.
internalDNS:
  # Enables private resolver route programming and readiness reporting.
  enabled: false
  # Presents the same resolver address inside each consumer VPC.
  # frontend: fd53::53
  # Allocates one stable service destination from this prefix per DNS context.
  # servicePrefix: fd70:100::/64
  # Selects the shared resolver attachments that serve authorized VPCs.
  # producerAttachmentSelector:
  #   service.datum.net/internal-dns: "true"
  # Replaces frontend and producerAttachmentSelector with up to three
  # independent resolvers, each served by its own attachments. Guests receive
  # every frontend as a nameserver, in this order. Keep the existing resolver
  # first, and set the same list on the manager and every cell.
  # resolvers:
  # - frontend: fd53::53
  #   producerAttachmentSelector:
  #     internal-dns.datum.net/tier: node
  # - frontend: fd53::54
  #   producerAttachmentSelector:
  #     internal-dns.datum.net/tier: node-b
metricsServer:
  bindAddress: ":8443"
ipam:
  kubeconfigPath: /etc/ipam-cluster/kubeconfig
# federation.kubeconfigPath is REQUIRED and is deliberately not set here: the
# path depends on how an overlay mounts the hub credential, and a default would
# name a file no deployment has to provide. A cell refuses to start without it,
# because a cell that cannot publish still allocates addresses and still reports
# its interfaces Bound, so the consumer-visible failure is otherwise silent.
#
# An overlay sets it alongside the mount, e.g.
#
#   federation:
#     kubeconfigPath: /etc/kubernetes/federation/auth/kubeconfig
#
# config/e2e/kustomization.yaml is a worked example.

# A cell learns its location from the ServingLocation delivered to it.
# To pin one, replace this ConfigMap in an overlay.

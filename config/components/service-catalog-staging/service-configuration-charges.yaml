apiVersion: services.miloapis.com/v1alpha1
kind: ServiceConfiguration
metadata:
  name: networking-datumapis-com
spec:
  charges:
    - name: networking.datumapis.com/gateway/requests
      chargeType: Usage
      currency: USD
      displayName: ALB Requests
      usage:
        metricRef: networking.datumapis.com/gateway/requests
        pricingUnit: request
        rates:
          - flat: "0.000001"
    - name: networking.datumapis.com/gateway/egress-bytes
      chargeType: Usage
      currency: USD
      displayName: ALB Egress
      usage:
        metricRef: networking.datumapis.com/gateway/egress-bytes
        pricingUnit: GB
        rates:
          - tiered:
              - upTo: "200"
                rate: "0"
              - upTo: "10240"
                rate: "0.05"
              - upTo: "153600"
                rate: "0.04"
              - rate: "0.03"
    # egress-bytes counts bytes, and the charge above applies its per-GB
    # tiers per byte: everything past the first 200 bytes is billed. This
    # charge keeps the same tiers in GB and converts the usage into GB
    # first. Published charges can't be edited, so the one above stays until
    # every account is on the Offer that uses this one, and is removed then.
    - name: networking.datumapis.com/gateway/egress-gb
      chargeType: Usage
      currency: USD
      displayName: ALB Egress
      usage:
        metricRef: networking.datumapis.com/gateway/egress-bytes
        pricingUnit: GB
        unitConversion:
          meterUnitsPerPricingUnit: "1073741824"
          description: Egress is metered in bytes and priced per GB; 1 GB = 2^30 bytes, as the portal shows it.
        rates:
          - tiered:
              - upTo: "200"
                rate: "0"
              - upTo: "10240"
                rate: "0.05"
              - upTo: "153600"
                rate: "0.04"
              - rate: "0.03"

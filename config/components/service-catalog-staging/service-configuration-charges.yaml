apiVersion: services.miloapis.com/v1alpha1
kind: ServiceConfiguration
metadata:
  name: networking-datumapis-com
spec:
  charges:
    - name: networking.datumapis.com/gateway/requests
      chargeType: Usage
      currency: USD
      displayName: ALB Requests
      usage:
        metricRef: networking.datumapis.com/gateway/requests
        pricingUnit: request
        rates:
          - flat: "0.000001"
    # egress-bytes counts bytes, and its tiers are in GB: the usage is
    # converted into GB before they apply. This replaces the
    # gateway/egress-bytes charge, which applied the per-GB tiers per byte
    # (published charges can't be edited, so the fix is a new charge). Offers
    # keep their own copy of a price, so the Offer that used the old charge
    # still bills until its accounts move.
    - name: networking.datumapis.com/gateway/egress-gb
      chargeType: Usage
      currency: USD
      displayName: ALB Egress
      usage:
        metricRef: networking.datumapis.com/gateway/egress-bytes
        pricingUnit: GB
        unitConversion:
          meterUnitsPerPricingUnit: "1073741824"
          description: Egress is metered in bytes and priced per GB; 1 GB = 2^30 bytes, as the portal shows it.
        rates:
          - tiered:
              - upTo: "200"
                rate: "0"
              - upTo: "10240"
                rate: "0.05"
              - upTo: "153600"
                rate: "0.04"
              - rate: "0.03"

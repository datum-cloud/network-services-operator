apiVersion: services.miloapis.com/v1alpha1
kind: ServiceConfiguration
metadata:
  name: networking-datumapis-com
spec:
  phase: Published
  serviceRef:
    name: networking-datumapis-com
  # Consumer-side portal plugin (cloud-portal): a read-only Networks list.
  # Hosted internally only — config/components/consumer-ui-plugin (folded
  # into the cell's own Deployment set), never fronted by a public
  # Gateway/HTTPRoute. cloud-portal's server is the only caller, over this
  # in-cluster Service DNS name; the browser never talks to the plugin
  # origin directly. Cluster-local DNS means this same value is correct in
  # every environment config/cell deploys to (no per-env override needed).
  #
  # No caBundle needed: the plugin's CSI-issued server cert chains to
  # datum-control-plane-ca, which cloud-portal's Bun runtime already trusts
  # platform-wide via NODE_EXTRA_CA_CERTS, same as compute's consumer plugin.
  userInterface:
    consumer:
      assets:
        baseURL: https://network-services-operator-consumer-ui-plugin.network-services-operator-system.svc.cluster.local
  # A service whose configuration lists no supported location class is skipped
  # when locations are offered to a project, so without this the service is
  # live but reaches no consumer's location list.
  locations:
    supportedClasses:
      - datum-managed
  monitoredResourceTypes:
    - type: networking.datumapis.com/HTTPRoute
      displayName: ALB
      description: |
        A customer-defined HTTP routing configuration attached to a managed
        Application Load Balancer (ALB). One HTTPRoute represents a single
        HTTP service surface on the Datum Cloud edge. Usage events cover
        proxied request count, egress bytes, ingress bytes, and active
        connection seconds.
      gvk:
        group: gateway.networking.k8s.io
        kind: HTTPRoute
      labels:
        - name: region
          description: Datum deployment region serving the requests.
        - name: gateway_class
          description: GatewayClass of the underlying Gateway.
        - name: httproute_name
          description: Name of the HTTPRoute that served the request.
        - name: httproute_namespace
          description: Namespace of the HTTPRoute that served the request.
        - name: project_name
          description: Name of the project serving the request.
  metrics:
    - name: networking.datumapis.com/gateway/requests
      displayName: ALB Requests
      description: Requests proxied through the ALB.
      kind: Delta
      unit: "{request}"
      dimensions:
        - region
        - gateway_class
        - httproute_name
        - httproute_namespace
        - project_name
    - name: networking.datumapis.com/gateway/egress-bytes
      displayName: ALB Egress
      description: Bytes sent downstream by the ALB.
      kind: Delta
      unit: By
      dimensions:
        - region
        - gateway_class
        - httproute_name
        - httproute_namespace
        - project_name
    - name: networking.datumapis.com/gateway/ingress-bytes
      displayName: ALB Ingress
      description: Bytes received from clients by the ALB.
      kind: Delta
      unit: By
      dimensions:
        - region
        - gateway_class
        - httproute_name
        - httproute_namespace
        - project_name
    - name: networking.datumapis.com/gateway/connection-seconds
      displayName: ALB Connection Seconds
      description: Seconds long-lived connections (e.g. WebSocket) are held open.
      kind: Delta
      unit: s
      dimensions:
        - region
        - gateway_class
        - httproute_name
        - httproute_namespace
        - project_name
  billing:
    consumerDestinations:
      - monitoredResourceType: networking.datumapis.com/HTTPRoute
        metrics:
          - networking.datumapis.com/gateway/requests
          - networking.datumapis.com/gateway/egress-bytes
          - networking.datumapis.com/gateway/ingress-bytes
          - networking.datumapis.com/gateway/connection-seconds

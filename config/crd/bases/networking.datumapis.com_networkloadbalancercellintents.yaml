---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: networkloadbalancercellintents.networking.datumapis.com
spec:
  group: networking.datumapis.com
  names:
    kind: NetworkLoadBalancerCellIntent
    listKind: NetworkLoadBalancerCellIntentList
    plural: networkloadbalancercellintents
    singular: networkloadbalancercellintent
  scope: Namespaced
  versions:
  - name: v1alpha
    schema:
      openAPIV3Schema:
        description: |-
          NetworkLoadBalancerCellIntent carries a scoped, non-serving desired state
          from a project control plane through the hub to the serving cell.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NetworkLoadBalancerCellIntentSpec is a validation request to one location.
              The cell must independently verify the live interface, attachment, and VPC.
            properties:
              addressGroup:
                properties:
                  generation:
                    format: int64
                    type: integer
                  listenerName:
                    type: string
                  listeners:
                    items:
                      properties:
                        name:
                          type: string
                        port:
                          format: int32
                          type: integer
                        portRange:
                          properties:
                            end:
                              format: int32
                              maximum: 65535
                              minimum: 1
                              type: integer
                            start:
                              format: int32
                              maximum: 65535
                              minimum: 1
                              type: integer
                          required:
                          - end
                          - start
                          type: object
                          x-kubernetes-validations:
                          - message: port range start must not exceed end
                            rule: self.start <= self.end
                        protocol:
                          description: NetworkLoadBalancerProtocol is the transport
                            accepted by a listener.
                          enum:
                          - TCP
                          - UDP
                          - TLS
                          type: string
                      required:
                      - name
                      - protocol
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one port or portRange is required
                        rule: has(self.port) != has(self.portRange)
                      - message: true ranges require UDP
                        rule: '!has(self.portRange) || self.portRange.start == self.portRange.end
                          || self.protocol == ''UDP'''
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  revision:
                    type: string
                  uid:
                    type: string
                required:
                - generation
                - listenerName
                - listeners
                - revision
                - uid
                type: object
              allocation:
                properties:
                  claimUID:
                    minLength: 1
                    type: string
                  participants:
                    items:
                      type: string
                    maxItems: 1024
                    type: array
                    x-kubernetes-list-type: set
                  retired:
                    type: boolean
                  uid:
                    minLength: 1
                    type: string
                required:
                - claimUID
                - retired
                - uid
                type: object
                x-kubernetes-validations:
                - message: allocation identity is immutable
                  rule: self.uid == oldSelf.uid && self.claimUID == oldSelf.claimUID
                - message: retired allocations cannot change
                  rule: '!oldSelf.retired || self == oldSelf'
                - message: registered cells cannot be removed
                  rule: '!has(oldSelf.participants) || (has(self.participants) &&
                    oldSelf.participants.all(p, p in self.participants))'
              backends:
                items:
                  properties:
                    address:
                      minLength: 1
                      type: string
                    family:
                      description: |-
                        Family identifies the backend transport address independently of the
                        public VIP family. IPv4 ingress can use an IPv6 backend through a proxy.
                      enum:
                      - IPv4
                      - IPv6
                      type: string
                    port:
                      format: int32
                      type: integer
                    portRange:
                      properties:
                        end:
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        start:
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                      required:
                      - end
                      - start
                      type: object
                      x-kubernetes-validations:
                      - message: port range start must not exceed end
                        rule: self.start <= self.end
                    probe:
                      properties:
                        path:
                          type: string
                        port:
                          format: int32
                          type: integer
                        protocol:
                          type: string
                      required:
                      - port
                      - protocol
                      type: object
                    sourceName:
                      minLength: 1
                      type: string
                    sourceNamespace:
                      minLength: 1
                      type: string
                    sourceUID:
                      minLength: 1
                      type: string
                  required:
                  - address
                  - family
                  - probe
                  - sourceName
                  - sourceNamespace
                  - sourceUID
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one port or portRange is required
                    rule: has(self.port) != has(self.portRange)
                maxItems: 1024
                type: array
              listenerPort:
                format: int32
                type: integer
              listenerPortRange:
                properties:
                  end:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  start:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - end
                - start
                type: object
                x-kubernetes-validations:
                - message: port range start must not exceed end
                  rule: self.start <= self.end
              location:
                type: string
              networkName:
                type: string
              protocol:
                description: NetworkLoadBalancerProtocol is the transport accepted
                  by a listener.
                enum:
                - TCP
                - UDP
                - TLS
                type: string
              source:
                properties:
                  addressRequest:
                    minLength: 1
                    type: string
                  listenerName:
                    minLength: 1
                    type: string
                  namespace:
                    minLength: 1
                    type: string
                  parentGeneration:
                    format: int64
                    type: integer
                  parentName:
                    minLength: 1
                    type: string
                  parentUID:
                    minLength: 1
                    type: string
                  projectCluster:
                    minLength: 1
                    type: string
                  routeGeneration:
                    format: int64
                    type: integer
                  routeName:
                    minLength: 1
                    type: string
                  routeUID:
                    minLength: 1
                    type: string
                required:
                - addressRequest
                - namespace
                - parentGeneration
                - parentName
                - parentUID
                - projectCluster
                - routeGeneration
                type: object
              state:
                description: |-
                  NetworkLoadBalancerCellIntentState distinguishes desired backend validation
                  from an explicit withdrawal. Neither state authorizes traffic programming.
                enum:
                - Validate
                - ValidateAllocation
                - Withdrawn
                type: string
              vip:
                type: string
              vipFamily:
                description: |-
                  VIPFamily selects the ingress packet path. It may differ from a backend's
                  family; the serving cell must support that family pair before programming.
                enum:
                - IPv4
                - IPv6
                type: string
            required:
            - location
            - networkName
            - source
            - state
            - vip
            - vipFamily
            type: object
            x-kubernetes-validations:
            - message: validation needs backends; Withdrawn must have none
              rule: 'self.state != ''Withdrawn'' ? has(self.backends) && size(self.backends)
                > 0 : !has(self.backends) || size(self.backends) == 0'
            - message: coordinated validation requires ValidateAllocation
              rule: self.state == 'Withdrawn' || ((self.state == 'ValidateAllocation')
                == has(self.addressGroup))
            - message: serving intents require source and listener fields
              rule: has(self.allocation) || (has(self.source.routeName) && has(self.source.routeUID)
                && has(self.source.listenerName) && has(self.protocol) && (has(self.listenerPort)
                != has(self.listenerPortRange)))
            - message: retirement cannot contain serving configuration
              rule: '!has(self.allocation) || (self.state == ''Withdrawn'' && !has(self.addressGroup)
                && !has(self.listenerPort) && !has(self.listenerPortRange) && !has(self.protocol)
                && !has(self.source.routeName) && !has(self.source.routeUID) && !has(self.source.listenerName))'
            - message: allocation authority identity is immutable
              rule: 'has(oldSelf.allocation) ? has(self.allocation) && self.source
                == oldSelf.source && self.location == oldSelf.location && self.networkName
                == oldSelf.networkName && self.vip == oldSelf.vip && self.vipFamily
                == oldSelf.vipFamily : !has(self.allocation)'
            - message: true listener ranges require UDP and address inventory
              rule: '!has(self.listenerPortRange) || self.listenerPortRange.start
                == self.listenerPortRange.end || (self.protocol == ''UDP'' && has(self.addressGroup))'
          status:
            properties:
              allocationRetirements:
                items:
                  description: |-
                    NetworkLoadBalancerCellIntentStatus is written by the serving cell and
                    aggregated onto the hub copy. Cells outside the intent's location leave it
                    empty.
                  properties:
                    cellUID:
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                  required:
                  - cellUID
                  - observedGeneration
                  type: object
                maxItems: 1024
                type: array
                x-kubernetes-list-map-keys:
                - cellUID
                x-kubernetes-list-type: map
              conditions:
                description: Conditions include Programmed and Announced.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the intent generation the conditions
                  describe.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

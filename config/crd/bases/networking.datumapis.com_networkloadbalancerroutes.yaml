    name: v1alpha
    schema:
      openAPIV3Schema:
        description: |-
          NetworkLoadBalancerRoute connects load balancer listeners to NetworkService
          backends. References are restricted to the route's namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetworkLoadBalancerRouteSpec attaches weighted backends to
              named listeners.
            properties:
              backends:
                items:
                  description: |-
                    NetworkLoadBalancerRouteBackend forwards new connections or flows to a
                    named NetworkService port. Weight zero disables selection.
                  properties:
                    healthCheck:
                      description: |-
                        NetworkLoadBalancerHealthCheck checks an individual backend endpoint. UDP
                        backends require a separate TCP, HTTP, or HTTPS health endpoint.
                      properties:
                        path:
                          pattern: ^/.*$
                          type: string
                        port:
                          description: |-
                            Name of the probe port on the referenced NetworkService. When omitted,
                            TCP probes use the backend's serving port.
                          type: string
                        protocol:
                          enum:
                          - TCP
                          - HTTP
                          - HTTPS
                          type: string
                      required:
                      - protocol
                      type: object
                      x-kubernetes-validations:
                      - message: path is only valid for HTTP and HTTPS probes
                        rule: 'has(self.path) ? self.protocol in [''HTTP'', ''HTTPS'']
                          : true'
                      - message: HTTP and HTTPS probes require a port
                        rule: self.protocol == 'TCP' || has(self.port)
                    networkService:
                      description: |-
                        NetworkLoadBalancerNetworkServiceRef names a backend service and one of its
                        named ports in the route's namespace.
                      properties:
                        name:
                          type: string
                        port:
                          type: string
                      required:
                      - name
                      - port
                      type: object
                    weight:
                      default: 1
                      format: int32
                      maximum: 256
                      minimum: 0
                      type: integer
                  required:
                  - networkService
                  type: object
                maxItems: 16
                minItems: 1
                type: array
              parentRefs:
                items:
                  description: |-
                    NetworkLoadBalancerRouteParentRef attaches a route to one named listener on
                    a load balancer in the same namespace.
                  properties:
                    listener:
                      maxLength: 63
                      minLength: 1
                      type: string
                    name:
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - listener
                  - name
                  type: object
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                - listener
                x-kubernetes-list-type: map
            required:
            - backends
            - parentRefs
            type: object
          status:
            properties:
              parents:
                items:
                  description: |-
                    NetworkLoadBalancerRouteParentStatus reports attachment and effectiveness
                    for one parent listener. The oldest accepted catch-all route is effective.
                  properties:
                    conditions:
                      description: |-
                        Conditions include Accepted, ResolvedRefs, and Programmed with
                        observedGeneration.
                      items:
                        description: Condition contains details for one aspect of
                          the current state of this API Resource.
                        properties:

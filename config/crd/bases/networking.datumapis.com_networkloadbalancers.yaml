      type: date
    name: v1alpha
    schema:
      openAPIV3Schema:
        description: |-
          NetworkLoadBalancer reserves public IPs and accepts TCP or UDP traffic on
          named listeners. Route objects attach backends to those listeners.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetworkLoadBalancerSpec defines the network, public addresses,
              and listeners.
            properties:
              exposure:
                description: NetworkLoadBalancerExposure contains the load balancer's
                  address requests.
                properties:
                  addresses:
                    items:
                      description: |-
                        NetworkLoadBalancerAddressRequest reserves one public address per selected
                        location, independently of whether a route has healthy backends.
                      properties:
                        families:
                          items:
                            enum:
                            - IPv4
                            - IPv6
                            type: string
                          maxItems: 2
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                        locations:
                          description: Omission follows the effective backends' network
                            interfaces.
                          properties:
                            from:
                              description: |-
                                NetworkLoadBalancerLocationSource selects locations by name or follows all
                                eligible locations as they become available.
                              enum:
                              - Backends
                              - All
                              - Names
                              type: string
                            names:
                              items:
                                type: string
                              maxItems: 64
                              minItems: 1
                              type: array
                              x-kubernetes-list-type: set
                          required:
                          - from
                          type: object
                          x-kubernetes-validations:
                          - message: names must be set only when from is Names
                            rule: 'self.from == ''Names'' ? has(self.names) && size(self.names)
                              > 0 : !has(self.names)'
                        name:
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                      required:
                      - families
                      - name
                      type: object
                    maxItems: 16
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                required:
                - addresses
                type: object
              listeners:
                items:
                  description: |-
                    NetworkLoadBalancerListener accepts one transport and port on its named
                    address requests. TCP and UDP may use the same port.
                  properties:
                    addressRefs:
                      items:
                        type: string
                      maxItems: 16
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    hostname:
                      type: string
                    name:
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    port:
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    protocol:
                      description: NetworkLoadBalancerProtocol is the transport accepted
                        by a listener.
                      enum:
                      - TCP
                      - UDP
                      - TLS
                      type: string
                    tls:
                      properties:
                        certificateRef:
                          description: Secret references are admitted only after TLS
                            termination is supported.
                          properties:
                            name:
                              description: Name identifies a Secret in the listener's
                                namespace.
                              type: string
                            namespace:
                              description: Cross-namespace access is capability-gated
                                until grants are supported.
                              type: string
                          required:
                          - name
                          type: object
                        mode:
                          enum:
                          - Passthrough
                          - Terminate
                          type: string
                      required:
                      - mode
                      type: object
                      x-kubernetes-validations:
                      - message: Terminate requires a certificate; Passthrough omits
                          it
                        rule: 'self.mode == ''Terminate'' ? has(self.certificateRef)
                          : !has(self.certificateRef)'
                  required:
                  - addressRefs
                  - name
                  - port
                  - protocol
                  type: object
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              networkRef:
                description: The network must exist in the load balancer's namespace.
                properties:
                  name:
                    description: The network name
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: networkRef is immutable
                  rule: self == oldSelf
            required:
            - exposure
            - listeners
            - networkRef
            type: object
            x-kubernetes-validations:
            - message: each listener address reference must name an address request
              rule: self.listeners.all(l, l.addressRefs.all(r, r in self.exposure.addresses.map(a,
                a.name)))
            - message: listeners sharing an address cannot use the same protocol and
                port
              rule: self.listeners.all(l1, self.listeners.all(l2, l1.name == l2.name
                || l1.protocol != l2.protocol || l1.port != l2.port || !l1.addressRefs.exists(r,
                r in l2.addressRefs)))
            - message: TLS configuration is required only for TLS listeners
              rule: 'self.listeners.all(l, l.protocol == ''TLS'' ? has(l.tls) : !has(l.tls))'
          status:
            description: |-
              NetworkLoadBalancerStatus distinguishes address allocation from programming
              and announcement. Allocated IPs remain here during backend failures.
            properties:
              addressRequests:
                items:
                  properties:
                    locationSource:
                      description: |-
                        NetworkLoadBalancerLocationSource selects locations by name or follows all
                        eligible locations as they become available.
                      enum:
                      - Backends
                      - All
                      - Names
                      type: string
                    name:
                      type: string
                    resolvedLocations:

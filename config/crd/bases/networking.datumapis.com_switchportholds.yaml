    name: v1alpha
    schema:
      openAPIV3Schema:
        description: |-
          SwitchPortHold records the physical claims that name one switch port, which
          decides what the port carries. The operator is its only writer and changes
          it only by compare-and-swap. The physical realizer reads it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SwitchPortHoldSpec records the claims that name one switch
              port.
            properties:
              boot:
                description: |-
                  boot is the one boot claim on the port. While it is set the port carries
                  its network and nothing else.
                properties:
                  name:
                    description: name is the claim's name.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: namespace is the claim's namespace.
                    maxLength: 63
                    minLength: 1
                    type: string
                  network:

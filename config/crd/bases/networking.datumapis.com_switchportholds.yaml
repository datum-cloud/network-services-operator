                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                - network
                type: object
              consumerRef:
                description: |-
                  consumerRef is the project whose network claims hold the port. It is set
                  with the first network claim and cleared with the last.
                properties:
                  apiGroup:
                    description: apiGroup is the API group of the project type.
                    minLength: 1
                    type: string
                  kind:
                    description: kind is the project type.
                    minLength: 1
                    type: string
                  name:
                    description: name is the project's name.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - apiGroup
                - kind
                - name
                type: object
              networkClaims:
                description: |-
                  networkClaims are the network claims on the port, all from the project
                  in consumerRef.

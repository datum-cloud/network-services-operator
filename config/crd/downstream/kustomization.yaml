# NSO CRDs that must exist outside the project control plane. Infra applies
# this same path to the Karmada hub and to every cell, so it is the union of
# what those two need. Gateway API and Envoy Gateway CRDs are installed
# out-of-band.
#
# Gateway data plane: the GatewayResourceReplicator mirrors
# TrafficProtectionPolicy, HTTPProxy and Connector downstream, and the
# extension server's cache reads them locally.
#
# Edge reachability: the control plane records, on the hub, which of a project's
# workload addresses are behind a proxy, and the cells publishing into that
# namespace read it to decide what to carry. It stops at the hub; no policy
# carries it on.
#
# Network presence: a consumer writes a NetworkBinding on the hub, the control
# plane manager turns every binding for a (network, location) pair into one
# shared NetworkContext in the project control plane, the replicator mirrors
# that context and its Subnet onto the hub, and Karmada propagates both to the
# cells serving the location. The cell controller manager then serves
# NetworkInterfaceClaims against them. ServingLocation is federated the same
# way.
#
# The Network itself is mirrored onto the hub as well, so what allocates a
# network's identity on the fabric is driven by the network rather than by the
# contexts that name it. It stops at the hub; no policy carries it on. It is
# still listed here because this path is the union applied to both, and a cell
# that carries the CRD it never reads costs nothing.
#
# The cell set is derived from what the cell controller manager watches
# (internal/cmd/cell/cell.go): NetworkInterfaceClaim, NetworkInterface,
# NetworkContext, Subnet, and ServingLocation on the local cluster.
resources:
  # Gateway data plane
  - ../bases/networking.datumapis.com_edgereachabilities.yaml
  - ../bases/networking.datumapis.com_trafficprotectionpolicies.yaml
  - ../bases/networking.datumapis.com_httpproxies.yaml
  - ../bases/networking.datumapis.com_connectors.yaml

  # Location identity, federated to cells
  - ../bases/networking.datumapis.com_servinglocations.yaml

  # Network presence: hub stores bindings and mirrored contexts, cells receive
  # the contexts for the locations they serve
  - ../bases/networking.datumapis.com_networkbindings.yaml
  - ../bases/networking.datumapis.com_networkcontexts.yaml
  - ../bases/networking.datumapis.com_networks.yaml

  # Network interface claim path, served on cells
  - ../bases/networking.datumapis.com_networkinterfaceclaims.yaml
  - ../bases/networking.datumapis.com_networkinterfaces.yaml
  - ../bases/networking.datumapis.com_subnets.yaml

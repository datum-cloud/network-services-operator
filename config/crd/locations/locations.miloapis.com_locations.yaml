---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: locations.locations.miloapis.com
spec:
  group: locations.miloapis.com
  names:
    kind: Location
    listKind: LocationList
    plural: locations
    singular: location
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.locationClassRef.name
      name: Class
      type: string
    - jsonPath: .spec.topology.topology\.datum\.net/city-code
      name: City
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Location is a place the platform serves traffic or runs workloads from,
          typically a city rather than a cloud vendor's region.

          Every Location names a LocationClass, and where that class lives tells you
          whose capacity is behind the location. A class in the provider's control
          plane is the provider's own footprint, offered to you: the provider owns the
          capacity and operates it. A class in your control plane is capacity you
          brought, such as your own cloud account, and you operate it. Either way the
          controller named on the class is the one that acts, so nothing about the
          location has to restate who runs it.

          Locations the provider offers are declared once on the platform control
          plane and projected into your project's control plane, and onto each cell as
          a ServingLocation telling it where it sits. A projected Location is the
          statement that the location is offered to you; edit the platform copy, not
          the projection. Locations you declare yourself, on your own class, are yours
          to edit.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LocationSpec defines the desired state of Location.
            properties:
              coordinates:
                description: |-
                  The geographic coordinates of the location, used by consumers that need
                  to plot the location on a map.
                properties:
                  latitude:
                    description: Latitude in decimal degrees, in the range [-90, 90].
                    pattern: ^-?\d{1,2}(\.\d+)?$
                    type: string
                    x-kubernetes-validations:
                    - message: latitude must be between -90 and 90
                      rule: double(self) >= -90.0 && double(self) <= 90.0
                  longitude:
                    description: Longitude in decimal degrees, in the range [-180,
                      180].
                    pattern: ^-?\d{1,3}(\.\d+)?$
                    type: string
                    x-kubernetes-validations:
                    - message: longitude must be between -180 and 180
                      rule: double(self) >= -180.0 && double(self) <= 180.0
                required:
                - latitude
                - longitude
                type: object
              locationClassRef:
                description: |-
                  LocationClassRef names the LocationClass backing this location. The class
                  decides which controller brings the location up and what capacity sits
                  behind it.

                  Leave the project qualifier empty to name a class in the same control
                  plane as this Location. Set it to name a class in the provider's control
                  plane, which is what you do to place a location on capacity the provider
                  operates.

                  The class must exist and report Accepted=True before the location becomes
                  Ready. Naming a class that does not exist leaves the location not Ready
                  rather than rejecting it, so a location can be declared ahead of the
                  class that will serve it.
                properties:
                  name:
                    description: Name is the name of the LocationClass.
                    maxLength: 253
                    minLength: 1
                    type: string
                  project:
                    description: |-
                      Project names the project whose control plane holds the class. Leave it
                      unset, or empty, for a class that lives alongside this Location.

                      Set it when you are consuming capacity somebody else operates: the class
                      stays in their control plane, where they own it, and your Location points
                      across at it. You do not get a copy of the class, and you cannot change
                      what it offers.
                    maxLength: 253
                    type: string
                required:
                - name
                type: object
              topology:
                additionalProperties:
                  type: string
                description: "The topology of the location\n\nThis may contain arbitrary
                  topology keys. Some keys may be well known, such\nas:\n\t- topology.datum.net/city-code"
                type: object
            required:
            - locationClassRef
            - topology
            type: object
          status:
            description: LocationStatus defines the observed state of Location.
            properties:
              conditions:
                description: Represents the observations of a location's current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
        x-kubernetes-validations:
        - message: name must be at most 63 characters, because it is published as
            a label value
          rule: size(self.metadata.name) <= 63
    served: true
    storage: true
    subresources:
      status: {}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: servinglocations.locations.miloapis.com
spec:
  group: locations.miloapis.com
  names:
    kind: ServingLocation
    listKind: ServingLocationList
    plural: servinglocations
    singular: servinglocation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.topology.topology\.datum\.net/city-code
      name: City
      type: string
    - jsonPath: .spec.topology.topology\.datum\.net/region
      name: Region
      type: string
    - jsonPath: .spec.source.generation
      name: Source Generation
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ServingLocation tells a cell which location it serves.

          A cell is a cluster that runs workloads at one physical location. It cannot
          tell where it is on its own, so the platform delivers it a ServingLocation:
          a read-only copy of a Location, carrying the name and topology of the place
          the cell sits in. Everything the cell does that depends on where it is,
          such as claiming network addresses, resolves through this object.

          A ServingLocation takes the name of the Location it was copied from. Expect
          exactly one on a cell. Two or more means more than one location has been
          delivered to the same cell, and the cell refuses to guess between them.

          This object is managed for you. Create and edit Locations on the platform
          control plane; the copies follow.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ServingLocationSpec describes the location a cell serves.
            properties:
              source:
                description: |-
                  Source identifies the Location this copy came from. Use it to tell how
                  current the copy is: compare it against the Location of the same name to
                  see whether an edit has reached this cell yet.

                  The publisher sets this field. Leave it alone.
                properties:
                  generation:
                    description: |-
                      Generation is the metadata.generation of the Location this copy came
                      from. When it is lower than the Location's current generation, an edit
                      has not reached this cell yet.
                    format: int64
                    type: integer
                  publishedAt:
                    description: |-
                      PublishedAt is when the content of this copy last changed. A copy that is
                      re-checked but not changed keeps its original timestamp, so an old
                      timestamp means the location has been stable, not that publishing has
                      stalled.
                    format: date-time
                    type: string
                type: object
              topology:
                additionalProperties:
                  type: string
                description: "Topology describes where in the world this location
                  is. Workloads placed\nat this location inherit it, and placement
                  rules that ask for a city or a\nregion are answered from these keys.\n\nThe
                  map holds arbitrary keys. Some keys are well known:\n\n\ttopology.datum.net/city-code:
                  IAD\n\ttopology.datum.net/region: us-east-1\n\nYou must supply topology.datum.net/city-code,
                  and it must not be empty.\nA location with no city code cannot serve
                  placement requests that name a\ncity, so the API rejects it. Any
                  other key you set is carried through\nunchanged and is available
                  to workloads at this location.\n\nThis field copies the topology
                  of the Location it was published from.\nEdit the Location, not this
                  copy."
                minProperties: 1
                type: object
                x-kubernetes-validations:
                - message: topology must carry a non-empty topology.datum.net/city-code
                  rule: '''topology.datum.net/city-code'' in self && self[''topology.datum.net/city-code'']
                    != '''''
            required:
            - topology
            type: object
        type: object
    served: true
    storage: true
    subresources: {}

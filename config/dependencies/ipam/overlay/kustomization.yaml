apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything this env adds to the published IPAM bundle, and nothing from it.
# Kept self-contained so `task validate-kustomizations` can build it on a clean
# checkout, where the bundle has not been fetched yet.
#
# The composed deployment — this plus the bundle's base and components, with the
# patches in ../patches — is assembled at task time by test-infra:ipam-bundle
# from ../root-kustomization.yaml.

namespace: ipam-system

resources:
  - cluster-issuer.yaml
  - secret.yaml
  - postgres-cluster.yaml
  - rbac.yaml

# Reaching IPAM as a project is authorized in two places, by two different
# control planes, and both grants have to exist.
#
# 1. Milo authorizes the caller before its aggregator proxies anything. That
#    grant lives in Milo's own store — config/dependencies/milo/bootstrap-in-milo.yaml.
# 2. IPAM then authorizes through a delegated SubjectAccessReview against the
#    KIND apiserver, which is still its delegated-authorization host. So the
#    identity Milo forwarded needs ordinary RBAC here too — which is the role
#    below.
#
# Nothing impersonates any more. The operator addresses a project by URL path
# and holds no impersonation grant at all; Milo resolves the project from the
# path and forwards it as X-Remote-Extra-*, which is where IPAM reads the tenant
# from. The identity IPAM authorizes is the operator's own.
#
# Why IPAM's delegated authorization still points at kind rather than at Milo:
# under RBAC-only Milo the two answer the same question the same way, because
# Milo's RBAC is root-scoped and knows nothing about projects either. Pointing
# it at Milo would add a credential and a second RBAC universe and change no
# decision. See test/e2e/README-milo.md.
#
# ipclasses is not optional: every claim resolves its class on create, so a
# subject without it gets a 403 on every allocation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nso-ipam-tenant
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["ipam.miloapis.com"]
    resources:
      - "ippools"
      - "ippools/status"
      - "ipclasses"
      - "ipclasses/status"
      - "ipclaims"
      - "ipclaims/status"
      - "ipallocations"
      - "ipallocations/status"
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nso-ipam-tenant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nso-ipam-tenant
subjects:
  # The operator's own identity, as Milo authenticated it and forwarded it. It
  # names no project: the path did that. The suites use a different identity,
  # bound to this same role from test/e2e/fixtures/ipam/rbac.yaml — test
  # identities do not belong in the deployment.
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: nso-manager

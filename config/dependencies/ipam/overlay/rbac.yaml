# Two RBAC layers are required to reach IPAM as a project.
#
# 1. Something impersonates a user plus the three iam.miloapis.com extras that
#    carry the project. The kube-apiserver front proxy re-emits those extras as
#    X-Remote-Extra-*, which is where IPAM reads the tenant from.
# 2. IPAM authorizes through a delegated SubjectAccessReview against the host
#    apiserver, so the IMPERSONATED user needs ordinary RBAC of its own — which
#    is the role below.
#
# Layer 1 is no longer the operator's business. The operator addresses a
# project by URL path and holds no impersonation grant at all; in this
# environment the e2e Milo stand-in (test/e2e/milo-shim) terminates that path
# and asserts the tenant, and its impersonation grant ships with it. The kind
# admin credential the fixture seeder runs as is in system:masters and is
# authorized for everything already.
#
# ipclasses is not optional: every claim resolves its class on create, so a
# subject without it gets a 403 on every allocation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nso-ipam-tenant
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["ipam.miloapis.com"]
    resources:
      - "ippools"
      - "ippools/status"
      - "ipclasses"
      - "ipclasses/status"
      - "ipclaims"
      - "ipclaims/status"
      - "ipallocations"
      - "ipallocations/status"
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nso-ipam-tenant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nso-ipam-tenant
subjects:
  # The identity the Milo stand-in asserts once it has resolved a project from
  # the request path. The test suites impersonate a different one, bound to this
  # same role from test/e2e/fixtures/ipam/rbac.yaml — test identities do not
  # belong in the deployment.
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: nso-ipam-agent

# One secret serves two consumers, so the password exists in exactly one place.
#
# IPAM reads `dsn` and passes it to both the migrate init container and the
# apiserver. CNPG reads `username`/`password` to create the application role
# when it bootstraps the cluster, which is why the type is basic-auth — CNPG
# rejects anything else for a bootstrap secret. Extra keys are ignored by both.
#
# Bootstrapping from a secret we author, rather than letting CNPG generate one,
# is what keeps the DSN a static string. CNPG's generated `-app` secret has a
# random password and would force the DSN to be assembled at deploy time from
# values that change on every rebuild.
#
# The host is the read-write service CNPG creates for the cluster below:
# <cluster>-rw. sslmode=disable because CNPG serves TLS with its own internal
# CA, which the client would have to be taught to trust for no benefit here.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ipam-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ipam.miloapis.com
type: kubernetes.io/basic-auth
stringData:
  username: "ipam"
  password: "devpassword"
  dsn: "postgres://ipam:devpassword@ipam-db-rw.ipam-system.svc.cluster.local:5432/ipam?sslmode=disable"

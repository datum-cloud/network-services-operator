---
apiVersion: v1
kind: Service
metadata:
  name: milo-apiserver
  namespace: milo-system
  labels:
    app.kubernetes.io/name: milo-apiserver
spec:
  # NodePort because the chainsaw suites run on the HOST. They address IPAM by
  # project path now, so they need Milo, and on macOS the kind node's cluster
  # network is not host-routable — config/tools/kind/upstream-cluster.yaml maps
  # this port through, the same way it already does for the Karmada apiserver.
  type: NodePort
  selector:
    app.kubernetes.io/name: milo-apiserver
  ports:
    - name: https
      port: 6443
      targetPort: https
      nodePort: 32450
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milo-apiserver
  namespace: milo-system
  labels:
    app.kubernetes.io/name: milo-apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: milo-apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: milo-apiserver
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: milo-apiserver
          # Tag comes from MILO_IMAGE in Taskfile.test-infra.yml, which is the
          # single place the version is pinned.
          image: ghcr.io/milo-os/milo:latest
          imagePullPolicy: IfNotPresent
          args:
            - apiserver
            - --bind-address=0.0.0.0
            - --secure-port=6443
            - --etcd-servers=http://etcd.milo-system.svc.cluster.local:2379
            - --etcd-prefix=/
            - --tls-cert-file=/etc/kubernetes/pki/apiserver/tls.crt
            - --tls-private-key-file=/etc/kubernetes/pki/apiserver/tls.key
            - --client-ca-file=/etc/kubernetes/pki/apiserver/ca.crt
            - --service-account-key-file=/etc/kubernetes/pki/apiserver/ca.crt
            - --service-account-issuer=https://milo-apiserver.milo-system.svc.cluster.local
            - --token-auth-file=/etc/kubernetes/auth/tokens.csv
            # RBAC only. Milo's own test overlay runs this way; the alternative
            # is the OpenFGA authorization provider, which this environment does
            # not deploy. See the note in test/e2e/README-milo.md — per-project
            # authorization is NOT exercised here.
            - --authorization-mode=RBAC
            # The client certificate Milo's aggregator presents to IPAM. Without
            # these two the aggregator proxies anonymously and IPAM rejects
            # every request; Milo's base deployment leaves them empty.
            - --proxy-client-cert-file=/etc/kubernetes/pki/front-proxy/tls.crt
            - --proxy-client-key-file=/etc/kubernetes/pki/front-proxy/tls.key
            # Forwarded to the aggregated apiserver as X-Remote-Extra-*. IPAM
            # reads the project it must scope storage to out of these.
            - --forward-extras=iam.miloapis.com/parent-api-group,iam.miloapis.com/parent-type,iam.miloapis.com/parent-name
            - --feature-gates=DiscoveryContextFilter=true
            - --logging-format=json
            - --v=2
          env:
            # Trust Milo's own CA for outbound TLS, matching its test overlay.
            - name: SSL_CERT_DIR
              value: /etc/certs/ssl
          ports:
            - name: https
              containerPort: 6443
          startupProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 15
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: auth-tokens
              mountPath: /etc/kubernetes/auth
              readOnly: true
            - name: tls-certs
              mountPath: /etc/kubernetes/pki/apiserver
              readOnly: true
            - name: front-proxy
              mountPath: /etc/kubernetes/pki/front-proxy
              readOnly: true
            - name: system-certs
              mountPath: /etc/certs/ssl/milo-ca.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: auth-tokens
          secret:
            secretName: milo-apiserver-auth-tokens
        - name: tls-certs
          secret:
            secretName: milo-apiserver-tls
        - name: front-proxy
          secret:
            secretName: milo-front-proxy-client
        - name: system-certs
          secret:
            secretName: milo-apiserver-tls
            items:
              - key: ca.crt
                path: ca.crt

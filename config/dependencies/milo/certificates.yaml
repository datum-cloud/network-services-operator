---
# Milo's certificates, all chaining to one CA so a single bundle verifies both
# directions: clients verify Milo's serving cert, and IPAM verifies the client
# cert Milo's aggregator presents when it proxies.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: milo-selfsigned
  namespace: milo-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: milo-ca
  namespace: milo-system
spec:
  isCA: true
  commonName: milo-ca
  secretName: milo-ca
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: milo-selfsigned
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: milo-ca-issuer
  namespace: milo-system
spec:
  ca:
    secretName: milo-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: milo-apiserver-tls
  namespace: milo-system
spec:
  secretName: milo-apiserver-tls
  duration: 8760h
  commonName: milo-apiserver.milo-system.svc
  dnsNames:
    - milo-apiserver
    - milo-apiserver.milo-system
    - milo-apiserver.milo-system.svc
    - milo-apiserver.milo-system.svc.cluster.local
  usages:
    - server auth
    - digital signature
    - key encipherment
  issuerRef:
    name: milo-ca-issuer
    kind: Issuer
    group: cert-manager.io
---
# The identity Milo's aggregator presents to an aggregated apiserver. IPAM
# verifies it against --requestheader-client-ca-file and only then believes the
# X-Remote-User / X-Remote-Extra-* headers on the request — which is how the
# project the URL named reaches IPAM as a tenant.
#
# Milo's base deployment leaves --proxy-client-cert-file empty; supplying this
# is what makes remote aggregation work at all.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: milo-front-proxy-client
  namespace: milo-system
spec:
  secretName: milo-front-proxy-client
  duration: 8760h
  commonName: milo-front-proxy-client
  usages:
    - client auth
    - digital signature
    - key encipherment
  issuerRef:
    name: milo-ca-issuer
    kind: Issuer
    group: cert-manager.io

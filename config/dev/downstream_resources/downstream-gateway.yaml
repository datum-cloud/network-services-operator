---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: auto-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auto-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: auto-ca
  secretName: auto
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: auto-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: auto
spec:
  ca:
    secretName: auto
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: datum-downstream-gateway
  namespace: datum-downstream-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        # The VPC-ingress VRF/SRv6 sidecar (#855) has no native EnvoyDeployment
        # field to attach to — `container` customizes only the main Envoy
        # container, and `initContainers` is run-to-completion, not
        # long-running. Adding a genuinely new sidecar container requires this
        # StrategicMerge patch on spec.template.spec.containers: Kubernetes'
        # strategic-merge semantics key PodSpec.Containers by `name`, so a
        # name not already present is appended rather than replacing the
        # existing containers this EnvoyProxy CR generates.
        #
        # What this sidecar delivers here, and what it does not. The VRF
        # device half is netlink work inside this pod's own network
        # namespace, so it runs anywhere and is what makes Envoy's
        # SO_BINDTODEVICE bind resolve instead of failing on a missing
        # device. The SRv6 egress half writes into galactic's TC-BPF
        # egress_route_table, a map pinned at /sys/fs/bpf/galactic by
        # galactic-cni and read by a program galactic attaches in the host
        # namespace. Neither exists on a cluster without galactic-cni, and
        # the link/L2 next hop that half resolves is a host-namespace
        # ifindex, so it stays a no-op from in here regardless. Reaching a
        # VPC member end to end still needs galactic-side work.
        #
        # Pinned Envoy Gateway version for this raw-patch mechanism:
        # Taskfile.test-infra.yml's ENVOY_GATEWAY_VERSION (currently v1.7.4)
        # — a version bump there should be a deliberate, tested action, since
        # there's no first-class API guarding this patch shape.
        patch:
          type: StrategicMerge
          value:
            spec:
              selector:
                matchLabels:
                  gateway.datum.net/role: core-deployment
              template:
                metadata:
                  labels:
                    gateway.datum.net/role: core-deployment
                spec:
                  containers:
                    - name: vpc-vrf-sidecar
                      image: ghcr.io/datum-cloud/galactic-vrf:v0.0.0-main
                      args:
                        - --metrics-port=9182
                      securityContext:
                        runAsUser: 0
                        capabilities:
                          drop:
                            - ALL
                          add:
                            - NET_ADMIN
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                      resources:
                        requests:
                          cpu: 5m
                          memory: 32Mi
                        limits:
                          memory: 64Mi
                      volumeMounts:
                        - name: vpc-vrf-lock
                          mountPath: /var/lib/cni/galactic-vrf
                        # Envoy Gateway sets automountServiceAccountToken:
                        # false on the pods it generates, so nothing projects a
                        # token and the sidecar's in-cluster config fails at
                        # startup. Mount one here and only here: Envoy is
                        # internet-facing and that default-off is deliberate,
                        # and a volume the proxy container does not mount is
                        # not reachable from it.
                        - name: vpc-vrf-kube-api-access
                          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                          readOnly: true
        pod:
          volumes:
            - name: coraza-waf
              emptyDir: {}
            # internal/plumbing/vrf's cross-process flock directory. The
            # image is distroless:nonroot, so the binary cannot create it
            # under a read-only root; mount it at the literal path the
            # constant names.
            - name: vpc-vrf-lock
              emptyDir: {}
            # The token the kubelet would have projected had Envoy Gateway not
            # disabled automounting. No audience on purpose: an omitted
            # audience is the API server's own default, which is what the local
            # apiserver validates against, so naming one is a way to break this
            # rather than harden it. 3607s is the kubelet default and sits well
            # above the apiserver's 600s floor; the file is rotated in place.
            - name: vpc-vrf-kube-api-access
              projected:
                defaultMode: 420
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 3607
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
                  - downwardAPI:
                      items:
                        - fieldRef:
                            apiVersion: v1
                            fieldPath: metadata.namespace
                          path: namespace
        container:
          image: envoyproxy/envoy:contrib-v1.35.0
          # Required for the vpcPod socket-bind mutation (#856 step 4) to
          # succeed: SO_BINDTODEVICE requires CAP_NET_RAW on the process
          # making the setsockopt call, which is Envoy itself, not the
          # sidecar above (its CAP_NET_ADMIN is for netlink VRF/route
          # management only and does nothing for this).
          securityContext:
            capabilities:
              add:
                - NET_RAW
          volumeMounts:
            - name: coraza-waf
              mountPath: /opt/coraza-waf
        initContainers:
          - name: coraza-waf
            image: ghcr.io/datum-labs/coraza-envoy-go-filter/coraza-waf:v1.3.0-alpha10
            imagePullPolicy: IfNotPresent
            command:
              - cp
              - /coraza-waf.so
              - /opt/coraza-waf/
            volumeMounts:
              - name: coraza-waf
                mountPath: /opt/coraza-waf
      envoyService:
        externalTrafficPolicy: Cluster
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              trafficDistribution: PreferClose
              ipFamilyPolicy: RequireDualStack
              ports:
                - name: http-80
                  nodePort: 30080
                  port: 80
                - name: https-443
                  nodePort: 30443
                  port: 443
  mergeGateways: true
  ipFamily: DualStack
  telemetry:
    metrics:
      prometheus:
        disable: false
      enableVirtualHostStats: true
      enablePerEndpointStats: true
    accessLog:
      settings:
        - sinks:
            - type: File
              file:
                path: /dev/stdout
          format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              duration: "%DURATION%"
              route_name: "%ROUTE_NAME%"
              project_name: "%METADATA(ROUTE:datum-gateway:project_name)%"
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: datum-downstream-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: datum-downstream-gateway
    namespace: datum-downstream-gateway
---
# If not Gateway is associated with a GatewayClass, the Envoy Gateway controller
# will not provision the gateway infrastructure. This may become the canary /
# monitoring endpoint in the future.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: anchor-gateway
  namespace: datum-downstream-gateway
spec:
  gatewayClassName: datum-downstream-gateway
  listeners:
  - protocol: HTTP
    port: 80
    name: default-http
    hostname: canary.prism.e2e.env.datum.net
    allowedRoutes:
      namespaces:
        from: All
  - protocol: HTTPS
    port: 443
    name: default-https
    hostname: canary.prism.e2e.env.datum.net
    allowedRoutes:
      namespaces:
        from: All
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: anchor-gateway-default-https
      mode: Terminate
---
# The VRF sidecar's desired state is a cluster-scoped EndpointSlice watch. Its
# informer cache never syncs without this, and the binary's own RBAC pre-flight
# says so at startup. Read-only: it never writes an EndpointSlice.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vpc-vrf-sidecar-endpointslice-viewer
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
# Envoy Gateway names the proxy ServiceAccount after a hash of the merged
# GatewayClass, so it cannot be named here. Every ServiceAccount in this
# namespace is Envoy Gateway's own control plane or a proxy it provisioned.
# Binding the group rather than a name is what keeps this correct when that
# hash moves: the pre-flight check logs and continues, so a binding that missed
# would leave the sidecar running and watching nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vpc-vrf-sidecar-endpointslice-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vpc-vrf-sidecar-endpointslice-viewer
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:datum-downstream-gateway

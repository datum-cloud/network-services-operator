---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: auto-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auto-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: auto-ca
  secretName: auto
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: auto-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: auto
spec:
  ca:
    secretName: auto
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: datum-downstream-gateway
  namespace: datum-downstream-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        # The VPC-ingress VRF/SRv6 sidecar (#855) has no native EnvoyDeployment
        # field to attach to — `container` customizes only the main Envoy
        # container, and `initContainers` is run-to-completion, not
        # long-running. Adding a genuinely new sidecar container requires this
        # StrategicMerge patch on spec.template.spec.containers: Kubernetes'
        # strategic-merge semantics key PodSpec.Containers by `name`, so a
        # name not already present is appended rather than replacing the
        # existing containers this EnvoyProxy CR generates.
        #
        # TODO(#856): sidecar binary is a placeholder pending #855 — using
        # busybox/sleep instead of a nonexistent image so this manifest stays
        # deployable (task test-infra:up, `make run`) in the meantime. Swap
        # the image/command for #855's real binary once it's published; the
        # container name, CAP_NET_ADMIN, and patch location can stay as-is.
        # Pinned Envoy Gateway version for this raw-patch mechanism:
        # Taskfile.test-infra.yml's ENVOY_GATEWAY_VERSION (currently v1.7.4)
        # — a version bump there should be a deliberate, tested action, since
        # there's no first-class API guarding this patch shape.
        patch:
          type: StrategicMerge
          value:
            spec:
              selector:
                matchLabels:
                  gateway.datum.net/role: core-deployment
              template:
                metadata:
                  labels:
                    gateway.datum.net/role: core-deployment
                spec:
                  containers:
                    - name: vpc-vrf-sidecar
                      image: busybox:1.36
                      command: ["sleep", "infinity"]
                      securityContext:
                        capabilities:
                          add:
                            - NET_ADMIN
        pod:
          volumes:
            - name: coraza-waf
              emptyDir: {}
        container:
          image: envoyproxy/envoy:contrib-v1.35.0
          # Required for the vpcPod socket-bind mutation (#856 step 4) to
          # succeed: SO_BINDTODEVICE requires CAP_NET_RAW on the process
          # making the setsockopt call, which is Envoy itself, not the
          # sidecar above (its CAP_NET_ADMIN is for netlink VRF/route
          # management only and does nothing for this).
          securityContext:
            capabilities:
              add:
                - NET_RAW
          volumeMounts:
            - name: coraza-waf
              mountPath: /opt/coraza-waf
        initContainers:
          - name: coraza-waf
            image: ghcr.io/datum-labs/coraza-envoy-go-filter/coraza-waf:v1.3.0-alpha10
            imagePullPolicy: IfNotPresent
            command:
              - cp
              - /coraza-waf.so
              - /opt/coraza-waf/
            volumeMounts:
              - name: coraza-waf
                mountPath: /opt/coraza-waf
      envoyService:
        externalTrafficPolicy: Cluster
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              trafficDistribution: PreferClose
              ipFamilyPolicy: RequireDualStack
              ports:
                - name: http-80
                  nodePort: 30080
                  port: 80
                - name: https-443
                  nodePort: 30443
                  port: 443
  mergeGateways: true
  ipFamily: DualStack
  telemetry:
    metrics:
      prometheus:
        disable: false
      enableVirtualHostStats: true
      enablePerEndpointStats: true
    accessLog:
      settings:
        - sinks:
            - type: File
              file:
                path: /dev/stdout
          format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              duration: "%DURATION%"
              route_name: "%ROUTE_NAME%"
              project_name: "%METADATA(ROUTE:datum-gateway:project_name)%"
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: datum-downstream-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: datum-downstream-gateway
    namespace: datum-downstream-gateway
---
# If not Gateway is associated with a GatewayClass, the Envoy Gateway controller
# will not provision the gateway infrastructure. This may become the canary /
# monitoring endpoint in the future.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: anchor-gateway
  namespace: datum-downstream-gateway
spec:
  gatewayClassName: datum-downstream-gateway
  listeners:
  - protocol: HTTP
    port: 80
    name: default-http
    hostname: canary.prism.e2e.env.datum.net
    allowedRoutes:
      namespaces:
        from: All
  - protocol: HTTPS
    port: 443
    name: default-https
    hostname: canary.prism.e2e.env.datum.net
    allowedRoutes:
      namespaces:
        from: All
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: anchor-gateway-default-https
      mode: Terminate

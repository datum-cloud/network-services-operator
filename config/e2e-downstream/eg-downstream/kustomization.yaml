# The downstream Envoy Gateway install for the e2e environment, with the
# production edge's settings; see docs/testing/e2e-version-pins.md.
resources:
  - namespace.yaml
  - nso-crd-rbac.yaml
helmCharts:
  - name: gateway-helm
    includeCRDs: false
    namespace: datum-downstream-gateway
    releaseName: envoy-datum-downstream-gateway
    # The production edge version. Pulled from the OCI repo so this dir needs
    # no vendored chart.
    version: v1.9.2
    repo: oci://docker.io/envoyproxy
    valuesInline:
      # The CRDs come from eg-crds. From v1.8.1 the chart also renders its
      # safe-upgrades admission policy unless this is off.
      crds:
        enabled: false
      # Each replica calls the extension server, as on the edge.
      deployment:
        replicas: 2
      config:
        envoyGateway:
          gateway:
            controllerName: gateway.envoyproxy.io/datum-downstream-gateway
          extensionApis:
            enableBackend: true
            enableEnvoyPatchPolicy: false
          runtimeFlags:
            enabled:
              - XDSNameSchemeV2
              - PerResourceSystemCASecret
          provider:
            type: Kubernetes
            kubernetes:
              watch:
                type: NamespaceSelector
                namespaceSelector:
                  matchExpressions:
                    - key: meta.datumapis.com/upstream-cluster-name
                      operator: Exists
          extensionManager:
            # Match the extension server's larger message limit. The default is
            # far smaller, and once configuration grows past it, updates silently
            # stop reaching the proxies.
            maxMessageSize: 256Mi
            policyResources:
              - group: networking.datumapis.com
                version: v1alpha
                kind: TrafficProtectionPolicy
            resources:
              - group: networking.datumapis.com
                version: v1alpha1
                kind: Connector
            service:
              fqdn:
                hostname: network-services-operator-envoy-gateway-extension-server.network-services-operator-system.svc.cluster.local
                port: 5005
              tls:
                certificateRef:
                  # The certificate authority that signed the extension server's
                  # certificate, so the control plane can trust it. Published by
                  # bring-up.
                  name: e2e-extension-server-ca
                  namespace: network-services-operator-system
                clientCertificateRef:
                  name: envoy-gateway-extension-server-eg-client-tls
                  namespace: network-services-operator-system
              retry:
                maxAttempts: 4
                initialBackoff: 100ms
                maxBackoff: 1s
                backoffMultiplier:
                  numerator: 200
                retryableStatusCodes:
                  - UNAVAILABLE
            hooks:
              xdsTranslator:
                post:
                  - Translation
                translation:
                  listener:
                    includeAll: true   # MANDATORY — without this, WAF listener filter + per-route mutations are silently dropped
                  route:
                    includeAll: true   # MANDATORY — without this, WAF listener filter + per-route mutations are silently dropped
                  cluster:
                    includeAll: true
                  secret:
                    includeAll: true
            # Block updates when the extension server errors instead of serving
            # unprotected configuration; the proxy keeps its last good config.
            failOpen: false

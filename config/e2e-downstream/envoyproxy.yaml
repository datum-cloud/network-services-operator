# Test edge data plane for the downstream gateway. It models the production edge
# proxy on the two things that matter for testing: the real WAF image, and an
# admin endpoint (test-env-only) so the suite and parity gate can read the
# proxy's live configuration and stats.
#
# Here the data plane is a Deployment/Service rather than the production
# DaemonSet, which does not change WAF or configuration behavior.
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: datum-downstream-gateway
  namespace: datum-downstream-gateway
spec:
  mergeGateways: true
  ipFamily: DualStack
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        # See config/dev/downstream_resources/downstream-gateway.yaml for why
        # the VPC-ingress VRF/SRv6 sidecar (#855) has to go in via a
        # StrategicMerge patch on spec.template.spec.containers rather than a
        # native EnvoyDeployment field, and for what this sidecar can and
        # cannot do from inside the Envoy pod's own network namespace.
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: vpc-vrf-sidecar
                      image: ghcr.io/datum-cloud/galactic-vrf:v0.0.0-main
                      args:
                        - --metrics-port=9182
                      securityContext:
                        runAsUser: 0
                        capabilities:
                          drop:
                            - ALL
                          add:
                            - NET_ADMIN
                            # See config/dev/downstream_resources/downstream-gateway.yaml
                            # for why: #855's sidecar opens a pinned eBPF map
                            # (galactic's egress_route_table, via
                            # internal/plumbing/srv6.RouteEgressAdd) since galactic
                            # commit 8475bf9 replaced the netlink-native SEG6 encap
                            # route (broken by CVE-2026-31668) with a TC-BPF one.
                            # NET_ADMIN alone doesn't cover the bpf() syscalls that
                            # requires.
                            - BPF
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                      resources:
                        requests:
                          cpu: 5m
                          memory: 32Mi
                        limits:
                          memory: 64Mi
                      volumeMounts:
                        - name: vpc-vrf-lock
                          mountPath: /var/lib/cni/galactic-vrf
                        # Envoy Gateway sets automountServiceAccountToken:
                        # false on the pods it generates, so nothing projects a
                        # token and the sidecar's in-cluster config fails at
                        # startup. Mount one here and only here: Envoy is
                        # internet-facing and that default-off is deliberate,
                        # and a volume the proxy container does not mount is
                        # not reachable from it.
                        - name: vpc-vrf-kube-api-access
                          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                          readOnly: true
                        - name: bpf-fs
                          mountPath: /sys/fs/bpf
        pod:
          volumes:
            - name: coraza-waf
              emptyDir: {}
            # internal/plumbing/vrf's cross-process flock directory. The
            # image is distroless:nonroot, so the binary cannot create it
            # under a read-only root; mount it at the literal path the
            # constant names.
            - name: vpc-vrf-lock
              emptyDir: {}
            # The token the kubelet would have projected had Envoy Gateway not
            # disabled automounting. No audience on purpose: an omitted
            # audience is the API server's own default, which is what the local
            # apiserver validates against, so naming one is a way to break this
            # rather than harden it. 3607s is the kubelet default and sits well
            # above the apiserver's 600s floor; the file is rotated in place.
            - name: vpc-vrf-kube-api-access
              projected:
                defaultMode: 420
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 3607
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
                  - downwardAPI:
                      items:
                        - fieldRef:
                            apiVersion: v1
                            fieldPath: metadata.namespace
                          path: namespace
            - name: bpf-fs
              # Same convention as galactic's own config/galactic-router,
              # config/galactic-gateway DaemonSets. `Directory` (not
              # DirectoryOrCreate): fail loudly if bpffs isn't actually mounted at
              # this host path, rather than masking the failure.
              hostPath:
                path: /sys/fs/bpf
                type: Directory
        container:
          image: envoyproxy/envoy:contrib-v1.37.1
          # Required for the vpcPod socket-bind mutation (#856 step 4) —
          # SO_BINDTODEVICE needs CAP_NET_RAW on Envoy itself, separate from
          # the sidecar's CAP_NET_ADMIN above.
          securityContext:
            capabilities:
              add:
                - NET_RAW
          volumeMounts:
            - name: coraza-waf
              mountPath: /opt/coraza-waf
        initContainers:
          - name: coraza-waf
            # Multi-arch build of the same WAF filter as the production edge. The
            # multi-arch image loads natively on arm64 dev hosts as well as on
            # amd64 CI and production — same filter, same rules.
            image: ghcr.io/datum-labs/coraza-envoy-go-filter/coraza-waf:v1.3.0-multiarch.1
            imagePullPolicy: IfNotPresent
            command:
              - cp
              - /coraza-waf.so
              - /opt/coraza-waf/
            volumeMounts:
              - name: coraza-waf
                mountPath: /opt/coraza-waf
      envoyService:
        externalTrafficPolicy: Cluster
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ipFamilyPolicy: RequireDualStack
              ports:
                - name: http-80
                  nodePort: 30080
                  port: 80
                - name: https-443
                  nodePort: 30443
                  port: 443
  # TEST-ENV-ONLY: expose the proxy's admin interface so an in-cluster runner can
  # read its live configuration and stats. The admin endpoint is unauthenticated
  # and must never be applied in production — a CI guard asserts this patch is
  # absent from any non-e2e output.
  bootstrap:
    type: JSONPatch
    jsonPatches:
      - op: add
        path: /admin/address
        value:
          socket_address:
            address: 0.0.0.0
            port_value: 19000
  telemetry:
    accessLog:
      settings:
        - sinks:
            - type: File
              file:
                path: /dev/stdout
          format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              duration: "%DURATION%"
              route_name: "%ROUTE_NAME%"
              project_name: "%METADATA(ROUTE:datum-gateway:project_name)%"
              request_id: "%REQ(X-REQUEST-ID)%"
    metrics:
      prometheus:
        disable: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: datum-downstream-gateway-e2e
spec:
  controllerName: gateway.envoyproxy.io/datum-downstream-gateway
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: datum-downstream-gateway
    namespace: datum-downstream-gateway
---
# The VRF sidecar's desired state is a cluster-scoped EndpointSlice watch. Its
# informer cache never syncs without this, and the binary's own RBAC pre-flight
# says so at startup. Read-only: it never writes an EndpointSlice.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vpc-vrf-sidecar-endpointslice-viewer
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
# Envoy Gateway names the proxy ServiceAccount after a hash of the merged
# GatewayClass, so it cannot be named here. Every ServiceAccount in this
# namespace is Envoy Gateway's own control plane or a proxy it provisioned.
# Binding the group rather than a name is what keeps this correct when that
# hash moves: the pre-flight check logs and continues, so a binding that missed
# would leave the sidecar running and watching nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vpc-vrf-sidecar-endpointslice-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vpc-vrf-sidecar-endpointslice-viewer
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:datum-downstream-gateway

apiVersion: apiserver.config.datumapis.com/v1alpha1
kind: NetworkServicesOperator
metricsServer:
  bindAddress: ":8443"
webhookServer:
  tls:
    certDir: /k8s-webhook-server
gateway:
  targetDomain: prism.e2e.env.datum.net
  downstreamGatewayClassName: datum-downstream-gateway-e2e
  # Match production: the extension server configures every proxy, so NSO must
  # not also emit its own patch policies.
  eppEmissionEnabled: false
  # Enable DNSRecordSet creation for claimed Gateway hostnames. Requires
  # dns-operator CRDs installed via `task test-infra:dns-crds` (wired into
  # test-infra:up) before the operator starts.
  enableDNSIntegration: true
  permittedTLSOptions:
    gateway.networking.datumapis.com/certificate-issuer: []
downstreamResourceManagement:
  kubeconfigPath: /etc/downstream-cluster/kubeconfig
ipam:
  kubeconfigPath: /etc/ipam-cluster/kubeconfig
  impersonateUsername: nso-ipam-agent
networkInterface:
  enabled: true
  # No ServingLocation is delivered to the upstream cell by default, so this is
  # the configured fallback the identity scenarios exercise.
  location:
    name: us-central-1
    namespace: default
locationPublisher:
  enabled: true
  hubKubeconfigPath: /etc/karmada-hub/kubeconfig
  safetyResyncPeriod: 1m

namespace: network-services-operator-system
namePrefix: network-services-operator-

resources:
  - ../crd
  - ../crd/gateway
  - ../rbac
  - ../manager
  - ../certmanager

components:
  - ../rbac_deployment
  - ../webhook

configMapGenerator:
  - name: config
    behavior: replace
    files:
      - config.yaml

patches:
  - path: manager_webhook_patch.yaml
  - target:
      kind: Deployment
      name: controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: controller-manager
      spec:
        template:
          spec:
            containers:
              - name: manager
                resources:
                  limits:
                    cpu: "2"
                    memory: 2Gi
                  requests:
                    cpu: 500m
                    memory: 512Mi
  - target:
      kind: Deployment
      name: controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: controller-manager
      spec:
        template:
          spec:
            containers:
              - name: manager
                volumeMounts:
                - name: downstream-cluster-kubeconfig
                  mountPath: /etc/downstream-cluster
                - name: ipam-cluster-kubeconfig
                  mountPath: /etc/ipam-cluster
                - name: karmada-hub-kubeconfig
                  mountPath: /etc/karmada-hub
            volumes:
              - name: downstream-cluster-kubeconfig
                secret:
                  secretName: downstream-cluster-kubeconfig
              # Optional only so a missing secret fails in the manager rather
              # than in the kubelet. It does NOT make the manager tolerate the
              # secret's absence: with networkInterface.enabled true, loading
              # the IPAM kubeconfig is part of setup, and failing it exits the
              # process — so the manager crashloops and takes every other
              # controller with it. Deliberate: a clear "unable to load IPAM
              # kubeconfig" beats a manager that comes up half-functional.
              # test-infra:up creates the secret before prepare-upstream.
              - name: ipam-cluster-kubeconfig
                secret:
                  secretName: ipam-cluster-kubeconfig
                  optional: true
              # test-infra:karmada-hub-secret creates this after the manager is
              # already deployed, so the manager crashloops until the hub exists
              # — the same accepted ordering as the downstream kubeconfig above.
              - name: karmada-hub-kubeconfig
                secret:
                  secretName: karmada-hub-kubeconfig
                  optional: true

replacements:
  - source: # Add cert-manager annotation to ValidatingWebhookConfiguration, MutatingWebhookConfiguration and CRDs
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert # this name should match the one in certificate.yaml
      fieldPath: .metadata.namespace # namespace of the certificate CR
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 0
          create: true
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 0
          create: true
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert # this name should match the one in certificate.yaml
      fieldPath: .metadata.name
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 1
          create: true
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 1
          create: true
  - source: # Insert service dns address into the certificate
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: .metadata.name # namespace of the service
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
        fieldPaths:
          - .spec.dnsNames.0
          - .spec.dnsNames.1
        options:
          delimiter: '.'
          index: 0
          create: true
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: .metadata.namespace # namespace of the service
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
        fieldPaths:
          - .spec.dnsNames.0
          - .spec.dnsNames.1
        options:
          delimiter: '.'
          index: 1
          create: true

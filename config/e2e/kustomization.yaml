namespace: network-services-operator-system
namePrefix: network-services-operator-

resources:
  - ../crd
  - ../crd/gateway
  - ../rbac
  - ../manager
  - ../certmanager

components:
  - ../rbac_deployment
  - ../webhook
  - ../components/cell-controllers

configMapGenerator:
  - name: config
    behavior: replace
    files:
      - config.yaml

patches:
  - path: manager_webhook_patch.yaml
  # A generator merge would replace the whole config.yaml key, and a
  # `behavior: replace` generator cannot see a ConfigMap a component generated.
  - target:
      kind: ConfigMap
      name: cell-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: cell-config
      data:
        config.yaml: |
          apiVersion: apiserver.config.datumapis.com/v1alpha1
          kind: CellControllerManager
          metricsServer:
            bindAddress: ":8443"
          ipam:
            kubeconfigPath: /etc/ipam-cluster/kubeconfig
          federation:
            kubeconfigPath: /etc/karmada-hub/kubeconfig
          location:
            name: us-central-1
  - target:
      kind: Deployment
      name: cell-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cell-controller-manager
      spec:
        template:
          spec:
            containers:
              - name: manager
                volumeMounts:
                - name: karmada-hub-kubeconfig
                  mountPath: /etc/karmada-hub
            volumes:
              # test-infra:karmada-hub-secret creates this after the cell is
              # deployed, so the cell crashloops until it exists.
              - name: karmada-hub-kubeconfig
                secret:
                  secretName: karmada-hub-kubeconfig
                  optional: true
  - target:
      kind: Deployment
      name: controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: controller-manager
      spec:
        template:
          spec:
            containers:
              - name: manager
                resources:
                  limits:
                    cpu: "2"
                    memory: 2Gi
                  requests:
                    cpu: 500m
                    memory: 512Mi
  - target:
      kind: Deployment
      name: controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: controller-manager
      spec:
        template:
          spec:
            containers:
              - name: manager
                volumeMounts:
                - name: downstream-cluster-kubeconfig
                  mountPath: /etc/downstream-cluster
                - name: karmada-hub-kubeconfig
                  mountPath: /etc/karmada-hub
                - name: ipam-cluster-kubeconfig
                  mountPath: /etc/ipam-cluster
            volumes:
              - name: downstream-cluster-kubeconfig
                secret:
                  secretName: downstream-cluster-kubeconfig
              - name: ipam-cluster-kubeconfig
                secret:
                  secretName: ipam-cluster-kubeconfig
              # test-infra:karmada-hub-secret creates this after the manager
              # is deployed, so the manager crashloops until it exists.
              - name: karmada-hub-kubeconfig
                secret:
                  secretName: karmada-hub-kubeconfig
                  optional: true

replacements:
  - source: # Add cert-manager annotation to ValidatingWebhookConfiguration, MutatingWebhookConfiguration and CRDs
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert # this name should match the one in certificate.yaml
      fieldPath: .metadata.namespace # namespace of the certificate CR
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 0
          create: true
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 0
          create: true
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert # this name should match the one in certificate.yaml
      fieldPath: .metadata.name
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 1
          create: true
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 1
          create: true
  - source: # Insert service dns address into the certificate
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: .metadata.name # namespace of the service
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
        fieldPaths:
          - .spec.dnsNames.0
          - .spec.dnsNames.1
        options:
          delimiter: '.'
          index: 0
          create: true
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: .metadata.namespace # namespace of the service
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
        fieldPaths:
          - .spec.dnsNames.0
          - .spec.dnsNames.1
        options:
          delimiter: '.'
          index: 1
          create: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: network-services-operator
    app.kubernetes.io/component: envoy-gateway-extension-server
    app.kubernetes.io/managed-by: kustomize
  name: envoy-gateway-extension-server-role
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.datumapis.com
    resources:
      - trafficprotectionpolicies
      - httpproxies
      - connectors
    verbs:
      - get
      - list
      - watch
  # Reads the CNI-published EndpointSlice a vpcPod HTTPProxy backend
  # references, to resolve the tenant-id label the socket-bind mutation
  # keys on (#856). This file is hand-maintained — `make manifests` does
  # not generate it.
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.datumapis.com
    resources:
      - httpproxies/status
      - connectors/status
    verbs:
      - get
  # Edge-local Programmed feedback for TrafficProtectionPolicy (NSO#266). Every
  # replica writes only its own ancestors, never an older generation over a
  # newer one; upstream NSO mirrors the Karmada-aggregated value to tenants.
  - apiGroups:
      - networking.datumapis.com
    resources:
      - trafficprotectionpolicies/status
    verbs:
      - get
      - update
      - patch
  # The edge re-translation controller patches a trigger annotation onto
  # Gateways to make Envoy Gateway re-translate when a Connector's liveness
  # changes. The TPP Programmed report also caches Gateway and HTTPRoute
  # metadata, to remove a claim when its target no longer exists.
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - watch

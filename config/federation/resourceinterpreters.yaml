apiVersion: config.karmada.io/v1alpha1
kind: ResourceInterpreterCustomization
metadata:
  name: gateway.envoyproxy.io-securitypolicy
spec:
  target:
    apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: SecurityPolicy
  customizations:
    statusAggregation:
      luaScript: |
        local function conditionByType(conds, typ)
          if conds == nil then
            return nil
          end
          for _, c in ipairs(conds) do
            if c.type == typ then
              return c
            end
          end
          return nil
        end

        local function typesOf(statusItems, pick)
          local seen, out = {}, {}
          for _, it in ipairs(statusItems) do
            local conds = nil
            if it.status ~= nil then
              conds = pick(it.status)
            end
            if conds ~= nil then
              for _, c in ipairs(conds) do
                if c.type ~= nil and not seen[c.type] then
                  seen[c.type] = true
                  out[#out + 1] = c.type
                end
              end
            end
          end
          return out
        end

        local function aggregateCondition(statusItems, pick, typ)
          local total = #statusItems
          local waiting, falses = {}, {}
          local first, latest = nil, nil
          for _, it in ipairs(statusItems) do
            local c = nil
            if it.status ~= nil then
              c = conditionByType(pick(it.status), typ)
            end
            if c ~= nil and c.lastTransitionTime ~= nil and (latest == nil or c.lastTransitionTime > latest) then
              latest = c.lastTransitionTime
            end
            if c == nil or c.status == nil or c.status == "Unknown" then
              waiting[#waiting + 1] = it.clusterName
            else
              if first == nil then
                first = c
              end
              if c.status ~= "True" then
                falses[#falses + 1] = { cluster = it.clusterName, cond = c }
              end
            end
          end
          local out = { type = typ, lastTransitionTime = latest or "1970-01-01T00:00:00Z" }
          if first ~= nil then
            out.observedGeneration = first.observedGeneration
          end
          if #falses > 0 then
            out.status = "False"
            out.reason = falses[1].cond.reason
            local msg = falses[1].cluster .. ": " .. (falses[1].cond.message or "")
            if #falses > 1 then
              local others = {}
              for i = 2, #falses do
                others[#others + 1] = falses[i].cluster
              end
              msg = msg .. " (also " .. table.concat(others, ", ") .. ")"
            end
            out.message = msg
          elseif #waiting > 0 then
            out.status = "Unknown"
            out.reason = "Pending"
            out.message = "Waiting on " .. table.concat(waiting, ", ")
          else
            out.status = "True"
            out.reason = first.reason
            out.message = typ .. " on " .. total .. " of " .. total .. " clusters"
          end
          return out
        end

        local function aggregateConditions(statusItems, pick)
          local out = {}
          for _, typ in ipairs(typesOf(statusItems, pick)) do
            out[#out + 1] = aggregateCondition(statusItems, pick, typ)
          end
          return out
        end

        local function firstWith(statusItems, pick)
          for _, it in ipairs(statusItems) do
            if it.status ~= nil then
              local v = pick(it.status)
              if v ~= nil then
                return v
              end
            end
          end
          return nil
        end

        local function refKey(ref, controllerName)
          if ref == nil then
            ref = {}
          end
          local parts = { controllerName or "", ref.group or "", ref.kind or "", ref.namespace or "", ref.name or "", ref.sectionName or "" }
          if ref.port ~= nil then
            parts[#parts + 1] = tostring(ref.port)
          else
            parts[#parts + 1] = ""
          end
          return table.concat(parts, "|")
        end

        local function aggregateKeyed(statusItems, field, refField)
          local function entryWithKey(s, key)
            if s[field] == nil then
              return nil
            end
            for _, e in ipairs(s[field]) do
              if refKey(e[refField], e.controllerName) == key then
                return e
              end
            end
            return nil
          end

          local keys, seen = {}, {}
          for _, it in ipairs(statusItems) do
            if it.status ~= nil and it.status[field] ~= nil then
              for _, e in ipairs(it.status[field]) do
                local key = refKey(e[refField], e.controllerName)
                if not seen[key] then
                  seen[key] = true
                  keys[#keys + 1] = key
                end
              end
            end
          end

          local out = {}
          for _, key in ipairs(keys) do
            local base = firstWith(statusItems, function(s)
              return entryWithKey(s, key)
            end)
            local entry = { controllerName = base.controllerName }
            entry[refField] = base[refField]
            entry.conditions = aggregateConditions(statusItems, function(s)
              local e = entryWithKey(s, key)
              if e == nil then
                return nil
              end
              return e.conditions
            end)
            out[#out + 1] = entry
          end
          return out
        end

        function AggregateStatus(desiredObj, statusItems)
          if statusItems == nil or #statusItems == 0 then
            return desiredObj
          end
          if desiredObj.status == nil then
            desiredObj.status = {}
          end
          local ancestors = aggregateKeyed(statusItems, "ancestors", "ancestorRef")
          if #ancestors > 0 then
            desiredObj.status.ancestors = ancestors
          end
          return desiredObj
        end

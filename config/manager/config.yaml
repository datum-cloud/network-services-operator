apiVersion: apiserver.config.datumapis.com/v1alpha1
kind: NetworkServicesOperator
# Internal DNS is an alpha network integration and remains off until every
# serving cell has matching service attachment configuration.
internalDNS:
  # Enables DNS context and regional access lifecycle management.
  enabled: false
  # Presents the same resolver address inside each consumer VPC.
  # frontend: fd53::53
  # Allocates one stable service destination from this prefix per DNS context.
  # servicePrefix: fd70:100::/64
  # Bounds each DNS authorization; Galactic accepts at most two minutes.
  # accessLeaseDuration: 2m
  # Selects the shared resolver attachments that serve authorized VPCs.
  # producerAttachmentSelector:
  #   service.datum.net/internal-dns: "true"
  # Replaces frontend and producerAttachmentSelector with up to three
  # independent resolvers, each served by its own attachments. Guests receive
  # every frontend as a nameserver, in this order. Keep the existing resolver
  # first, and set the same list on the manager and every cell.
  # resolvers:
  # - frontend: fd53::53
  #   producerAttachmentSelector:
  #     internal-dns.datum.net/tier: node
  # - frontend: fd53::54
  #   producerAttachmentSelector:
  #     internal-dns.datum.net/tier: node-b
gateway:
  targetDomain: example.com
  # enableDNSIntegration controls automatic DNSRecordSet creation for Gateway
  # hostnames whose Domain has VerifiedDNSZone=True. When true, the Gateway
  # controller creates dns.networking.miloapis.com/v1alpha1 DNSRecordSet
  # resources in the same namespace as the upstream Gateway.
  #
  # Requires the dns-operator CRDs (dns.networking.miloapis.com) to be
  # installed in the cluster before this operator starts.
  #
  # Default: false. Set to true in environments where dns-operator is deployed.
  enableDNSIntegration: false
  # dnsAuthorityLossGracePeriod is how long Gateway DNS keeps the record set of a
  # hostname the Gateway still claims after Datum DNS loses authority for its
  # Domain, counted from the first check without authority; then the record set
  # is deleted. Zero deletes at the first check; a negative value is refused.
  #
  # Default: 48h.
  dnsAuthorityLossGracePeriod: 48h
  # preciseEndpointSliceMapping maps EndpointSlice changes to only the Gateways that use them.
  preciseEndpointSliceMapping: false
  # errorPage configures the branded data-plane error page served by the
  # extension server for edge-generated 5xx responses on the downstream /
  # Connector data plane (e.g. an offline Connector tunnel). When enabled, the
  # extension server attaches an Envoy local_reply_config to every customer-
  # facing HCM so visitors see a branded "temporarily unavailable" page instead
  # of a raw body like "no healthy upstream".
  #
  # bodyPath points at the optional ConfigMap mount (volume "error-pages" in
  # config/extension-server/deployment.yaml). When the file is absent or empty,
  # the page compiled into the operator image is used as the fallback — content
  # problems never block xDS or fail startup.
  #
  # offlineBodyPath is the page served when the edge had no healthy upstream to
  # send the request to, which is what a NetworkService with no serving members
  # looks like. Same fallback rules; when neither the file nor the embedded page
  # is usable, those responses get the generic page above.
  errorPage:
    enabled: true
    bodyPath: /etc/datum/error-pages/error-5xx.html
    offlineBodyPath: /etc/datum/error-pages/error-offline.html
    minStatusCode: 500

# ActivityPolicy for ConnectorAdvertisement resources (networking.datumapis.com).
# Defines how ConnectorAdvertisement CRUD operations appear in activity timelines.
#
# ConnectorAdvertisements publish connector endpoints for discovery. They reference
# a connector by name (spec.connectorRef.name) but this is an internal reference,
# not a human-readable label — audit.objectRef.name is used as the display string.
# All rules exclude system users to suppress controller reconciliation noise.
apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  labels:
    meta.datumapis.com/service: network-services
    meta.datumapis.com/team: delivery
  name: networking.datumapis.com-connectoradvertisement
spec:
  resource:
    apiGroup: networking.datumapis.com
    kind: ConnectorAdvertisement

  auditRules:
    # Create rejected because the project reached its quota. Milo's quota
    # admission marks these with the quota.miloapis.com/outcome audit annotation.
    # The resource was never created, so the summary has no link.
    - name: create-quota-denied
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.responseStatus.code) && audit.responseStatus.code == 403 && has(audit.annotations) && 'quota.miloapis.com/outcome' in audit.annotations && audit.annotations['quota.miloapis.com/outcome'] == 'denied' && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} couldn't create {{ has(audit.objectRef.name) && audit.objectRef.name != '' ? 'connector advertisement ' + audit.objectRef.name : 'a connector advertisement' }}: quota reached"

    # ConnectorAdvertisement creation with spec available
    - name: create
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.requestObject.spec) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} created connector advertisement {{ link(audit.responseObject.metadata.name, audit.objectRef) }}"

    # ConnectorAdvertisement creation fallback (no spec)
    - name: create-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} created {{ link('a connector advertisement', audit.objectRef) }}"

    # ConnectorAdvertisement deletion with responseObject.spec available (response contains the deleted resource)
    - name: delete
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete' && has(audit.responseObject.spec) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} deleted connector advertisement {{ audit.objectRef.name }}"

    # ConnectorAdvertisement deletion fallback (no spec on response)
    - name: delete-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete' && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} deleted a connector advertisement"

    # ConnectorAdvertisement update with spec available - excludes status subresource
    - name: update
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && (type(audit.requestObject) == map && has(audit.requestObject.spec)) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} updated connector advertisement {{ link(audit.objectRef.name, audit.objectRef) }}"

    # ConnectorAdvertisement update fallback (no spec)
    - name: update-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} updated {{ link('a connector advertisement', audit.objectRef) }}"

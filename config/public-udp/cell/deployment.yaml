apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-udp-controller
  namespace: network-services-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: public-udp-controller
  template:
    metadata:
      labels:
        app: public-udp-controller
    spec:
      serviceAccountName: public-udp-controller
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/datum-cloud/network-services-operator:REPLACE_WITH_REVIEWED_VERSION
          command: [/public-udp-controller]
          args:
            - --project-kubeconfig=/project/kubeconfig
            - --project=REPLACE_WITH_PROJECT
            - --namespace=default
            - --location=us-east-1
            - --fabric-namespace=galactic-system
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9083
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: project-credentials
              mountPath: /project
              readOnly: true
      volumes:
        - name: project-credentials
          secret:
            secretName: public-udp-project-credentials
            defaultMode: 0440

apiVersion: v1
kind: ServiceAccount
metadata:
  name: public-udp-controller
  namespace: network-services-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: public-udp-controller
rules:
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [networking.datumapis.com]
    resources: [networkinterfaces]
    verbs: [get, list, update]
  - apiGroups: [networking.datumapis.com]
    resources: [networkinterfaceclaims]
    verbs: [get]
  - apiGroups: [galactic.datumapis.com]
    resources: [vpcattachments]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: public-udp-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: public-udp-controller
subjects:
  - kind: ServiceAccount
    name: public-udp-controller
    namespace: network-services-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: public-udp-controller
  namespace: galactic-system
rules:
  - apiGroups: [galactic.datumapis.com]
    resources: [networkservices]
    verbs: [get, create, update, delete]
  - apiGroups: [galactic.datumapis.com]
    resources: [servicevipbindings]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: public-udp-controller
  namespace: galactic-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: public-udp-controller
subjects:
  - kind: ServiceAccount
    name: public-udp-controller
    namespace: network-services-system

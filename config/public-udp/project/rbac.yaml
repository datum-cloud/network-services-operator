apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: public-udp-controller
rules:
  - apiGroups: [networking.datumapis.com]
    resources: [networkservices]
    verbs: [get, list, watch, update]
  - apiGroups: [networking.datumapis.com]
    resources: [networkservices/status]
    verbs: [get, patch]
  - apiGroups: [networking.datumapis.com]
    resources: [networkservices/finalizers]
    verbs: [update]
  - apiGroups: [networking.datumapis.com]
    resources: [networkinterfaces]
    verbs: [list]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: public-udp-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: public-udp-controller
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: REPLACE_WITH_PROJECT_SCOPED_CONTROLLER_IDENTITY

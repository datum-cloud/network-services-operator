apiVersion: quota.miloapis.com/v1alpha1
kind: ResourceRegistration
metadata:
  name: networkloadbalancers-per-project
  labels:
    app.kubernetes.io/name: network-services-operator
    app.kubernetes.io/component: quota-system
    services.miloapis.com/owner: networking.datumapis.com
  annotations:
    kubernetes.io/display-name: "Network Load Balancers"
    kubernetes.io/description: "Maximum number of network load balancers in a project"
spec:
  consumerType:
    apiGroup: resourcemanager.miloapis.com
    kind: Project
  type: Entity
  resourceType: networking.datumapis.com/networkloadbalancers
  description: "Maximum number of network load balancers in a project"
  baseUnit: load balancer
  displayUnit: load balancers
  unitConversionFactor: 1
  claimingResources:
    - apiGroup: networking.datumapis.com
      kind: NetworkLoadBalancer

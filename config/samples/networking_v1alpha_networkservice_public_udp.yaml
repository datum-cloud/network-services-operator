apiVersion: networking.datumapis.com/v1alpha
kind: NetworkService
metadata:
  name: connect-public-masque
  namespace: default
spec:
  publicUDP:
    location: us-east-1
    addressClass: public-ipv4
  networkInterfaces:
    selector:
      matchLabels:
        compute.datumapis.com/workload-name: connect-public-masque
        networking.datumapis.com/location: us-east-1
  ports:
    - name: masque
      protocol: UDP
      port: 443

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nso-controller-health
  namespace: nso-slo
spec:
  groups:
  # Per-controller reconcile-error alerts detect when any controller-runtime
  # reconciler is failing to apply its intent. A high error ratio means writes
  # are being rejected (invalid objects, admission errors, permissions), the
  # controller is hot-looping, and the last successfully written state stays
  # programmed. The `controller` label names the offending reconciler, and
  # `cluster`/`namespace`/`deployment` name where it is running.
  #
  # Each alert selects one series that the next group records, and joins its
  # owner from deployment:datum_service:info, the map the platform publishes:
  # the first arm carries the map's `service` and `team`, the second fires a
  # deployment the map does not name, without them. A pod that no Deployment
  # owns has no `deployment` label, so it takes the second arm. A brief burst, such as an API server roll, stays under the
  # 15-minute minimum and pages nothing; `keep_firing_for` holds an alert
  # through brief dips under the threshold.
  - name: nso-controller-health
    interval: 30s
    rules:
    # Fires when more than 20% of a controller's reconcile attempts fail in
    # every 5-minute slice of 15 minutes, sustained for 15 minutes more.
    - alert: ControllerReconcileErrorRatioHigh
      expr: |
        max without (datum_service) (label_replace(controller_runtime:reconcile_stalled:warning * on (cluster, namespace, deployment) group_left (datum_service, team) deployment:datum_service:info, "service", "$1", "datum_service", "(.*)"))
        or
        (controller_runtime:reconcile_stalled:warning unless on (cluster, namespace, deployment) deployment:datum_service:info)
      for: 15m
      keep_firing_for: 30m
      labels:
        severity: warning
      annotations:
        summary: "Controller {{ $labels.controller }} in {{ $labels.cluster }}/{{ $labels.namespace }}/{{ $labels.deployment }} reconcile error ratio is {{ $value | humanizePercentage }} (threshold 20%)"
        description: "More than 20% of the '{{ $labels.controller }}' controller's reconcile attempts are failing in cluster '{{ $labels.cluster }}', namespace '{{ $labels.namespace }}'. It cannot apply its intent — changes are not reaching their target and the last successfully written state stays programmed. Common causes: an object fails CRD validation, an API server admission error, or a permissions regression. Check controller logs for 'Reconciler error' entries on the '{{ $labels.controller }}' controller."
        runbook_url: "https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/controller-health.md#controllerreconcileerrorratiohigh"

    # Fires at a critical threshold when more than 50% of a controller's
    # reconciles fail in every 5-minute slice of 15 minutes, sustained for 10
    # minutes more. At this rate the controller has effectively stopped
    # applying changes.
    - alert: ControllerReconcileErrorRatioCritical
      expr: |
        max without (datum_service) (label_replace(controller_runtime:reconcile_stalled:critical * on (cluster, namespace, deployment) group_left (datum_service, team) deployment:datum_service:info, "service", "$1", "datum_service", "(.*)"))
        or
        (controller_runtime:reconcile_stalled:critical unless on (cluster, namespace, deployment) deployment:datum_service:info)
      for: 10m
      keep_firing_for: 30m
      labels:
        severity: critical
      annotations:
        summary: "Controller {{ $labels.controller }} in {{ $labels.cluster }}/{{ $labels.namespace }}/{{ $labels.deployment }} reconcile error ratio is {{ $value | humanizePercentage }} (threshold 50%) — reconciliation is stalled"
        description: "More than 50% of the '{{ $labels.controller }}' controller's reconcile attempts are failing in cluster '{{ $labels.cluster }}', namespace '{{ $labels.namespace }}' — it has effectively stopped applying changes. Treat as an active outage for anything this controller programs. Check controller logs for 'Reconciler error' entries. See ControllerReconcileErrorRatioHigh for initial diagnosis."
        runbook_url: "https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/controller-health.md#controllerreconcileerrorratiocritical"

    # Fires when a controller has had reconcile errors in each of the last 24
    # hours. A floor that holds that long is almost always a failure no retry
    # can fix, or a wait, returned as a plain error: the controller retries it
    # for ever. It warns the owning team and never pages; it is how a sparse
    # controller's steady failure is seen.
    - alert: ControllerReconcileErrorFloor
      expr: |
        max without (datum_service) (label_replace(controller_runtime:reconcile_error_floor:24h * on (cluster, namespace, deployment) group_left (datum_service, team) deployment:datum_service:info, "service", "$1", "datum_service", "(.*)"))
        or
        (controller_runtime:reconcile_error_floor:24h unless on (cluster, namespace, deployment) deployment:datum_service:info)
      labels:
        severity: warning
      annotations:
        summary: "Controller {{ $labels.controller }} in {{ $labels.cluster }}/{{ $labels.namespace }}/{{ $labels.deployment }} has had reconcile errors in each of the last 24 hours"
        description: "The '{{ $labels.controller }}' controller in cluster '{{ $labels.cluster }}', namespace '{{ $labels.namespace }}' has returned reconcile errors in every hour for a day. A steady error floor is almost always a failure no retry can fix, or a wait, returned as a plain error. Find the objects in the controller logs and fix the controller or the data; see the runbook."
        runbook_url: "https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/controller-health.md#controllerreconcileerrorfloor"

  # The alerts' conditions. A series is one controller in one deployment:
  # the deployment comes from the pod's name (<deployment>-<hash>-<id>),
  # because two binaries in one namespace can run controllers with the same
  # name. A controller counts as busy when it reconciled in every 5-minute
  # slice of 15 minutes and more than 0.005 times a second over 30 minutes. A
  # sparse controller that fails every reconcile is not busy and pages nothing;
  # ControllerReconcileErrorFloor warns its team once its errors hold for a day.
  - name: nso-controller-health.rules
    interval: 30s
    rules:
    # The lowest 5-minute error ratio over the last 15 minutes, for a busy
    # controller.
    - record: controller_runtime:reconcile_error_ratio:min15m
      expr: |
        min_over_time((
          sum by (cluster, namespace, deployment, controller) (label_replace(rate(controller_runtime_reconcile_total{result="error"}[5m]), "deployment", "$1", "pod", "(.+)-[^-]+-[^-]+$"))
          /
          sum by (cluster, namespace, deployment, controller) (label_replace(rate(controller_runtime_reconcile_total[5m]), "deployment", "$1", "pod", "(.+)-[^-]+-[^-]+$"))
        )[15m:5m])
        and
        count_over_time((sum by (cluster, namespace, deployment, controller) (label_replace(rate(controller_runtime_reconcile_total[5m]), "deployment", "$1", "pod", "(.+)-[^-]+-[^-]+$")) > 0)[15m:5m]) >= 3
        and
        sum by (cluster, namespace, deployment, controller) (label_replace(rate(controller_runtime_reconcile_total[30m]), "deployment", "$1", "pod", "(.+)-[^-]+-[^-]+$")) > 0.005
    - record: controller_runtime:reconcile_stalled:warning
      expr: controller_runtime:reconcile_error_ratio:min15m > 0.2
    - record: controller_runtime:reconcile_stalled:critical
      expr: controller_runtime:reconcile_error_ratio:min15m > 0.5
    # The hours, of the last 24, in which a controller returned any error.
    - record: controller_runtime:reconcile_error_hours:24h
      expr: |
        count_over_time((sum by (cluster, namespace, deployment, controller) (label_replace(increase(controller_runtime_reconcile_total{result="error"}[1h]), "deployment", "$1", "pod", "(.+)-[^-]+-[^-]+$")) > 0)[24h:1h])
    - record: controller_runtime:reconcile_error_floor:24h
      expr: controller_runtime:reconcile_error_hours:24h >= 24

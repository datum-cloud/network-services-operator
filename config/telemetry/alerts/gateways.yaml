apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nso-slo
  namespace: nso-slo
spec:
  groups:
  - name: nso-slo
    interval: 30s
    rules:
    # A Gateway's readiness, one series per Gateway. Each condition is taken once (max by type), however many exporter
    # pods report it, and only a Gateway whose status is reported can fire, so a gap in the metrics fires nothing.
    # These warn the owner.
    - alert: GatewayNotReadySLOViolation
      expr: |
        (
          (
            max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (time() - datum_cloud_networking_gateway_created) > 60
            and on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)
            max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (datum_cloud_networking_gateway_status{type=~"Accepted|Programmed"})
          )
          unless on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)
          (
            sum by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (
              max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name, type) (datum_cloud_networking_gateway_status{type=~"Accepted|Programmed"})
            ) == 2
          )
          unless on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)
          datum_cloud_networking_gateway_deleted
        )
        unless (
          (
            max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (time() - datum_cloud_networking_gateway_created) > 604800
          )
          unless (
            sum by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (
              max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name, type) (
                max_over_time(datum_cloud_networking_gateway_status{type=~"Accepted|Programmed"}[7d])
              )
            ) == 2
          )
        )
      for: 0s
      labels:
        severity: warning
        service: network-services
        team: delivery
        project: "{{ $labels.resourcemanager_datumapis_com_project_name }}"
        subject: "{{ $labels.resourcemanager_datumapis_com_project_name }}/{{ $labels.resource_namespace }}/{{ $labels.resource_name }}"
        subject_kind: Gateway
        subject_name: "{{ $labels.resource_name }}"
        subject_namespace: "{{ $labels.resource_namespace }}"
        subject_group: gateway.networking.k8s.io
      annotations:
        summary: "Gateway {{ $labels.resource_name }} is taking longer than 60 seconds to reach Ready status"
        description: "Gateway {{ $labels.resource_name }} in namespace {{ $labels.resource_namespace }} has been in creation state for {{ $value }} seconds without reaching Ready status (Accepted=True AND Programmed=True), which exceeds the 60-second SLO threshold."
        runbook_url: "https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-readiness.md#gatewaynotreadysloviolation"

    - alert: GatewayDegradedSLOViolation
      expr: |
        (
          (
            max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (
              time() - datum_cloud_networking_gateway_status_condition_last_transition_time{type=~"Accepted|Programmed", status="False"}
            ) > 60
          )
          and on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)
          (
            sum by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (
              max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name, type) (datum_cloud_networking_gateway_status{type=~"Accepted|Programmed"})
            ) < 2
          )
          unless on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)
          datum_cloud_networking_gateway_deleted
        )
        unless (
          (
            max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (time() - datum_cloud_networking_gateway_created) > 604800
          )
          unless (
            sum by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (
              max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name, type) (
                max_over_time(datum_cloud_networking_gateway_status{type=~"Accepted|Programmed"}[7d])
              )
            ) == 2
          )
        )
      for: 0s
      labels:
        severity: warning
        service: network-services
        team: delivery
        project: "{{ $labels.resourcemanager_datumapis_com_project_name }}"
        subject: "{{ $labels.resourcemanager_datumapis_com_project_name }}/{{ $labels.resource_namespace }}/{{ $labels.resource_name }}"
        subject_kind: Gateway
        subject_name: "{{ $labels.resource_name }}"
        subject_namespace: "{{ $labels.resource_namespace }}"
        subject_group: gateway.networking.k8s.io
      annotations:
        summary: "Gateway {{ $labels.resource_name }} has been degraded for over 60 seconds"
        description: "Gateway {{ $labels.resource_name }} in namespace {{ $labels.resource_namespace }} has been in a degraded state for over 60 seconds without recovering, which exceeds the 60-second SLO threshold."
        runbook_url: "https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-readiness.md#gatewaydegradedsloviolation"

    # The platform's part of a Gateway: Accepted, and the default listeners, which serve the Gateway's own hostname with
    # the platform's certificate. A Gateway older than 7 days and not Accepted since more than 7 days ago is
    # GatewayNeverProgrammed's; reading the condition's transition time keeps this rule off a 7-day range.
    - alert: GatewayPlatformPartNotReady
      expr: |
        (
          (
            max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (datum_cloud_networking_gateway_status{type="Accepted"}) == 0
            or
            min by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (
              max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name, listener) (
                datum_cloud_networking_gateway_status_listener_programmed{listener=~"default-https?"}
              )
            ) == 0
          )
          and on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)
          max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (time() - datum_cloud_networking_gateway_created) > 60
        )
        unless on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)
        datum_cloud_networking_gateway_deleted
        unless on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)
        (
          max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (time() - datum_cloud_networking_gateway_created) > 604800
          and on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)
          max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (
            time() - datum_cloud_networking_gateway_status_condition_last_transition_time{type="Accepted", status!="True"}
          ) > 604800
        )
      for: 5m
      labels:
        severity: critical
        service: network-services
        team: delivery
        project: "{{ $labels.resourcemanager_datumapis_com_project_name }}"
        subject: "{{ $labels.resourcemanager_datumapis_com_project_name }}/{{ $labels.resource_namespace }}/{{ $labels.resource_name }}"
        subject_kind: Gateway
        subject_name: "{{ $labels.resource_name }}"
        subject_namespace: "{{ $labels.resource_namespace }}"
        subject_group: gateway.networking.k8s.io
      annotations:
        summary: "Gateway {{ $labels.resource_name }} is not accepted or does not serve its own hostname"
        description: "Gateway {{ $labels.resource_name }} in project {{ $labels.resourcemanager_datumapis_com_project_name }}, namespace {{ $labels.resource_namespace }}, is not Accepted, or a default listener, which serves the Gateway's own hostname with the platform's certificate, is not Programmed."
        impact: "The Gateway does not serve its own hostname."
        runbook_url: "https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-readiness.md#gatewayplatformpartnotready"

    - alert: GatewayNeverProgrammed
      expr: |
        (
          max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (time() - datum_cloud_networking_gateway_created) > 604800
        )
        unless (
          sum by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (
            max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name, type) (
              max_over_time(datum_cloud_networking_gateway_status{type=~"Accepted|Programmed"}[7d])
            )
          ) == 2
        )
      for: 1h
      labels:
        service: network-services
        severity: info
        team: delivery
      annotations:
        description: "Gateway {{ $labels.resource_name }} in namespace {{ $labels.resource_namespace }} was created {{ $value }} seconds ago and has not been both Accepted and Programmed at any point in the last 7 days. It no longer pages, because a 60-second readiness objective cannot be met retroactively, but it is still broken and still counts against the readiness SLO."
        runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/gateway-never-programmed.md"
        summary: "Gateway {{ $labels.resource_name }} has never reached Ready and has stopped paging"

  # TLS certificate health alerts fire on nso_* metrics emitted directly by the
  # NSO operator and extension server. They are available in the same Prometheus
  # that loads this rule, alongside the envoy_gateway_* metrics above.
  # These complement the infrastructure EnvoyListenerUpdateRejected alert (which
  # fires when Envoy rejects a bad LDS update). These alerts cover the earlier
  # prevention path: NSO withholds a listener or the extension server drops a
  # broken filter chain before Envoy has a chance to reject the update.
  - name: nso-tls-cert-health
    interval: 30s
    rules:
    # Fires when NSO has withheld a Gateway listener because its TLS certificate
    # is unusable. The customer's HTTPS hostname is dark until the cert recovers.
    # If EnvoyListenerUpdateRejected is also firing without this alert, NSO's
    # cert gating has regressed and a bad cert reached Envoy directly.
    - alert: GatewayListenerCertUnusable
      expr: |
        nso_gateway_listener_cert_withheld{reason!~"DNSNotPointingToGateway|DNSDelegationMissing"} == 1
      for: 5m
      labels:
        severity: warning
        service: network-services
        team: sre
      annotations:
        summary: "Gateway listener {{ $labels.project }}/{{ $labels.resource_namespace }}/{{ $labels.resource_name }}/{{ $labels.listener }} has an unusable TLS certificate"
        description: "NSO has withheld listener {{ $labels.listener }} (hostname {{ $labels.hostname }}) on Gateway {{ $labels.resource_name }} in project {{ $labels.project }}, namespace {{ $labels.resource_namespace }} because its TLS certificate is unusable (reason: {{ $labels.reason }}). The customer cannot serve HTTPS on this hostname. Check the cert-manager Certificate and Secret in the downstream cluster."
        runbook_url: "https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-tls-certificates.md#gatewaylistenercertunusable"

    # Fires when a managed TLS certificate is within 7 days of expiry while it
    # is still healthy. cert-manager renews automatically, but renewal fails if
    # the domain's DNS no longer points to this gateway. Acting here avoids a future
    # GatewayListenerCertUnusable alert.
    - alert: GatewayListenerCertExpiringSoon
      expr: |
        (nso_gateway_listener_cert_expiry_time - time()) / 86400 < 7
      for: 1h
      labels:
        severity: warning
        service: network-services
        team: sre
      annotations:
        summary: "TLS certificate for Gateway listener {{ $labels.project }}/{{ $labels.resource_namespace }}/{{ $labels.resource_name }}/{{ $labels.listener }} expires in less than 7 days"
        description: "The cert-manager Certificate for listener {{ $labels.listener }} (hostname {{ $labels.hostname }}, secret {{ $labels.secret }}) on Gateway {{ $labels.resource_name }} in project {{ $labels.project }}, namespace {{ $labels.resource_namespace }} expires within 7 days. cert-manager should renew it automatically, but renewal fails if the domain's DNS no longer points to this gateway. Verify the Certificate is Ready=True in the downstream cluster."
        runbook_url: "https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-tls-certificates.md#gatewaylistenercertexpiringsoon"

    # Fires when the extension server is actively dropping broken certificates
    # from the configuration it sends to the edge. This is expected briefly
    # between a certificate failing and the controller withholding the listener.
    # If only this fires and GatewayListenerCertUnusable does not, the controller
    # may have missed the listener.
    - alert: TLSBackstopPruningChains
      expr: |
        nso_extension_tls_pruned_chains_active > 0
      for: 2m
      labels:
        severity: warning
        service: network-services
        team: sre
      annotations:
        summary: "Extension server is dropping {{ $value }} broken certificate(s) to protect the edge listener"
        description: "The extension server is dropping {{ $value }} broken certificate(s) from the configuration it sends to the edge gateway. Check extension server logs for 'pruned invalid TLS chains' to find the affected hostnames. If GatewayListenerCertUnusable is also firing, both layers of protection are working as expected. If only this alert fires, the controller may have missed the listener."
        runbook_url: "https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-tls-certificates.md#tlsbackstoppruningchains"

    # Fires when the extension server could not protect a listener because every
    # certificate on it is broken. It never removes a listener entirely, so the
    # edge will reject the update for that listener — EnvoyListenerUpdateRejected
    # on the edge gateway confirms it. It means the controller did not withhold the listener
    # before it reached the edge.
    - alert: TLSBackstopListenerAllCertsBroken
      expr: |
        nso_extension_tls_listeners_left_intact_active > 0
      for: 2m
      labels:
        severity: critical
        service: network-services
        team: sre
      annotations:
        summary: "{{ $value }} edge listener(s) have every TLS certificate broken and cannot be protected"
        description: "The extension server left {{ $value }} edge listener(s) untouched because every certificate on them is broken. It never removes a listener entirely, so the edge will reject the configuration update for those listeners (EnvoyListenerUpdateRejected confirms it). This means the controller did not withhold the listener before it reached the edge. Check extension server logs for 'listeners_left_intact' and why the controller did not withhold the listener."
        runbook_url: "https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-tls-certificates.md#tlsbackstoplistenerallcertsbroken"

  - name: nso-certificate-service
    interval: 30s
    rules:
    # Fires when a wildcard hostname's certificate cannot be issued or renewed
    # through the certificate service. The hostname may still serve its previous
    # certificate, so this fires weeks before that certificate expires.
    - alert: CertificateServiceIssuanceFailing
      expr: |
        max by (project, resource_namespace, resource_name, listener, reason) (nso_certificate_service_listener_failing) > 0
        or
        sum by (project, resource_namespace, resource_name, listener, reason) (increase(nso_certificate_service_failures_total[1h])) > 0
      for: 2h
      labels:
        severity: warning
        service: network-services
        team: sre
      annotations:
        summary: "Certificate for Gateway listener {{ $labels.project }}/{{ $labels.resource_namespace }}/{{ $labels.resource_name }}/{{ $labels.listener }} cannot be issued or renewed"
        description: "The certificate service has been failing to issue or renew the certificate for listener {{ $labels.listener }} on Gateway {{ $labels.resource_name }} in project {{ $labels.project }}, namespace {{ $labels.resource_namespace }} for over two hours (reason: {{ $labels.reason }}). The listener's CertificateRenewalBlocked or CertificateIssuanceBlocked condition says why."
        runbook_url: "https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-tls-certificates.md#certificateserviceissuancefailing"

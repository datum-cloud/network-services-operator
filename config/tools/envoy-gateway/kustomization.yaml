resources:
  - namespace.yaml
helmCharts:
  - name: gateway-helm
    includeCRDs: true
    namespace: envoy-gateway-system
    releaseName: envoy-gateway
    version: 1.8.6
    repo: oci://docker.io/envoyproxy
    valuesInline:
      config:
        envoyGateway:
          extensionApis:
            enableBackend: true
            enableEnvoyPatchPolicy: false
          runtimeFlags:
            enabled:
              - XDSNameSchemeV2

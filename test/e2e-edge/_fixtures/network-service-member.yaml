# Stand-in for a workload instance answering at a NetworkService member's
# allocated address.
#
# There is no compute in this environment, so nothing listens where IPAM says a
# member lives. This pod closes that gap the same way compute would: the
# scenario binds each programmed member's allocated address on the downstream
# node, and this host-network pod answers on every node address at the port the
# service declares. Requests the edge sends to a member address are therefore
# served by a real server over a real socket.
#
# What it does not reproduce: both members answer from one machine, so the
# locations the endpoints carry are not physically apart.
apiVersion: v1
kind: Pod
metadata:
  name: network-service-member
  namespace: default
  labels:
    purpose: network-service-member
spec:
  hostNetwork: true
  containers:
    - name: backend
      image: ghcr.io/mccutchen/go-httpbin:2.18.1
      command: ["/bin/go-httpbin"]
      args: ["-host", "0.0.0.0", "-port", "8080"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
  terminationGracePeriodSeconds: 0

# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# The edge binds a network-service backend to its private network as soon as
# that network's record arrives, without waiting for an unrelated change.
#
# The edge proxy learns which private network a backend lives in from the
# record Galactic publishes for the backend's address. When the workload runs
# in another location, that record reaches the edge tens of seconds after the
# proxy's route, so the edge first builds the route without the network and
# every request to it fails. Nothing the proxy's own controller watches changes
# when the record lands, so before the fix the route stayed unbound until
# something unrelated rebuilt the edge.
#
# The scenario holds the record back on purpose and then delivers it with
# nothing else changed, twice:
#
#   * A new proxy: built before the record exists, it must pick up the network
#     within a short deadline of the record arriving.
#   * An upgrade: the backend is replaced by one at a new address, the edge
#     drops the binding because the new address has no record yet, and it must
#     pick the binding back up once the new record arrives.
#
# What this environment does and does not stand behind:
#
#   * The record is written by the scenario in the shape Galactic publishes
#     before a node has a locator: the tenant label and annotation, no SRv6
#     segment. The edge's VRF sidecar ignores such a record, so no private
#     network exists here and the scenario reads the proxy's configuration
#     rather than sending traffic. Traffic to a bound backend is the staging
#     test's job.
#
#   * The test namespace carries the routing labels address allocation reads,
#     and the replicator treats a namespace carrying them as one it already
#     mapped, so it does not copy the proxy to the edge. The scenario writes
#     the edge copy itself, as the replicator would: the same spec, in the
#     proxy's edge namespace.
#
#   * The suite runs one scenario at a time, so nothing else rebuilds the edge
#     while the deadline runs. Without the fix the binding never appears.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: networkservice-late-vpc-record
spec:
  concurrent: false
  cluster: nso-upstream
  namespaceTemplate:
    metadata:
      labels:
        meta.datumapis.com/upstream-cluster-name: cluster-project-alpha
        meta.datumapis.com/upstream-namespace: default
  bindings:
    - name: downstreamGatewayClass
      value: datum-downstream-gateway-e2e
    - name: envoyNamespace
      value: datum-downstream-gateway
    - name: adminPort
      value: "19000"
    - name: tenantID
      value: e2elate-a1
    - name: vrfDevice
      value: G00e2elateV
    - name: bindDeadlineSeconds
      value: "45"
  steps:
    - name: Deliver the network's presence to this location
      try:
        - apply:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkContext
              metadata:
                name: nsvc-late-net-us-central-1
              spec:
                network:
                  name: nsvc-late-net
                location:
                  name: us-central-1
                ipFamilies:
                  - IPv4
                mtu: 1440
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Network
              metadata:
                name: nsvc-late-net
              spec:
                ipam:
                  mode: Auto
                ipFamilies:
                  - IPv6

    - name: One backend binds and reports itself available
      try:
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkInterfaceClaim
              metadata:
                name: nsvc-late-a
                labels:
                  compute.datumapis.com/workload-name: nsvc-late
              spec:
                network:
                  name: nsvc-late-net
                ipFamilies:
                  - IPv4
        - script:
            timeout: 300s
            content: |
              set -eu
              kubectl -n "$NAMESPACE" wait networkinterfaceclaim nsvc-late-a --for=condition=Bound --timeout=150s
              kubectl -n "$NAMESPACE" wait networkinterfaceclaim nsvc-late-a --for=condition=Allocated --timeout=150s
              kubectl -n "$NAMESPACE" patch networkinterface nsvc-late-a \
                --subresource=status --type=merge -p \
                '{"status":{"conditions":[{"type":"HolderAvailable","status":"True","reason":"HolderAvailable","message":"Reported by the scenario in place of a workload instance","lastTransitionTime":"2026-01-01T00:00:00Z"}]}}'
      catch:
        - script:
            content: kubectl -n $NAMESPACE get networkinterfaceclaim,networkinterface -o yaml

    - name: A proxy in front of the service is built without the network
      description: |
        The control: with no record for the backend's address, the edge must
        carry the backend and no binding. A binding here would mean the record
        was not held back and the steps after this prove nothing.
      try:
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkService
              metadata:
                name: nsvc-late
              spec:
                networkInterfaces:
                  selector:
                    matchLabels:
                      compute.datumapis.com/workload-name: nsvc-late
                ports:
                  - name: http
                    port: 8080
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: HTTPProxy
              metadata:
                name: nsvc-late-proxy
              spec:
                rules:
                  - backends:
                      - networkService:
                          name: nsvc-late
                          port: http
        - script:
            skipCommandOutput: true
            skipLogOutput: true
            content: |
              kubectl get ns $NAMESPACE -o json
            outputs:
              - name: downstreamNamespace
                value: (join('-', ['ns', json_parse($stdout).metadata.uid]))
        - script:
            cluster: nso-downstream
            timeout: 120s
            env:
              - name: DOWNSTREAM_NS
                value: ($downstreamNamespace)
            content: |
              set -eu
              for i in $(seq 1 24); do
                kubectl get ns "$DOWNSTREAM_NS" >/dev/null 2>&1 && break
                sleep 5
              done
              kubectl apply -f - <<EOF
              apiVersion: networking.datumapis.com/v1alpha
              kind: HTTPProxy
              metadata:
                name: nsvc-late-proxy
                namespace: ${DOWNSTREAM_NS}
                labels:
                  meta.datumapis.com/upstream-cluster-name: cluster-single
              spec:
                rules:
                  - backends:
                      - networkService:
                          name: nsvc-late
                          port: http
              EOF
        - script:
            skipCommandOutput: true
            skipLogOutput: true
            content: |
              kubectl -n "$NAMESPACE" get networkinterfaceclaim nsvc-late-a \
                -o jsonpath='{.status.addresses[0].address}' | cut -d/ -f1
            outputs:
              - name: addressA
                value: ($stdout)
        - script:
            cluster: nso-downstream
            timeout: 330s
            env:
              - name: ENVOY_NS
                value: ($envoyNamespace)
              - name: OWNING_GC
                value: ($downstreamGatewayClass)
              - name: ADMIN_PORT
                value: ($adminPort)
              - name: ADDRESS
                value: ($addressA)
            content: |
              set -eu
              ROOT="$(git rev-parse --show-toplevel)"
              . "${ROOT}/test/e2e-edge/_steps/envoy-admin.sh"
              . "${ROOT}/test/e2e-edge/_steps/vpc-bind.sh"
              vpc_bind_wait "$ENVOY_NS" "gateway.envoyproxy.io/owning-gatewayclass=${OWNING_GC}" \
                "$ADMIN_PORT" /nsvc-late-proxy/ "$ADDRESS" none 300
      catch:
        - script:
            content: |
              kubectl -n $NAMESPACE get networkservice,httpproxy,httproute,endpointslice -o yaml
              kubectl -n network-services-operator-system logs -l app.kubernetes.io/name=network-services-operator --tail=150
      cleanup:
        - script:
            cluster: nso-downstream
            content: |
              kubectl delete httpproxy -A --field-selector metadata.name=nsvc-late-proxy --ignore-not-found || true

    - name: The record arrives and the edge binds the new proxy
      description: |
        The verdict for a new proxy. Only the record is added, and the edge must
        bind the backend to its network within the deadline.
      try:
        - script:
            skipCommandOutput: true
            skipLogOutput: true
            content: |
              kubectl get ns $NAMESPACE -o json
            outputs:
              - name: downstreamNamespace
                value: (join('-', ['ns', json_parse($stdout).metadata.uid]))
        - script:
            skipCommandOutput: true
            skipLogOutput: true
            content: |
              kubectl -n "$NAMESPACE" get networkinterfaceclaim nsvc-late-a \
                -o jsonpath='{.status.addresses[0].address}' | cut -d/ -f1
            outputs:
              - name: addressA
                value: ($stdout)
        - script:
            cluster: nso-downstream
            timeout: 120s
            env:
              - name: DOWNSTREAM_NS
                value: ($downstreamNamespace)
              - name: TENANT
                value: ($tenantID)
              - name: ADDRESS
                value: ($addressA)
              - name: ENVOY_NS
                value: ($envoyNamespace)
              - name: OWNING_GC
                value: ($downstreamGatewayClass)
              - name: ADMIN_PORT
                value: ($adminPort)
              - name: DEVICE
                value: ($vrfDevice)
              - name: DEADLINE
                value: ($bindDeadlineSeconds)
            content: |
              set -eu
              ROOT="$(git rev-parse --show-toplevel)"
              . "${ROOT}/test/e2e-edge/_steps/envoy-admin.sh"
              . "${ROOT}/test/e2e-edge/_steps/vpc-bind.sh"
              kubectl apply -f - <<EOF
              apiVersion: discovery.k8s.io/v1
              kind: EndpointSlice
              metadata:
                name: vpc-us-central-1-nsvc-late-a
                namespace: ${DOWNSTREAM_NS}
                labels:
                  galactic.datum.net/tenant-id: ${TENANT}
                annotations:
                  galactic.datum.net/tenant-id: ${TENANT}
              addressType: IPv4
              endpoints:
                - addresses:
                    - ${ADDRESS}
              EOF
              vpc_bind_wait "$ENVOY_NS" "gateway.envoyproxy.io/owning-gatewayclass=${OWNING_GC}" \
                "$ADMIN_PORT" /nsvc-late-proxy/ "$ADDRESS" "$DEVICE" "$DEADLINE"
      catch:
        - script:
            cluster: nso-downstream
            content: |
              kubectl get endpointslice -A --show-labels
              kubectl get endpointslice -A -l galactic.datum.net/tenant-id -o yaml
              kubectl get httpproxy -A -o yaml
              kubectl get gateway -A -o yaml
              kubectl -n network-services-operator-system logs -l app.kubernetes.io/component=envoy-gateway-extension-server \
                --prefix --tail=-1 --max-log-requests=10 | grep -v PostTranslateModify | tail -200 || true
      cleanup:
        - script:
            cluster: nso-downstream
            content: |
              kubectl delete endpointslice -A -l galactic.datum.net/tenant-id=e2elate-a1 --ignore-not-found || true

    - name: An upgrade moves the backend to a new address with no record yet
      description: |
        The replacement backend binds before the old one leaves, so the two can
        never share an address. Once only the new address remains, the edge has
        no record for it and must drop the binding: the state an upgraded
        workload in another location starts in.
      try:
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkInterfaceClaim
              metadata:
                name: nsvc-late-b
                labels:
                  compute.datumapis.com/workload-name: nsvc-late
              spec:
                network:
                  name: nsvc-late-net
                ipFamilies:
                  - IPv4
        - script:
            timeout: 300s
            content: |
              set -eu
              kubectl -n "$NAMESPACE" wait networkinterfaceclaim nsvc-late-b --for=condition=Bound --timeout=150s
              kubectl -n "$NAMESPACE" wait networkinterfaceclaim nsvc-late-b --for=condition=Allocated --timeout=150s
              kubectl -n "$NAMESPACE" patch networkinterface nsvc-late-b \
                --subresource=status --type=merge -p \
                '{"status":{"conditions":[{"type":"HolderAvailable","status":"True","reason":"HolderAvailable","message":"Reported by the scenario in place of a workload instance","lastTransitionTime":"2026-01-01T00:00:00Z"}]}}'
              kubectl -n "$NAMESPACE" delete networkinterfaceclaim nsvc-late-a --wait --timeout=120s
        - script:
            skipCommandOutput: true
            skipLogOutput: true
            content: |
              kubectl -n "$NAMESPACE" get networkinterfaceclaim nsvc-late-b \
                -o jsonpath='{.status.addresses[0].address}' | cut -d/ -f1
            outputs:
              - name: addressB
                value: ($stdout)
        - script:
            cluster: nso-downstream
            timeout: 330s
            env:
              - name: ENVOY_NS
                value: ($envoyNamespace)
              - name: OWNING_GC
                value: ($downstreamGatewayClass)
              - name: ADMIN_PORT
                value: ($adminPort)
              - name: ADDRESS
                value: ($addressB)
            content: |
              set -eu
              ROOT="$(git rev-parse --show-toplevel)"
              . "${ROOT}/test/e2e-edge/_steps/envoy-admin.sh"
              . "${ROOT}/test/e2e-edge/_steps/vpc-bind.sh"
              vpc_bind_wait "$ENVOY_NS" "gateway.envoyproxy.io/owning-gatewayclass=${OWNING_GC}" \
                "$ADMIN_PORT" /nsvc-late-proxy/ "$ADDRESS" none 300
      catch:
        - script:
            content: |
              kubectl -n $NAMESPACE get networkinterfaceclaim,networkinterface,networkservice,endpointslice -o yaml

    - name: The new record arrives and the edge binds the upgraded backend
      description: |
        The verdict for an upgrade. Galactic publishes a record for the new
        address and withdraws the old one; nothing else changes, and the edge
        must bind the backend again within the deadline.
      try:
        - script:
            skipCommandOutput: true
            skipLogOutput: true
            content: |
              kubectl get ns $NAMESPACE -o json
            outputs:
              - name: downstreamNamespace
                value: (join('-', ['ns', json_parse($stdout).metadata.uid]))
        - script:
            skipCommandOutput: true
            skipLogOutput: true
            content: |
              kubectl -n "$NAMESPACE" get networkinterfaceclaim nsvc-late-b \
                -o jsonpath='{.status.addresses[0].address}' | cut -d/ -f1
            outputs:
              - name: addressB
                value: ($stdout)
        - script:
            cluster: nso-downstream
            timeout: 120s
            env:
              - name: DOWNSTREAM_NS
                value: ($downstreamNamespace)
              - name: TENANT
                value: ($tenantID)
              - name: ADDRESS
                value: ($addressB)
              - name: ENVOY_NS
                value: ($envoyNamespace)
              - name: OWNING_GC
                value: ($downstreamGatewayClass)
              - name: ADMIN_PORT
                value: ($adminPort)
              - name: DEVICE
                value: ($vrfDevice)
              - name: DEADLINE
                value: ($bindDeadlineSeconds)
            content: |
              set -eu
              ROOT="$(git rev-parse --show-toplevel)"
              . "${ROOT}/test/e2e-edge/_steps/envoy-admin.sh"
              . "${ROOT}/test/e2e-edge/_steps/vpc-bind.sh"
              kubectl apply -f - <<EOF
              apiVersion: discovery.k8s.io/v1
              kind: EndpointSlice
              metadata:
                name: vpc-us-central-1-nsvc-late-b
                namespace: ${DOWNSTREAM_NS}
                labels:
                  galactic.datum.net/tenant-id: ${TENANT}
                annotations:
                  galactic.datum.net/tenant-id: ${TENANT}
              addressType: IPv4
              endpoints:
                - addresses:
                    - ${ADDRESS}
              EOF
              kubectl -n "$DOWNSTREAM_NS" delete endpointslice vpc-us-central-1-nsvc-late-a --ignore-not-found
              vpc_bind_wait "$ENVOY_NS" "gateway.envoyproxy.io/owning-gatewayclass=${OWNING_GC}" \
                "$ADMIN_PORT" /nsvc-late-proxy/ "$ADDRESS" "$DEVICE" "$DEADLINE"
      catch:
        - script:
            cluster: nso-downstream
            content: |
              kubectl get endpointslice -A -l galactic.datum.net/tenant-id -o yaml
              kubectl -n network-services-operator-system logs -l app.kubernetes.io/component=envoy-gateway-extension-server --tail=150 || true
      cleanup:
        - script:
            cluster: nso-downstream
            content: |
              kubectl delete endpointslice -A -l galactic.datum.net/tenant-id=e2elate-a1 --ignore-not-found || true

# Ranges are registered in ../RANGES.md. Root pools of one project may not
# overlap.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: datum-network-v6-root
  labels:
    nso-fixture: "true"
spec:
  cidr: 2001:db8:a000::/36
  ipFamily: IPv6
  visibility: consumer
  classNames:
    - datum-network-v6
  allocation:
    minPrefixLength: 48
    maxPrefixLength: 48
    strategy: FirstFit
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: datum-endpoint-v4-root
  labels:
    nso-fixture: "true"
spec:
  cidr: 10.128.0.0/16
  ipFamily: IPv4
  visibility: consumer
  classNames:
    - datum-endpoint-v4
  allocation:
    minPrefixLength: 32
    maxPrefixLength: 32
    strategy: FirstFit
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: datum-public-v4-root
  labels:
    nso-fixture: "true"
spec:
  cidr: 198.51.100.0/24
  ipFamily: IPv4
  visibility: consumer
  classNames:
    - datum-public-v4
  allocation:
    minPrefixLength: 32
    maxPrefixLength: 32
    strategy: FirstFit
---
# NEVER ROUTED. This pool is identifier space, not address space: a /64 out of
# it is a network's identity on the SRv6 fabric and nothing answers at it.
# Advertising it, or drawing tenant addresses from it, is a mistake in both
# directions.
#
# visibility is platform because a consumer neither requests nor sees an
# identity.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: datum-vpc-identity-root
  labels:
    nso-fixture: "true"
spec:
  cidr: fd00:a::/32
  ipFamily: IPv6
  visibility: platform
  classNames:
    - datum-vpc-identity
  allocation:
    minPrefixLength: 64
    maxPrefixLength: 64
    strategy: FirstFit

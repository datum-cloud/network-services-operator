# Ranges are registered in ../RANGES.md. Root pools of one project may not
# overlap.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: datum-network-v6-root
  labels:
    nso-fixture: "true"
spec:
  cidr: fd20:2000::/36
  ipFamily: IPv6
  visibility: consumer
  classNames:
    - datum-network-v6
  allocation:
    minPrefixLength: 48
    maxPrefixLength: 48
    strategy: FirstFit
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: datum-endpoint-v4-root
  labels:
    nso-fixture: "true"
spec:
  cidr: 10.129.0.0/16
  ipFamily: IPv4
  visibility: consumer
  classNames:
    - datum-endpoint-v4
  allocation:
    minPrefixLength: 32
    maxPrefixLength: 32
    strategy: FirstFit
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: datum-public-v4-root
  labels:
    nso-fixture: "true"
spec:
  cidr: 203.0.113.0/24
  ipFamily: IPv4
  visibility: consumer
  classNames:
    - datum-public-v4
  allocation:
    minPrefixLength: 32
    maxPrefixLength: 32
    strategy: FirstFit

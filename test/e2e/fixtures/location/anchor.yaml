# A permanent Location. The publisher refuses to prune while the source list is
# empty, so keep at least one Location in the cluster. Do not delete this.
apiVersion: networking.datumapis.com/v1alpha
kind: Location
metadata:
  name: e2e-anchor
spec:
  locationClassName: self-managed
  topology:
    topology.datum.net/city-code: IAD
    topology.datum.net/region: us-east-1
  provider:
    gcp:
      projectId: e2e
      region: us-east1
      zone: us-east1-a

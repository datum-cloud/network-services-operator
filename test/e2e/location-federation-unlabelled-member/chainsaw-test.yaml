# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# No cell claims this location, so the copy is published and lands nowhere. The
# hub holds a binding for it that names zero clusters.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: location-federation-unlabelled-member
spec:
  concurrent: false
  cluster: nso-standard
  steps:
    - name: No cell carries a location label
      try:
        - script:
            cluster: nso-hub
            content: |
              set -eu
              kubectl label cluster nso-downstream topology.datum.net/location- --overwrite || true

    - name: A Location nothing claims is still published
      try:
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Location
              metadata:
                name: e2e-nolabel
              spec:
                locationClassName: self-managed
                topology:
                  topology.datum.net/city-code: FRA
                provider:
                  gcp:
                    projectId: e2e
                    region: europe-west3
                    zone: europe-west3-a
        - assert:
            timeout: 120s
            cluster: nso-hub
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: ServingLocation
              metadata:
                name: e2e-nolabel
        - assert:
            timeout: 60s
            cluster: nso-hub
            resource:
              apiVersion: policy.karmada.io/v1alpha1
              kind: ClusterPropagationPolicy
              metadata:
                name: location-e2e-nolabel

    - name: The hub records the placement as resolving to zero clusters
      try:
        - script:
            cluster: nso-hub
            content: |
              set -eu
              # Karmada names a cluster-scoped binding <name>-<lowercase kind>.
              binding=e2e-nolabel-servinglocation
              for i in $(seq 1 60); do
                kubectl get clusterresourcebinding "$binding" >/dev/null 2>&1 && break
                sleep 2
              done
              kubectl get clusterresourcebinding "$binding" -o yaml

              clusters=$(kubectl get clusterresourcebinding "$binding" -o jsonpath='{.spec.clusters}')
              [ -z "$clusters" ] || { echo "expected the binding to name no clusters, got ${clusters}"; exit 1; }

              scheduled=$(kubectl get clusterresourcebinding "$binding" \
                -o jsonpath='{.status.conditions[?(@.type=="Scheduled")].status}')
              echo "Scheduled=${scheduled}"
              [ "$scheduled" != "True" ] || { echo "the binding claims to be scheduled while naming no clusters"; exit 1; }
            timeout: 180s

    - name: Nothing lands on the member
      try:
        - script:
            cluster: nso-infra
            content: |
              set -eu
              if kubectl get servinglocation e2e-nolabel >/dev/null 2>&1; then
                echo "an unlabelled member received a location it does not claim"
                exit 1
              fi

      finally:
        - script:
            cluster: nso-hub
            content: |
              kubectl label cluster nso-downstream topology.datum.net/location=e2e-cleanup --overwrite || true
        - delete:
            ref:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Location
              name: e2e-nolabel
        - script:
            cluster: nso-hub
            content: |
              set -eu
              for i in $(seq 1 60); do
                kubectl get servinglocation e2e-nolabel >/dev/null 2>&1 || exit 0
                sleep 2
              done
              kubectl delete servinglocation e2e-nolabel --ignore-not-found
              kubectl delete clusterpropagationpolicy location-e2e-nolabel --ignore-not-found

# TEST SCAFFOLDING — the e2e stand-in for Milo's project control-plane front
# door. See test/e2e/milo-shim/main.go for what it does and does not reproduce.
# Deployed only by test-infra:milo-shim-deploy; referenced by no production
# overlay.
apiVersion: v1
kind: Namespace
metadata:
  name: milo-shim-e2e
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: milo-shim
  namespace: milo-shim-e2e
---
# The shim resolves the project itself and then asserts it, so it is the only
# thing in the environment that needs to impersonate. The operator's own
# ServiceAccount deliberately holds no impersonation grant: proving it does not
# need one is the point of addressing projects by path.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: milo-shim-impersonator
rules:
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
    resourceNames: ["nso-ipam-agent"]
  - apiGroups: ["authentication.k8s.io"]
    resources:
      - "userextras/iam.miloapis.com/parent-name"
      - "userextras/iam.miloapis.com/parent-type"
      - "userextras/iam.miloapis.com/parent-api-group"
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: milo-shim-impersonator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: milo-shim-impersonator
subjects:
  - kind: ServiceAccount
    name: milo-shim
    namespace: milo-shim-e2e
---
# TokenReview, so a caller must present a credential the cluster recognises
# before the shim will assert a tenant on its behalf.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: milo-shim-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: milo-shim
    namespace: milo-shim-e2e
---
apiVersion: v1
kind: Service
metadata:
  name: milo-shim
  namespace: milo-shim-e2e
spec:
  selector:
    app.kubernetes.io/name: milo-shim
  ports:
    - port: 443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milo-shim
  namespace: milo-shim-e2e
  labels:
    app.kubernetes.io/name: milo-shim
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: milo-shim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: milo-shim
    spec:
      serviceAccountName: milo-shim
      containers:
        - name: milo-shim
          image: milo-shim:e2e
          # Side-loaded into the kind node by test-infra:milo-shim-image; there
          # is no registry to pull it from.
          imagePullPolicy: Never
          ports:
            - containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
      volumes:
        # Self-signed by test-infra:milo-shim-certs, which also publishes the
        # certificate as the CA in the operator's IPAM kubeconfig. cert-manager
        # is not used: it is not serving yet at the point in the bring-up where
        # that kubeconfig has to exist.
        - name: tls
          secret:
            secretName: milo-shim-serving

# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# Networks are IPv6-only, so a network that carries IPv4, alone or alongside
# IPv6, is refused at admission, and so is a change that adds IPv4.
#
# The refusal lives in an admission webhook rather than in the CRD schema. A
# schema rule would run on every write, including status writes and finalizer
# removal, and would therefore wedge the networks that predate it. That is only
# provable against a deployed webhook, which is what this scenario is for: unit
# tests exercise the rule, and this exercises the wiring.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: network-ipv4-refused
spec:
  cluster: nso-standard
  steps:
    - name: An IPv4-only network is refused at admission
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Network
              metadata:
                name: ipv4-refused
                namespace: default
              spec:
                ipam:
                  mode: Auto
                ipFamilies:
                  - IPv4
        - script:
            content: |
              set -eu
              if kubectl -n default get network ipv4-refused >/dev/null 2>&1; then
                echo "the refused network was created anyway"
                exit 1
              fi

    - name: A dual-stack network is refused at admission
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Network
              metadata:
                name: ipv4-refused-dual
                namespace: default
              spec:
                ipam:
                  mode: Auto
                ipFamilies:
                  - IPv6
                  - IPv4
        - script:
            content: |
              set -eu
              if kubectl -n default get network ipv4-refused-dual >/dev/null 2>&1; then
                echo "the refused network was created anyway"
                exit 1
              fi

    - name: An IPv6 network is admitted
      try:
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Network
              metadata:
                name: ipv4-refused-v6
                namespace: default
              spec:
                ipam:
                  mode: Auto
                ipFamilies:
                  - IPv6

    - name: IPv4 may not be added to a network
      try:
        - patch:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Network
              metadata:
                name: ipv4-refused-v6
                namespace: default
              spec:
                ipFamilies:
                  - IPv6
                  - IPv4
        - patch:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Network
              metadata:
                name: ipv4-refused-v6
                namespace: default
              spec:
                ipFamilies:
                  - IPv4
        - assert:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Network
              metadata:
                name: ipv4-refused-v6
                namespace: default
              spec:
                ipFamilies:
                  - IPv6

    - name: Remove the network
      try:
        - delete:
            timeout: 120s
            ref:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Network
              name: ipv4-refused-v6
              namespace: default

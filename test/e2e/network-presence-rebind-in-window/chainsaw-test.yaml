# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: network-presence-rebind-in-window
spec:
  cluster: nso-standard
  # The hold is a finalizer this scenario adds by hand. A failure between adding
  # it and releasing it would leave the namespace terminating forever, taking the
  # next run of this scenario with it.
  catch:
    - script:
        content: |
          kubectl -n presence-rebind-project patch networkcontext \
            presence-rebind-net-presence-rebind-loc --type=merge \
            -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
  steps:
    - name: Seed the project and the hub namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: presence-rebind-project
                labels:
                  meta.datumapis.com/upstream-cluster-name: cluster-project-alpha
                  meta.datumapis.com/upstream-namespace: default
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: presence-rebind-hub
                labels:
                  meta.datumapis.com/upstream-cluster-name: cluster-single
                  meta.datumapis.com/upstream-namespace: presence-rebind-project
        - apply:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: LocationBinding
              metadata:
                name: presence-rebind-loc
              spec:
                locationRef:
                  name: presence-rebind-loc
                locationClassName: datum-managed
        - apply:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Network
              metadata:
                name: presence-rebind-net
                namespace: presence-rebind-project
              spec:
                ipam:
                  mode: Auto
                ipFamilies:
                  - IPv6

    - name: Make the network present in the location
      try:
        - apply:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkBinding
              metadata:
                name: presence-rebind-consumer
                namespace: presence-rebind-hub
                labels:
                  networking.datumapis.com/network: presence-rebind-net
                  networking.datumapis.com/location: presence-rebind-loc
              spec:
                network:
                  name: presence-rebind-net
                location:
                  name: presence-rebind-loc
                consumer:
                  apiGroup: networking.datumapis.com
                  kind: LoadBalancer
                  name: presence-rebind-consumer
        - assert:
            timeout: 2m
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkContext
              metadata:
                name: presence-rebind-net-presence-rebind-loc
                namespace: presence-rebind-project
              status:
                conditions:
                  - type: Ready
                    status: "True"
        - assert:
            timeout: 2m
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkBinding
              metadata:
                name: presence-rebind-consumer
                namespace: presence-rebind-hub
              status:
                conditions:
                  - type: Ready
                    status: "True"

    - name: Hold the presence in Terminating
      description: |
        A real context is held by the finalizers that give this location's
        address space back, which can take around a minute. A finalizer added
        here holds it for as long as the scenario needs rather than racing them.
      try:
        - script:
            content: |
              set -eu
              kubectl -n presence-rebind-project patch networkcontext \
                presence-rebind-net-presence-rebind-loc --type=merge \
                -p '{"metadata":{"finalizers":["test.datumapis.com/hold"]}}'
              echo "held"

    - name: The consumer goes away and takes the presence with it
      try:
        - delete:
            ref:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkBinding
              name: presence-rebind-consumer
              namespace: presence-rebind-hub
        - script:
            timeout: 2m
            content: |
              set -eu
              for _ in $(seq 1 60); do
                if [ -n "$(kubectl -n presence-rebind-project get networkcontext \
                  presence-rebind-net-presence-rebind-loc \
                  -o jsonpath='{.metadata.deletionTimestamp}')" ]; then
                  # Recorded now rather than before the delete: setting a
                  # deletion timestamp bumps the generation on its own.
                  kubectl -n presence-rebind-project get networkcontext \
                    presence-rebind-net-presence-rebind-loc \
                    -o jsonpath='{.metadata.uid} {.metadata.generation}' \
                    > /tmp/presence-rebind-held
                  echo "the presence is terminating: $(cat /tmp/presence-rebind-held)"
                  exit 0
                fi
                sleep 2
              done
              echo "the presence was never deleted" >&2
              kubectl -n presence-rebind-project get networkcontext -o yaml >&2
              exit 1

    - name: A consumer arrives again while the presence is still going
      description: |
        This is a workload being replaced. The dying context must not be adopted:
        it never comes back, so a binding bound to it stays not-ready for as long
        as it exists.
      try:
        - apply:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkBinding
              metadata:
                name: presence-rebind-replacement
                namespace: presence-rebind-hub
                labels:
                  networking.datumapis.com/network: presence-rebind-net
                  networking.datumapis.com/location: presence-rebind-loc
              spec:
                network:
                  name: presence-rebind-net
                location:
                  name: presence-rebind-loc
                consumer:
                  apiGroup: networking.datumapis.com
                  kind: LoadBalancer
                  name: presence-rebind-replacement
        - assert:
            timeout: 2m
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkBinding
              metadata:
                name: presence-rebind-replacement
                namespace: presence-rebind-hub
              status:
                conditions:
                  - type: Ready
                    status: "False"
                    reason: NetworkContextTerminating
        - script:
            content: |
              set -eu
              held=$(cat /tmp/presence-rebind-held)
              now=$(kubectl -n presence-rebind-project get networkcontext \
                presence-rebind-net-presence-rebind-loc \
                -o jsonpath='{.metadata.uid} {.metadata.generation}')
              if [ "$held" != "$now" ]; then
                echo "the terminating context was adopted or replaced: $held -> $now" >&2
                kubectl -n presence-rebind-project get networkcontext \
                  presence-rebind-net-presence-rebind-loc -o yaml >&2
                exit 1
              fi
              echo "the terminating context was left alone"

    - name: The presence finishes going and a fresh one takes its place
      description: |
        Recovery is the point. The binding is served by a new object, not by the
        one that was being deleted.
      try:
        - script:
            content: |
              set -eu
              kubectl -n presence-rebind-project patch networkcontext \
                presence-rebind-net-presence-rebind-loc --type=merge \
                -p '{"metadata":{"finalizers":[]}}'
        - assert:
            timeout: 45s
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkBinding
              metadata:
                name: presence-rebind-replacement
                namespace: presence-rebind-hub
              status:
                conditions:
                  - type: Ready
                    status: "True"
        - script:
            content: |
              set -eu
              held=$(cut -d' ' -f1 /tmp/presence-rebind-held)
              now=$(kubectl -n presence-rebind-project get networkcontext \
                presence-rebind-net-presence-rebind-loc -o jsonpath='{.metadata.uid}')
              if [ "$held" = "$now" ]; then
                echo "the binding is still served by the context that was deleted" >&2
                exit 1
              fi
              deleting=$(kubectl -n presence-rebind-project get networkcontext \
                presence-rebind-net-presence-rebind-loc \
                -o jsonpath='{.metadata.deletionTimestamp}')
              if [ -n "$deleting" ]; then
                echo "the fresh presence is already terminating" >&2
                exit 1
              fi
              echo "a fresh presence serves the replacement"

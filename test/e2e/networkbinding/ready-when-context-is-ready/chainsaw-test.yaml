# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ready-when-context-is-ready
spec:
  cluster: nso-standard
  steps:
    - name: Create Network
      try:
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Network
              metadata:
                name: test-binding-network
                namespace: default
              spec:
                ipam:
                  mode: Auto

    - name: Create NetworkBinding
      try:
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkBinding
              metadata:
                name: test-binding
                namespace: default
              spec:
                network:
                  name: test-binding-network
                location:
                  name: some-location
        - assert:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkContext
              metadata:
                name: test-binding-network-some-location
                namespace: default
                (creationTimestamp != nil): true

    - name: Assert NetworkBinding is Ready
      description: |
        This network needs no address space of its own, so its context is ready
        as soon as it exists and the binding never passes through
        NetworkContextNotReady. Covering that intermediate state needs a context
        that waits on an address allocation, which needs an IPAM pool for this
        project.
      try:
        - assert:
            timeout: 1m
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkBinding
              metadata:
                name: test-binding
                namespace: default
              status:
                networkContextRef:
                  namespace: default
                  name: test-binding-network-some-location
                (length(conditions[?type == 'Ready' && status == 'True' && reason == 'NetworkContextReady']) == `1`): true

# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ready-when-context-is-ready
spec:
  cluster: nso-standard
  steps:
    - name: Create Network
      try:
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Network
              metadata:
                name: test-binding-network
                namespace: ipam-e2e-alpha
              spec:
                ipam:
                  mode: Auto

    - name: Create NetworkBinding
      try:
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkBinding
              metadata:
                name: test-binding
                namespace: ipam-e2e-alpha
              spec:
                network:
                  name: test-binding-network
                location:
                  name: some-location
        - assert:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkContext
              metadata:
                name: test-binding-network-some-location
                namespace: ipam-e2e-alpha
                (creationTimestamp != nil): true

    - name: Assert NetworkBinding is Ready
      description: |
        The binding becomes ready after its context receives a subnet from the project's address pool.
      try:
        - assert:
            timeout: 1m
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkBinding
              metadata:
                name: test-binding
                namespace: ipam-e2e-alpha
              status:
                networkContextRef:
                  namespace: ipam-e2e-alpha
                  name: test-binding-network-some-location
                (length(conditions[?type == 'Ready' && status == 'True' && reason == 'NetworkContextReady']) == `1`): true

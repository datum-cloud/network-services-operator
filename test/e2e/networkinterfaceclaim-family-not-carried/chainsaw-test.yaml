# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# A claim asking for a family its network does not carry fails, naming the
# family, and allocates nothing.
#
# Every network carries IPv6 — a network without it is refused at admission —
# so the mismatch is a claim that asks for IPv4 on one that carries only IPv6.
# The check is NSO's own — it compares the two specs before it ever reaches
# IPAM — so a green result here says nothing about IPAM and everything about NSO
# refusing to ask for space it knows is wrong.
#
# A second claim on the SAME network, differing only in the family it asks for,
# allocates for real. It is the control that gives the absence its meaning: an
# IPAM this suite cannot read at all would otherwise look identical to an IPAM
# that was never asked.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: networkinterfaceclaim-family-not-carried
spec:
  cluster: nso-standard
  steps:
    - name: Deliver the network's presence to this location
      description: |
        At a location a NetworkContext arrives by propagation from the hub; no
        controller here creates one. The claim reconciler reads it for the
        address families the network carries and the MTU, so the scenario has to
        put it there, shaped as propagation delivers it: spec only, no status,
        no owner references.
      try:
        - apply:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkContext
              metadata:
                name: nic-family-net-us-central-1
                namespace: ipam-e2e-alpha
              spec:
                network:
                  name: nic-family-net
                location:
                  name: us-central-1
                ipFamilies:
                  - IPv6
                mtu: 1460

    - name: A claim asking for IPv4 on an IPv6 network is refused
      try:
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Network
              metadata:
                name: nic-family-net
                namespace: ipam-e2e-alpha
              spec:
                ipam:
                  mode: Auto
                ipFamilies:
                  - IPv6
        - assert:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Network
              metadata:
                name: nic-family-net
                namespace: ipam-e2e-alpha
              spec:
                ipFamilies:
                  - IPv6
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkInterfaceClaim
              metadata:
                name: nic-family-mismatch
                namespace: ipam-e2e-alpha
              spec:
                network:
                  name: nic-family-net
                ipFamilies:
                  - IPv4
        - assert:
            timeout: 120s
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkInterfaceClaim
              metadata:
                name: nic-family-mismatch
                namespace: ipam-e2e-alpha
              spec:
                ipFamilies:
                  - IPv4
              status:
                (conditions[?type == 'Bound'] | [0]):
                  status: "False"
                  reason: AddressFamilyNotCarried
                (conditions[?type == 'Allocated'] | [0].status): "False"
                (conditions[?type == 'Ready'] | [0].status): "False"
                (contains(conditions[?type == 'Bound'] | [0].message, 'IPv4')): true
      catch:
        - script:
            content: |
              kubectl -n ipam-e2e-alpha get network,networkinterfaceclaim -o yaml
              kubectl -n network-services-operator-system logs -l app.kubernetes.io/name=network-services-operator --tail=100

    - name: The same network satisfies the family it does carry
      description: |
        The positive control. Identical to the refused claim but for the family
        it asks for, which here is the default the claim would have taken
        anyway.
      try:
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkInterfaceClaim
              metadata:
                name: nic-family-canary
                namespace: ipam-e2e-alpha
              spec:
                network:
                  name: nic-family-net
                ipFamilies:
                  - IPv6
        - assert:
            timeout: 120s
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkInterfaceClaim
              metadata:
                name: nic-family-canary
                namespace: ipam-e2e-alpha
              status:
                (conditions[?type == 'Allocated'] | [0].status): "True"

    - name: The refusal allocated nothing
      description: |
        The whole IPClaim list is matched against the refused claim's prefix
        rather than the one name today's derivation produces, so an allocation
        made under a name this suite did not predict is still caught.
      try:
        - script:
            content: |
              set -eu
              IPAM=$(git rev-parse --show-toplevel)/hack/ipam-project-kubectl.sh
              ipam() { "$IPAM" project-alpha -n default "$@"; }

              claims=$(ipam get ipclaim -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
              echo "project-alpha IPClaims: $(echo $claims)"

              echo "$claims" | grep -qx 'nic-family-canary-f-ipv6' \
                || { echo "the canary's IPClaim is not visible in project-alpha — this suite cannot see allocations, so it cannot prove their absence"; exit 1; }

              for found in $(echo "$claims" | grep -E '^nic-family-mismatch-' || true); do
                echo "a refused claim still allocated ${found}"
                exit 1
              done

              if kubectl -n ipam-e2e-alpha get networkinterface nic-family-mismatch >/dev/null 2>&1; then
                echo "a refused claim still created a NetworkInterface"
                exit 1
              fi

# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# Two cell namespaces routing to two projects allocate out of two disjoint
# address spaces through the SAME class name, and neither project can see the
# other's IPClaims.
#
# datum-endpoint-v4 is the default IPv4 class in both projects and is backed by
# 10.128.0.0/16 in project-alpha and 10.129.0.0/16 in project-beta
# (test/e2e/fixtures/ipam/RANGES.md). A controller that routed every allocation
# to one project would still bind both claims — the octet is what makes the
# routing visible.
#
# ipam-e2e-legacy carries the pre-#196 "cluster-_project-alpha" label encoding
# and must land in project-alpha's space too.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: networkinterfaceclaim-project-isolation
spec:
  cluster: nso-standard
  steps:
    - name: Deliver the network's presence to this location
      description: |
        At a location a NetworkContext arrives by propagation from the hub; no
        controller here creates one. The claim reconciler reads it for the
        address families the network carries and the MTU, so the scenario has to
        put it there, shaped as propagation delivers it: spec only, no status,
        no owner references.
      try:
        - apply:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkContext
              metadata:
                name: nic-isolation-net-default-us-central-1
                namespace: ipam-e2e-alpha
              spec:
                network:
                  name: nic-isolation-net
                location:
                  name: us-central-1
                ipFamilies:
                  - IPv4
                mtu: 1460
        - apply:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkContext
              metadata:
                name: nic-isolation-net-default-us-central-1
                namespace: ipam-e2e-beta
              spec:
                network:
                  name: nic-isolation-net
                location:
                  name: us-central-1
                ipFamilies:
                  - IPv4
                mtu: 1460
        - apply:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkContext
              metadata:
                name: nic-isolation-net-default-us-central-1
                namespace: ipam-e2e-legacy
              spec:
                network:
                  name: nic-isolation-net
                location:
                  name: us-central-1
                ipFamilies:
                  - IPv4
                mtu: 1460

    - name: Claim an IPv4 address in each project
      try:
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Network
              metadata:
                name: nic-isolation-net
                namespace: ipam-e2e-alpha
              spec:
                ipam:
                  mode: Auto
                ipFamilies:
                  - IPv4
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Network
              metadata:
                name: nic-isolation-net
                namespace: ipam-e2e-beta
              spec:
                ipam:
                  mode: Auto
                ipFamilies:
                  - IPv4
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: Network
              metadata:
                name: nic-isolation-net
                namespace: ipam-e2e-legacy
              spec:
                ipam:
                  mode: Auto
                ipFamilies:
                  - IPv4
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkInterfaceClaim
              metadata:
                name: nic-isolation-alpha
                namespace: ipam-e2e-alpha
              spec:
                network:
                  name: nic-isolation-net
                ipFamilies:
                  - IPv4
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkInterfaceClaim
              metadata:
                name: nic-isolation-beta
                namespace: ipam-e2e-beta
              spec:
                network:
                  name: nic-isolation-net
                ipFamilies:
                  - IPv4
        - create:
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkInterfaceClaim
              metadata:
                name: nic-isolation-legacy
                namespace: ipam-e2e-legacy
              spec:
                network:
                  name: nic-isolation-net
                ipFamilies:
                  - IPv4
        - assert:
            timeout: 120s
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkInterfaceClaim
              metadata:
                name: nic-isolation-alpha
                namespace: ipam-e2e-alpha
              status:
                (conditions[?type == 'Allocated'] | [0].status): "True"
        - assert:
            timeout: 120s
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkInterfaceClaim
              metadata:
                name: nic-isolation-beta
                namespace: ipam-e2e-beta
              status:
                (conditions[?type == 'Allocated'] | [0].status): "True"
        - assert:
            timeout: 120s
            resource:
              apiVersion: networking.datumapis.com/v1alpha
              kind: NetworkInterfaceClaim
              metadata:
                name: nic-isolation-legacy
                namespace: ipam-e2e-legacy
              status:
                (conditions[?type == 'Allocated'] | [0].status): "True"
      catch:
        - script:
            content: |
              kubectl get networkinterfaceclaim -A -o yaml
              kubectl -n network-services-operator-system logs -l app.kubernetes.io/name=network-services-operator --tail=100

    - name: Each namespace allocated out of its own project's space
      try:
        - script:
            content: |
              set -eu
              address() { kubectl -n "$1" get networkinterfaceclaim "$2" -o jsonpath='{.status.addresses[0].address}'; }

              alpha=$(address ipam-e2e-alpha nic-isolation-alpha)
              beta=$(address ipam-e2e-beta nic-isolation-beta)
              legacy=$(address ipam-e2e-legacy nic-isolation-legacy)
              echo "alpha=${alpha} beta=${beta} legacy=${legacy}"

              echo "$alpha" | grep -Eq '^10\.128\.[0-9]+\.[0-9]+/32$' || { echo "ipam-e2e-alpha got ${alpha}, want project-alpha's 10.128.0.0/16"; exit 1; }
              echo "$beta" | grep -Eq '^10\.129\.[0-9]+\.[0-9]+/32$' || { echo "ipam-e2e-beta got ${beta}, want project-beta's 10.129.0.0/16"; exit 1; }
              echo "$legacy" | grep -Eq '^10\.128\.[0-9]+\.[0-9]+/32$' || { echo "ipam-e2e-legacy (legacy label encoding) got ${legacy}, want project-alpha's 10.128.0.0/16"; exit 1; }
              [ "$alpha" != "$beta" ] || { echo "both projects were handed ${alpha}"; exit 1; }

    - name: Neither project can see the other's IPClaims
      description: |
        Read back as each project in turn. A project that can read the other's
        IPClaim means the impersonation is not scoping anything, and every other
        assertion in this suite is coincidence.

        Each identity earns the right to be believed first: the two projects
        must find their own IPClaim, and the project-less request — which is
        meant to read nothing — must still reach IPAM, proving its blindness is
        scoping rather than a broken call. Its NotFound comes from the server,
        and the IPClasses it cannot see are the same ones a project can.

        That request is the same user with none of the three parent extras, so
        it is written out rather than routed through the wrapper: what is being
        tested is precisely the absence of the impersonation the wrapper exists
        to add.
      try:
        - script:
            content: |
              set -eu
              IPAM=$(git rev-parse --show-toplevel)/hack/ipam-tenant-kubectl.sh
              ipam() { proj=$1; shift; "$IPAM" "$proj" -n default "$@"; }
              # The same identity carrying none of the parent extras: no project,
              # so IPAM scopes it to nothing.
              noproject() { kubectl --as=e2e-tenant-tester "$@"; }

              visible() { ipam "$1" get ipclaim "$2" >/dev/null 2>&1; }

              visible project-alpha nic-isolation-alpha-f-ipv4 || { echo "project-alpha cannot see its own IPClaim"; exit 1; }
              visible project-beta nic-isolation-beta-f-ipv4 || { echo "project-beta cannot see its own IPClaim"; exit 1; }
              visible project-alpha nic-isolation-legacy-f-ipv4 || { echo "the legacy-labelled namespace did not allocate in project-alpha"; exit 1; }

              noproject get --raw /apis/ipam.miloapis.com/v1alpha1 >/dev/null \
                || { echo "the project-less request cannot reach IPAM at all, so it proves nothing about scoping"; exit 1; }
              classes=$(ipam project-alpha get ipclass -o name | wc -l | tr -d ' ')
              [ "$classes" -gt 0 ] || { echo "project-alpha sees no IPClass, so the fixtures are not readable as that project"; exit 1; }
              platform_classes=$(noproject get ipclass -o name | wc -l | tr -d ' ')
              [ "$platform_classes" -eq 0 ] || { echo "the project-less request reads ${platform_classes} IPClass objects; it is meant to hold no project"; exit 1; }
              denial=$(noproject -n default get ipclaim nic-isolation-alpha-f-ipv4 2>&1 || true)
              echo "$denial" | grep -Eq 'NotFound|Forbidden|forbidden|not found' \
                || { echo "the project-less refusal did not come from the server: ${denial}"; exit 1; }

              ! visible project-beta nic-isolation-alpha-f-ipv4 || { echo "project-beta can read project-alpha's IPClaim"; exit 1; }
              ! visible project-alpha nic-isolation-beta-f-ipv4 || { echo "project-alpha can read project-beta's IPClaim"; exit 1; }
              ! noproject -n default get ipclaim nic-isolation-alpha-f-ipv4 >/dev/null 2>&1 || { echo "the project-less request can read project-alpha's IPClaim"; exit 1; }
              ! noproject -n default get ipclaim nic-isolation-beta-f-ipv4 >/dev/null 2>&1 || { echo "the project-less request can read project-beta's IPClaim"; exit 1; }

    - name: The address IPAM holds is the address the claim published
      try:
        - script:
            content: |
              set -eu
              IPAM=$(git rev-parse --show-toplevel)/hack/ipam-tenant-kubectl.sh
              allocated() { "$IPAM" "$1" -n default get ipclaim "$2" -o jsonpath='{.status.allocatedCIDR}'; }

              check() {
                published=$(kubectl -n "$1" get networkinterfaceclaim "$2" -o jsonpath='{.status.addresses[0].address}')
                held=$(allocated "$3" "$2-f-ipv4")
                [ "$published" = "$held" ] || { echo "$2 published ${published}, IPAM holds ${held}"; exit 1; }
              }

              check ipam-e2e-alpha nic-isolation-alpha project-alpha
              check ipam-e2e-beta nic-isolation-beta project-beta
              check ipam-e2e-legacy nic-isolation-legacy project-alpha

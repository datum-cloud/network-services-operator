rule_files:
- controller-health-rules.yaml
evaluation_interval: 1m
tests:

  # Busy controllers at 90%, 30% and 10% errors: each tier fires for the controllers above it, once every
  # 5-minute slice of 15 minutes is above the threshold and `for` has passed, and never before.
  - interval: 1m
    input_series:
    - series: controller_runtime_reconcile_total{controller="gateway",result="error",cluster="prod",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+9x40
    - series: controller_runtime_reconcile_total{controller="gateway",result="success",cluster="prod",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+1x40
    - series: controller_runtime_reconcile_total{controller="domain",result="error",cluster="prod",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+3x40
    - series: controller_runtime_reconcile_total{controller="domain",result="success",cluster="prod",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+7x40
    - series: controller_runtime_reconcile_total{controller="subnet",result="error",cluster="prod",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+1x40
    - series: controller_runtime_reconcile_total{controller="subnet",result="success",cluster="prod",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+9x40
    alert_rule_test:
    - eval_time: 12m
      alertname: ControllerReconcileErrorRatioCritical
      exp_alerts: []
    - eval_time: 30m
      alertname: ControllerReconcileErrorRatioCritical
      exp_alerts:
      - exp_labels:
          severity: critical
          controller: gateway
          cluster: prod
          namespace: nso-system
          deployment: nso-controller-manager
        exp_annotations:
          summary: Controller gateway in prod/nso-system/nso-controller-manager reconcile error ratio is 90% (threshold 50%) — reconciliation is stalled
          description: More than 50% of the 'gateway' controller's reconcile attempts are failing in cluster 'prod', namespace 'nso-system' — it has effectively stopped applying changes. Treat as an active outage for anything this controller programs. Check controller logs for 'Reconciler error' entries. See ControllerReconcileErrorRatioHigh for initial diagnosis.
          runbook_url: https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/controller-health.md#controllerreconcileerrorratiocritical
    - eval_time: 35m
      alertname: ControllerReconcileErrorRatioHigh
      exp_alerts:
      - exp_labels:
          severity: warning
          controller: gateway
          cluster: prod
          namespace: nso-system
          deployment: nso-controller-manager
        exp_annotations:
          summary: Controller gateway in prod/nso-system/nso-controller-manager reconcile error ratio is 90% (threshold 20%)
          description: 'More than 20% of the ''gateway'' controller''s reconcile attempts are failing in cluster ''prod'', namespace ''nso-system''. It cannot apply its intent — changes are not reaching their target and the last successfully written state stays programmed. Common causes: an object fails CRD validation, an API server admission error, or a permissions regression. Check controller logs for ''Reconciler error'' entries on the ''gateway'' controller.'
          runbook_url: https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/controller-health.md#controllerreconcileerrorratiohigh
      - exp_labels:
          severity: warning
          controller: domain
          cluster: prod
          namespace: nso-system
          deployment: nso-controller-manager
        exp_annotations:
          summary: Controller domain in prod/nso-system/nso-controller-manager reconcile error ratio is 30% (threshold 20%)
          description: 'More than 20% of the ''domain'' controller''s reconcile attempts are failing in cluster ''prod'', namespace ''nso-system''. It cannot apply its intent — changes are not reaching their target and the last successfully written state stays programmed. Common causes: an object fails CRD validation, an API server admission error, or a permissions regression. Check controller logs for ''Reconciler error'' entries on the ''domain'' controller.'
          runbook_url: https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/controller-health.md#controllerreconcileerrorratiohigh

  # Two clusters running the same controller: the unhealthy one fires alone, and the alert names it.
  - interval: 1m
    input_series:
    - series: controller_runtime_reconcile_total{controller="gateway",result="error",cluster="staging",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+9x40
    - series: controller_runtime_reconcile_total{controller="gateway",result="success",cluster="staging",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+1x40
    - series: controller_runtime_reconcile_total{controller="gateway",result="error",cluster="prod",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+1x40
    - series: controller_runtime_reconcile_total{controller="gateway",result="success",cluster="prod",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+9x40
    alert_rule_test:
    - eval_time: 30m
      alertname: ControllerReconcileErrorRatioCritical
      exp_alerts:
      - exp_labels:
          severity: critical
          controller: gateway
          cluster: staging
          namespace: nso-system
          deployment: nso-controller-manager
        exp_annotations:
          summary: Controller gateway in staging/nso-system/nso-controller-manager reconcile error ratio is 90% (threshold 50%) — reconciliation is stalled
          description: More than 50% of the 'gateway' controller's reconcile attempts are failing in cluster 'staging', namespace 'nso-system' — it has effectively stopped applying changes. Treat as an active outage for anything this controller programs. Check controller logs for 'Reconciler error' entries. See ControllerReconcileErrorRatioHigh for initial diagnosis.
          runbook_url: https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/controller-health.md#controllerreconcileerrorratiocritical

  # Two binaries in one namespace with a controller of the same name: the deployment, taken from the pod's
  # name, keeps them apart, so the healthy one neither hides nor joins the failing one.
  - interval: 1m
    input_series:
    - series: controller_runtime_reconcile_total{controller="project",result="error",cluster="prod",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+9x40
    - series: controller_runtime_reconcile_total{controller="project",result="success",cluster="prod",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+1x40
    - series: controller_runtime_reconcile_total{controller="project",result="error",cluster="prod",namespace="nso-system",pod="other-controller-manager-5c6d7e8f9-q8w7e"}
      values: 0+0x40
    - series: controller_runtime_reconcile_total{controller="project",result="success",cluster="prod",namespace="nso-system",pod="other-controller-manager-5c6d7e8f9-q8w7e"}
      values: 0+10x40
    alert_rule_test:
    - eval_time: 30m
      alertname: ControllerReconcileErrorRatioCritical
      exp_alerts:
      - exp_labels:
          severity: critical
          controller: project
          cluster: prod
          namespace: nso-system
          deployment: nso-controller-manager
        exp_annotations:
          summary: Controller project in prod/nso-system/nso-controller-manager reconcile error ratio is 90% (threshold 50%) — reconciliation is stalled
          description: More than 50% of the 'project' controller's reconcile attempts are failing in cluster 'prod', namespace 'nso-system' — it has effectively stopped applying changes. Treat as an active outage for anything this controller programs. Check controller logs for 'Reconciler error' entries. See ControllerReconcileErrorRatioHigh for initial diagnosis.
          runbook_url: https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/controller-health.md#controllerreconcileerrorratiocritical

  # A 4-minute burst of errors on a busy, healthy controller, as an API server roll makes: the 15-minute
  # minimum stays low, so nothing fires.
  - interval: 1m
    input_series:
    - series: controller_runtime_reconcile_total{controller="httpproxy",result="error",cluster="prod",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0x19 60+60x3 240x20
    - series: controller_runtime_reconcile_total{controller="httpproxy",result="success",cluster="prod",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+10x43
    alert_rule_test:
    - eval_time: 30m
      alertname: ControllerReconcileErrorRatioCritical
      exp_alerts: []
    - eval_time: 40m
      alertname: ControllerReconcileErrorRatioCritical
      exp_alerts: []
    - eval_time: 40m
      alertname: ControllerReconcileErrorRatioHigh
      exp_alerts: []

  # A sparse controller that fails every reconcile, production's `instance-projector` (compute#194): it is not
  # busy, so neither tier fires. Its errors in every hour make ControllerReconcileErrorFloor's case.
  - interval: 1m
    input_series:
    - series: controller_runtime_reconcile_total{controller="instance-projector",result="error",cluster="prod",namespace="compute-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+0x19 4+0x19 8+0x19 12+0x19 16+0x19
    alert_rule_test:
    - eval_time: 45m
      alertname: ControllerReconcileErrorRatioCritical
      exp_alerts: []
    - eval_time: 75m
      alertname: ControllerReconcileErrorRatioCritical
      exp_alerts: []
    - eval_time: 75m
      alertname: ControllerReconcileErrorRatioHigh
      exp_alerts: []

  # A constant error rate against a varying success rate, the `dnsrecordset-powerdns` case of NSO#326: the
  # alert fires on the controller's own merits, holds through the dilution by keep_firing_for, and resolves
  # once the hold lapses.
  - interval: 1m
    input_series:
    - series: controller_runtime_reconcile_total{controller="dnsrecordset-powerdns",result="error",cluster="prod",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+4x120
    - series: controller_runtime_reconcile_total{controller="dnsrecordset-powerdns",result="success",cluster="prod",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+1x59 159+100x60
    alert_rule_test:
    - eval_time: 45m
      alertname: ControllerReconcileErrorRatioCritical
      exp_alerts:
      - exp_labels:
          severity: critical
          controller: dnsrecordset-powerdns
          cluster: prod
          namespace: nso-system
          deployment: nso-controller-manager
        exp_annotations:
          summary: Controller dnsrecordset-powerdns in prod/nso-system/nso-controller-manager reconcile error ratio is 80% (threshold 50%) — reconciliation is stalled
          description: More than 50% of the 'dnsrecordset-powerdns' controller's reconcile attempts are failing in cluster 'prod', namespace 'nso-system' — it has effectively stopped applying changes. Treat as an active outage for anything this controller programs. Check controller logs for 'Reconciler error' entries. See ControllerReconcileErrorRatioHigh for initial diagnosis.
          runbook_url: https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/controller-health.md#controllerreconcileerrorratiocritical
    - eval_time: 70m
      alertname: ControllerReconcileErrorRatioCritical
      exp_alerts:
      - exp_labels:
          severity: critical
          controller: dnsrecordset-powerdns
          cluster: prod
          namespace: nso-system
          deployment: nso-controller-manager
        exp_annotations:
          summary: Controller dnsrecordset-powerdns in prod/nso-system/nso-controller-manager reconcile error ratio is 80% (threshold 50%) — reconciliation is stalled
          description: More than 50% of the 'dnsrecordset-powerdns' controller's reconcile attempts are failing in cluster 'prod', namespace 'nso-system' — it has effectively stopped applying changes. Treat as an active outage for anything this controller programs. Check controller logs for 'Reconciler error' entries. See ControllerReconcileErrorRatioHigh for initial diagnosis.
          runbook_url: https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/controller-health.md#controllerreconcileerrorratiocritical
    - eval_time: 80m
      alertname: ControllerReconcileErrorRatioCritical
      exp_alerts:
      - exp_labels:
          severity: critical
          controller: dnsrecordset-powerdns
          cluster: prod
          namespace: nso-system
          deployment: nso-controller-manager
        exp_annotations:
          summary: Controller dnsrecordset-powerdns in prod/nso-system/nso-controller-manager reconcile error ratio is 80% (threshold 50%) — reconciliation is stalled
          description: More than 50% of the 'dnsrecordset-powerdns' controller's reconcile attempts are failing in cluster 'prod', namespace 'nso-system' — it has effectively stopped applying changes. Treat as an active outage for anything this controller programs. Check controller logs for 'Reconciler error' entries. See ControllerReconcileErrorRatioHigh for initial diagnosis.
          runbook_url: https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/controller-health.md#controllerreconcileerrorratiocritical
    - eval_time: 110m
      alertname: ControllerReconcileErrorRatioCritical
      exp_alerts: []

  # A sparse controller that fails every reconcile, as production's `instance-projector` did: it pages nothing
  # (above), and ControllerReconcileErrorFloor warns its team once its errors hold through 24 hours, not before.
  - interval: 5m
    input_series:
    - series: controller_runtime_reconcile_total{controller="instance-projector",result="error",cluster="prod",namespace="compute-system",pod="compute-manager-6f7d8c9b5-m4n5b"}
      values: 0+1x320
    alert_rule_test:
    - eval_time: 23h
      alertname: ControllerReconcileErrorFloor
      exp_alerts: []
    - eval_time: 25h
      alertname: ControllerReconcileErrorFloor
      exp_alerts:
      - exp_labels:
          severity: warning
          controller: instance-projector
          cluster: prod
          namespace: compute-system
          deployment: compute-manager
        exp_annotations:
          summary: Controller instance-projector in prod/compute-system/compute-manager has had reconcile errors in each of the last 24 hours
          description: The 'instance-projector' controller in cluster 'prod', namespace 'compute-system' has returned reconcile errors in every hour for a day. A steady error floor is almost always a failure no retry can fix, or a wait, returned as a plain error. Find the objects in the controller logs and fix the controller or the data; see the runbook.
          runbook_url: https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/controller-health.md#controllerreconcileerrorfloor
    - eval_time: 25h
      alertname: ControllerReconcileErrorRatioCritical
      exp_alerts: []

  # Errors in 23 of the last 24 hours: one quiet hour breaks the floor, because errors that come and go are the
  # stall alerts' business, not this one's.
  - interval: 5m
    input_series:
    - series: controller_runtime_reconcile_total{controller="network",result="error",cluster="prod",namespace="nso-system",pod="nso-controller-manager-7d9f8b6c4-x2k9p"}
      values: 0+1x200 200x24 201+1x100
    alert_rule_test:
    - eval_time: 26h
      alertname: ControllerReconcileErrorFloor
      exp_alerts: []

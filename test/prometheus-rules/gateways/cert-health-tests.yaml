rule_files:
  - cert-health-rules.yaml

evaluation_interval: 30s

tests:
  # GatewayListenerCertUnusable — listener withheld for more than 5 minutes
  - interval: 1m
    input_series:
      - series: 'nso_gateway_listener_cert_withheld{project="project-a", resource_namespace="customer-ns", resource_name="my-gateway", listener="https-custom", hostname="example.com", reason="InvalidCertificateRef"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 6m
        alertname: GatewayListenerCertUnusable
        exp_alerts:
          - exp_labels:
              severity: warning
              service: network-services
              team: sre
              project: project-a
              resource_namespace: customer-ns
              resource_name: my-gateway
              listener: https-custom
              hostname: example.com
              reason: InvalidCertificateRef
            exp_annotations:
              summary: "Gateway listener project-a/customer-ns/my-gateway/https-custom has an unusable TLS certificate"
              description: "NSO has withheld listener https-custom (hostname example.com) on Gateway my-gateway in project project-a, namespace customer-ns because its TLS certificate is unusable (reason: InvalidCertificateRef). The customer cannot serve HTTPS on this hostname. Check the cert-manager Certificate and Secret in the downstream cluster."
              runbook_url: "https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-tls-certificates.md#gatewaylistenercertunusable"

  # GatewayListenerCertUnusable — listener withheld for less than 5 minutes (should NOT alert)
  - interval: 1m
    input_series:
      - series: 'nso_gateway_listener_cert_withheld{project="project-a", resource_namespace="customer-ns", resource_name="my-gateway", listener="https-custom", hostname="example.com", reason="InvalidCertificateRef"}'
        values: '1+0x2'
    alert_rule_test:
      - eval_time: 3m
        alertname: GatewayListenerCertUnusable
        exp_alerts: []

  # GatewayListenerCertUnusable — listener is healthy (withheld=0, should NOT alert)
  - interval: 1m
    input_series:
      - series: 'nso_gateway_listener_cert_withheld{project="project-a", resource_namespace="customer-ns", resource_name="healthy-gateway", listener="https-custom", hostname="ok.com", reason="InvalidCertificateRef"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 6m
        alertname: GatewayListenerCertUnusable
        exp_alerts: []

  # GatewayListenerCertUnusable — hostname's DNS points away from the gateway (customer-caused, should NOT alert)
  - interval: 1m
    input_series:
      - series: 'nso_gateway_listener_cert_withheld{project="project-a", resource_namespace="customer-ns", resource_name="my-gateway", listener="https-elsewhere", hostname="elsewhere.example.com", reason="DNSNotPointingToGateway"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: GatewayListenerCertUnusable
        exp_alerts: []

  # GatewayListenerCertUnusable — wildcard hostname's DNS delegation is missing (customer-caused, should NOT alert)
  - interval: 1m
    input_series:
      - series: 'nso_gateway_listener_cert_withheld{project="project-a", resource_namespace="customer-ns", resource_name="my-gateway", listener="https-wildcard", hostname="*.example.com", reason="DNSDelegationMissing"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: GatewayListenerCertUnusable
        exp_alerts: []

  # GatewayListenerCertUnusable — a DNS-caused listener does not mask a platform-caused one on the same Gateway
  - interval: 1m
    input_series:
      - series: 'nso_gateway_listener_cert_withheld{project="project-a", resource_namespace="customer-ns", resource_name="my-gateway", listener="https-elsewhere", hostname="elsewhere.example.com", reason="DNSNotPointingToGateway"}'
        values: '1+0x10'
      - series: 'nso_gateway_listener_cert_withheld{project="project-a", resource_namespace="customer-ns", resource_name="my-gateway", listener="https-custom", hostname="example.com", reason="InvalidCertificateRef"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: GatewayListenerCertUnusable
        exp_alerts:
          - exp_labels:
              severity: warning
              service: network-services
              team: sre
              project: project-a
              resource_namespace: customer-ns
              resource_name: my-gateway
              listener: https-custom
              hostname: example.com
              reason: InvalidCertificateRef
            exp_annotations:
              summary: "Gateway listener project-a/customer-ns/my-gateway/https-custom has an unusable TLS certificate"
              description: "NSO has withheld listener https-custom (hostname example.com) on Gateway my-gateway in project project-a, namespace customer-ns because its TLS certificate is unusable (reason: InvalidCertificateRef). The customer cannot serve HTTPS on this hostname. Check the cert-manager Certificate and Secret in the downstream cluster."
              runbook_url: "https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-tls-certificates.md#gatewaylistenercertunusable"

  # GatewayListenerCertExpiringSoon — cert expires in 5 days (within 7-day threshold)
  # At eval_time 62m (3720s), expiry_time = 3720 + 5*86400 = 435720
  - interval: 1m
    input_series:
      - series: 'nso_gateway_listener_cert_expiry_time{project="project-a", resource_namespace="customer-ns", resource_name="my-gateway", listener="https-custom", hostname="example.com", secret="my-gateway-https-custom"}'
        values: '435720+0x62'
    alert_rule_test:
      - eval_time: 62m
        alertname: GatewayListenerCertExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              service: network-services
              team: sre
              project: project-a
              resource_namespace: customer-ns
              resource_name: my-gateway
              listener: https-custom
              hostname: example.com
              secret: my-gateway-https-custom
            exp_annotations:
              summary: "TLS certificate for Gateway listener project-a/customer-ns/my-gateway/https-custom expires in less than 7 days"
              description: "The cert-manager Certificate for listener https-custom (hostname example.com, secret my-gateway-https-custom) on Gateway my-gateway in project project-a, namespace customer-ns expires within 7 days. cert-manager should renew it automatically, but renewal fails if the domain's DNS no longer points to this gateway. Verify the Certificate is Ready=True in the downstream cluster."
              runbook_url: "https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-tls-certificates.md#gatewaylistenercertexpiringsoon"

  # GatewayListenerCertExpiringSoon — cert expires in 8 days (outside threshold, should NOT alert)
  # At eval_time 62m (3720s), expiry_time = 3720 + 8*86400 = 694920
  - interval: 1m
    input_series:
      - series: 'nso_gateway_listener_cert_expiry_time{project="project-a", resource_namespace="customer-ns", resource_name="my-gateway", listener="https-custom", hostname="example.com", secret="my-gateway-https-custom"}'
        values: '694920+0x62'
    alert_rule_test:
      - eval_time: 62m
        alertname: GatewayListenerCertExpiringSoon
        exp_alerts: []

  # TLSBackstopPruningChains — backstop actively dropping chains for more than 2 minutes
  - interval: 1m
    input_series:
      - series: 'nso_extension_tls_pruned_chains_active'
        values: '3+0x2'
    alert_rule_test:
      - eval_time: 3m
        alertname: TLSBackstopPruningChains
        exp_alerts:
          - exp_labels:
              severity: warning
              service: network-services
              team: sre
            exp_annotations:
              summary: "Extension server is dropping 3 broken certificate(s) to protect the edge listener"
              description: "The extension server is dropping 3 broken certificate(s) from the configuration it sends to the edge gateway. Check extension server logs for 'pruned invalid TLS chains' to find the affected hostnames. If GatewayListenerCertUnusable is also firing, both layers of protection are working as expected. If only this alert fires, the controller may have missed the listener."
              runbook_url: "https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-tls-certificates.md#tlsbackstoppruningchains"

  # TLSBackstopPruningChains — backstop just started, under 2 minutes (should NOT alert)
  - interval: 1m
    input_series:
      - series: 'nso_extension_tls_pruned_chains_active'
        values: '2+0x0'
    alert_rule_test:
      - eval_time: 1m
        alertname: TLSBackstopPruningChains
        exp_alerts: []

  # TLSBackstopPruningChains — no chains pruned (should NOT alert)
  - interval: 1m
    input_series:
      - series: 'nso_extension_tls_pruned_chains_active'
        values: '0+0x2'
    alert_rule_test:
      - eval_time: 3m
        alertname: TLSBackstopPruningChains
        exp_alerts: []

  # TLSBackstopListenerAllCertsBroken — all certs broken for more than 2 minutes (critical)
  - interval: 1m
    input_series:
      - series: 'nso_extension_tls_listeners_left_intact_active'
        values: '1+0x2'
    alert_rule_test:
      - eval_time: 3m
        alertname: TLSBackstopListenerAllCertsBroken
        exp_alerts:
          - exp_labels:
              severity: critical
              service: network-services
              team: sre
            exp_annotations:
              summary: "1 edge listener(s) have every TLS certificate broken and cannot be protected"
              description: "The extension server left 1 edge listener(s) untouched because every certificate on them is broken. It never removes a listener entirely, so the edge will reject the configuration update for those listeners (EnvoyListenerUpdateRejected confirms it). This means the controller did not withhold the listener before it reached the edge. Check extension server logs for 'listeners_left_intact' and why the controller did not withhold the listener."
              runbook_url: "https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-tls-certificates.md#tlsbackstoplistenerallcertsbroken"

  # TLSBackstopListenerAllCertsBroken — condition just started, under 2 minutes (should NOT alert)
  - interval: 1m
    input_series:
      - series: 'nso_extension_tls_listeners_left_intact_active'
        values: '2+0x0'
    alert_rule_test:
      - eval_time: 1m
        alertname: TLSBackstopListenerAllCertsBroken
        exp_alerts: []

  # TLSBackstopListenerAllCertsBroken — no intact listeners (should NOT alert)
  - interval: 1m
    input_series:
      - series: 'nso_extension_tls_listeners_left_intact_active'
        values: '0+0x2'
    alert_rule_test:
      - eval_time: 3m
        alertname: TLSBackstopListenerAllCertsBroken
        exp_alerts: []

# GatewayPlatformPartNotReady, the per-Gateway page on the platform's part. Written by gen_page_tests.py;
# one case per input_series block, in this order:
#   - one Gateway pages after 5 minutes, not before
#   - ten Gateways are ten alerts; the route makes them one page
#   - a customer listener only does not page
#   - a custom listener named https does not page
#   - a 3-minute dip does not page
#   - repeated 3-minute dips do not page
#   - recovery clears the page
#   - Accepted False alone pages
#   - a failure two exporter pods report is one alert
#   - a Gateway being deleted does not page
#   - a missing status does not page
#   - a new Gateway pages 5 minutes after it turns 60 s old
#   - not Accepted since more than 7 days, on a Gateway older than 7 days, does not page
#   - older than 7 days and Accepted, its default listener breaks: pages
#   - no controller: the default condition time is far older than the Gateway, which pages in its first 7 days
rule_files:
- nso-slo-rules.yaml
evaluation_interval: 30s
tests:
- interval: 1m
  input_series:
  - series: datum_cloud_networking_gateway_created{resourcemanager_datumapis_com_project_name="test-project", resource_namespace="test-ns", resource_name="gw-a"}
    values: -120+0x20
  - series: datum_cloud_networking_gateway_status{resourcemanager_datumapis_com_project_name="test-project", resource_namespace="test-ns", resource_name="gw-a", type="Accepted"}
    values: 1x20
  - series: datum_cloud_networking_gateway_status_listener_programmed{resourcemanager_datumapis_com_project_name="test-project", resource_namespace="test-ns", resource_name="gw-a", listener="default-http"}
    values: 1x20
  - series: datum_cloud_networking_gateway_status_listener_programmed{resourcemanager_datumapis_com_project_name="test-project", resource_namespace="test-ns", resource_name="gw-a", listener="default-https"}
    values: '0x20'
  alert_rule_test:
  - eval_time: 4m
    alertname: GatewayPlatformPartNotReady
    exp_alerts: []
  - eval_time: 5m
    alertname: GatewayPlatformPartNotReady
    exp_alerts:
    - exp_labels:
        severity: critical
        service: network-services
        team: delivery
        project: test-project
        subject: test-project/test-ns/gw-a
        subject_kind: Gateway
        subject_name: gw-a
        subject_namespace: test-ns
        subject_group: gateway.networking.k8s.io
        resourcemanager_datumapis_com_project_name: test-project
        resource_namespace: test-ns
        resource_name: gw-a
      exp_annotations:
        summary: Gateway gw-a is not accepted or does not serve its own hostname
        description: Gateway gw-a in project test-project, namespace test-ns, is not Accepted, or a default listener, which serves the Gateway's own hostname with the platform's certificate, is not Programmed.
        impact: The Gateway does not serve its own hostname.
        runbook_url: https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-readiness.md#gatewayplatformpartnotready

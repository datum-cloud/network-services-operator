groups:
- name: nso-slo
  interval: 30s
  rules:
  - alert: GatewayNotReadySLOViolation
    expr: "(\n  (\n    max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (time() - datum_cloud_networking_gateway_created) > 60\n    and on (resourcemanager_datumapis_com_project_name,\
      \ resource_namespace, resource_name)\n    max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (datum_cloud_networking_gateway_status{type=~\"Accepted|Programmed\"\
      })\n  )\n  unless on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)\n  (\n    sum by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)\
      \ (\n      max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name, type) (datum_cloud_networking_gateway_status{type=~\"Accepted|Programmed\"})\n    ) == 2\n  )\n  unless\
      \ on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)\n  datum_cloud_networking_gateway_deleted\n)\nunless (\n  (\n    max by (resourcemanager_datumapis_com_project_name,\
      \ resource_namespace, resource_name) (time() - datum_cloud_networking_gateway_created) > 604800\n  )\n  unless (\n    sum by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)\
      \ (\n      max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name, type) (\n        max_over_time(datum_cloud_networking_gateway_status{type=~\"Accepted|Programmed\"\
      }[7d])\n      )\n    ) == 2\n  )\n)\n"
    for: 0s
    labels:
      severity: warning
      service: network-services
      team: delivery
      project: '{{ $labels.resourcemanager_datumapis_com_project_name }}'
      subject: '{{ $labels.resourcemanager_datumapis_com_project_name }}/{{ $labels.resource_namespace }}/{{ $labels.resource_name }}'
      subject_kind: Gateway
      subject_name: '{{ $labels.resource_name }}'
      subject_namespace: '{{ $labels.resource_namespace }}'
      subject_group: gateway.networking.k8s.io
    annotations:
      summary: Gateway {{ $labels.resource_name }} is taking longer than 60 seconds to reach Ready status
      description: Gateway {{ $labels.resource_name }} in namespace {{ $labels.resource_namespace }} has been in creation state for {{ $value }} seconds without reaching Ready status (Accepted=True AND
        Programmed=True), which exceeds the 60-second SLO threshold.
      runbook_url: https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-readiness.md#gatewaynotreadysloviolation
  - alert: GatewayDegradedSLOViolation
    expr: "(\n  (\n    max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (\n      time() - datum_cloud_networking_gateway_status_condition_last_transition_time{type=~\"\
      Accepted|Programmed\", status=\"False\"}\n    ) > 60\n  )\n  and on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)\n  (\n    sum by (resourcemanager_datumapis_com_project_name,\
      \ resource_namespace, resource_name) (\n      max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name, type) (datum_cloud_networking_gateway_status{type=~\"Accepted|Programmed\"\
      })\n    ) < 2\n  )\n  unless on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)\n  datum_cloud_networking_gateway_deleted\n)\nunless (\n  (\n    max by (resourcemanager_datumapis_com_project_name,\
      \ resource_namespace, resource_name) (time() - datum_cloud_networking_gateway_created) > 604800\n  )\n  unless (\n    sum by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)\
      \ (\n      max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name, type) (\n        max_over_time(datum_cloud_networking_gateway_status{type=~\"Accepted|Programmed\"\
      }[7d])\n      )\n    ) == 2\n  )\n)\n"
    for: 0s
    labels:
      severity: warning
      service: network-services
      team: delivery
      project: '{{ $labels.resourcemanager_datumapis_com_project_name }}'
      subject: '{{ $labels.resourcemanager_datumapis_com_project_name }}/{{ $labels.resource_namespace }}/{{ $labels.resource_name }}'
      subject_kind: Gateway
      subject_name: '{{ $labels.resource_name }}'
      subject_namespace: '{{ $labels.resource_namespace }}'
      subject_group: gateway.networking.k8s.io
    annotations:
      summary: Gateway {{ $labels.resource_name }} has been degraded for over 60 seconds
      description: Gateway {{ $labels.resource_name }} in namespace {{ $labels.resource_namespace }} has been in a degraded state for over 60 seconds without recovering, which exceeds the 60-second SLO
        threshold.
      runbook_url: https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-readiness.md#gatewaydegradedsloviolation
  - alert: GatewayPlatformPartNotReady
    expr: "(\n  (\n    max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (datum_cloud_networking_gateway_status{type=\"Accepted\"}) == 0\n    or\n    min by (resourcemanager_datumapis_com_project_name,\
      \ resource_namespace, resource_name) (\n      max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name, listener) (\n        datum_cloud_networking_gateway_status_listener_programmed{listener=~\"\
      default-https?\"}\n      )\n    ) == 0\n  )\n  and on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)\n  max by (resourcemanager_datumapis_com_project_name, resource_namespace,\
      \ resource_name) (time() - datum_cloud_networking_gateway_created) > 60\n)\nunless on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)\ndatum_cloud_networking_gateway_deleted\n\
      unless on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)\n(\n  max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (time() - datum_cloud_networking_gateway_created)\
      \ > 604800\n  and on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)\n  max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (\n \
      \   time() - datum_cloud_networking_gateway_status_condition_last_transition_time{type=\"Accepted\", status!=\"True\"}\n  ) > 604800\n)\n"
    for: 5m
    labels:
      severity: critical
      service: network-services
      team: delivery
      project: '{{ $labels.resourcemanager_datumapis_com_project_name }}'
      subject: '{{ $labels.resourcemanager_datumapis_com_project_name }}/{{ $labels.resource_namespace }}/{{ $labels.resource_name }}'
      subject_kind: Gateway
      subject_name: '{{ $labels.resource_name }}'
      subject_namespace: '{{ $labels.resource_namespace }}'
      subject_group: gateway.networking.k8s.io
    annotations:
      summary: Gateway {{ $labels.resource_name }} is not accepted or does not serve its own hostname
      description: Gateway {{ $labels.resource_name }} in project {{ $labels.resourcemanager_datumapis_com_project_name }}, namespace {{ $labels.resource_namespace }}, is not Accepted, or a default listener,
        which serves the Gateway's own hostname with the platform's certificate, is not Programmed.
      impact: The Gateway does not serve its own hostname.
      runbook_url: https://github.com/datum-cloud/network-services-operator/blob/main/docs/runbooks/gateway-readiness.md#gatewayplatformpartnotready
  - alert: GatewayNeverProgrammed
    expr: "(\n  max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (time() - datum_cloud_networking_gateway_created) > 604800\n)\nunless (\n  sum by (resourcemanager_datumapis_com_project_name,\
      \ resource_namespace, resource_name) (\n    max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name, type) (\n      max_over_time(datum_cloud_networking_gateway_status{type=~\"\
      Accepted|Programmed\"}[7d])\n    )\n  ) == 2\n)\n"
    for: 1h
    labels:
      service: network-services
      severity: info
      team: delivery
    annotations:
      description: Gateway {{ $labels.resource_name }} in namespace {{ $labels.resource_namespace }} was created {{ $value }} seconds ago and has not been both Accepted and Programmed at any point in the
        last 7 days. It no longer pages, because a 60-second readiness objective cannot be met retroactively, but it is still broken and still counts against the readiness SLO.
      runbook_url: https://github.com/datum-cloud/infra/blob/main/docs/runbooks/gateway-never-programmed.md
      summary: Gateway {{ $labels.resource_name }} has never reached Ready and has stopped paging

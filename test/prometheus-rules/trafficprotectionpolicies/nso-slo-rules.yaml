groups:
- name: nso-slo
  interval: 30s
  rules:
  - alert: TrafficProtectionPolicyNotProgrammedSLOViolation
    expr: "(\n  max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name, ancestor_kind, ancestor_name, ancestor_section) (\n    time() - datum_cloud_networking_trafficprotectionpolicy_status_ancestor_programmed_last_transition_time\n\
      \  ) > 300\n  and on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name, ancestor_kind, ancestor_name, ancestor_section)\n  max by (resourcemanager_datumapis_com_project_name,\
      \ resource_namespace, resource_name, ancestor_kind, ancestor_name, ancestor_section) (\n    datum_cloud_networking_trafficprotectionpolicy_status_ancestor_programmed\n  ) == 0\n  and on (resourcemanager_datumapis_com_project_name,\
      \ resource_namespace, resource_name, ancestor_kind, ancestor_name, ancestor_section)\n  max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name, ancestor_kind, ancestor_name,\
      \ ancestor_section) (\n    datum_cloud_networking_trafficprotectionpolicy_status_ancestor_accepted\n  ) == 1\n)\nunless on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name,\
      \ ancestor_kind, ancestor_name, ancestor_section)\n(\n  max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name, ancestor_kind, ancestor_name, ancestor_section) (\n \
      \   max_over_time(datum_cloud_networking_trafficprotectionpolicy_status_ancestor_programmed[7d])\n  ) == 0\n  and on (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name)\n\
      \  max by (resourcemanager_datumapis_com_project_name, resource_namespace, resource_name) (\n    time() - datum_cloud_networking_trafficprotectionpolicy_created\n  ) > 604800\n)\n"
    for: 0s
    labels:
      severity: warning
      subject: "{{ $labels.resourcemanager_datumapis_com_project_name }}/{{ $labels.resource_namespace }}/{{ $labels.resource_name }}"
      subject_kind: TrafficProtectionPolicy
      subject_name: "{{ $labels.resource_name }}"
      subject_namespace: "{{ $labels.resource_namespace }}"
      subject_group: networking.datumapis.com
      slo_violation: 'true'
      service: network-services
      team: sre
    annotations:
      summary: TrafficProtectionPolicy {{ $labels.resource_name }} is not programmed on {{ $labels.ancestor_kind }} {{ $labels.ancestor_name }}
      description: TrafficProtectionPolicy {{ $labels.resource_name }} in namespace {{ $labels.resource_namespace }} is Accepted on {{ $labels.ancestor_kind }} {{ $labels.ancestor_name }}, and its Programmed
        condition has been False for {{ $value }} seconds. An edge that holds the policy has not built its current generation.
